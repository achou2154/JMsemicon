async function saveVehUpdate(vid, kind){
  const v=(db.vehicles||[]).find(x=>String(x.id)===String(vid)); if(!v||!currentEmp) return;
  let payload={};
  if(kind==='insurance'){
    payload={insurer:document.getElementById('vu-insurer')?.value?.trim()||'', insStart:getDateVal('vu-start'), insEnd:getDateVal('vu-end')};
    if(!payload.insurer||!payload.insStart||!payload.insEnd){ showToast('⚠️ 보험사·가입일·만기일을 모두 입력하세요'); return; }
    if(!checkDateOrder(payload.insStart,payload.insEnd,'보험')) return;
  } else if(kind==='inspection'){
    const d=getDateVal('vu-date'); if(!d){ showToast('⚠️ 검사 완료일을 입력하세요'); return; }
    payload={inspectDate:d, newExpire:vehCalcNextExpire(v,d)};
  } else {
    const km=document.getElementById('vu-km')?.value, d=getDateVal('vu-date');
    if(km===''||km==null||!d){ showToast('⚠️ 주행거리와 기준일을 입력하세요'); return; }
    payload={km:Number(km), date:d};
  }
  const file=document.getElementById('vu-photo')?.files?.[0];
  if(!file&&!isAdmin){ showToast('⚠️ 사진을 첨부해 주세요'); return; }
  const btn=document.getElementById('vu-save-btn'); if(btn) btn.disabled=true;
  let photoUrl='';
  try{ photoUrl=await vehUpload(file); }catch(e){ showToast('⚠️ 사진 업로드 실패: '+e.message); if(btn) btn.disabled=false; return; }
  const row={vehicle_id:v.id, emp_id:currentEmp.id, kind, payload, photo_url:photoUrl, status:isAdmin?'approved':'pending'};
  if(isAdmin) row.processed_at=new Date().toISOString();
  const saved=await sbInsert('vehicle_updates',row);
  if(!saved){ showToast('⚠️ 저장 실패'); if(btn) btn.disabled=false; return; }
  const u=normalizeVehUpdate(saved);
  db.vehicleUpdates.unshift(u);
  if(isAdmin){
    const ok=await applyVehUpdate(u,v);
    showToast(ok?'✅ 반영되었습니다':'⚠️ 차량 정보 반영 실패');
  } else {
    showToast('✅ 신청 완료 — 관리자 승인 후 반영됩니다');
    await loadAdminEmails();
    vehSendMail(adminEmails,'[근태관리] '+currentEmp.name+' 님의 차량 '+VEH_UPDATE_LABEL[kind]+' 승인 요청 ('+v.plate+')',
      '<p style="font-size:16px;margin:0 0 12px"><b>'+vEsc(currentEmp.name)+'</b> 님이 차량 <b>'+VEH_UPDATE_LABEL[kind]+'</b>을 신청하였습니다.</p>'
      +'<table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="background:#f8fafc"><td style="padding:8px 12px;color:#64748b;width:80px">차량</td><td style="padding:8px 12px">'+vEsc(v.plate)+' '+vEsc(v.model)+'</td></tr>'
      +'<tr><td style="padding:8px 12px;color:#64748b">내용</td><td style="padding:8px 12px">'+vehUpdateSummary(u)+'</td></tr>'
      +(photoUrl?'<tr style="background:#f8fafc"><td style="padding:8px 12px;color:#64748b">사진</td><td style="padding:8px 12px"><a href="'+photoUrl+'">첨부 보기</a></td></tr>':'')+'</table>');
  }
  closeModal(); go(currentPage);
}
async function applyVehUpdate(u, v){
  const p=u.payload||{}; let patch={}, logRow=null;
  if(u.kind==='insurance'){
    patch={insurer:p.insurer, ins_start:p.insStart, ins_end:p.insEnd};
    logRow={category:'insurance_tax',data:{taxType:'보험료',date:p.insStart,company:p.insurer,startDate:p.insStart,endDate:p.insEnd,memo:'보험 갱신(승인)'}};
  } else if(u.kind==='inspection'){
    const ne=vehCalcNextExpire(v,p.inspectDate)||p.newExpire;
    patch={last_inspect_date:p.inspectDate, inspect_expire:ne};
    logRow={category:'check',data:{date:p.inspectDate,checkType:'정기검사',content:'정기검사 완료(승인) · 다음 만료 '+ne}};
  } else if(u.kind==='mileage'){
    patch={mileage:p.km, mileage_date:p.date};
  }
  patch.updated_at=new Date().toISOString();
  const ok=await sbUpdate('vehicles',v.id,patch);
  if(!ok) return false;
  Object.assign(v, normalizeVehicle({...vehToDb(v), ...patch, id:v.id}));
  if(logRow && v.kind==='shared'){
    const ins=await sbInsert('vehicle_logs',{vehicle_id:v.id, category:logRow.category, data:logRow.data, photo_url:u.photoUrl||'', emp_id:u.empId});
    if(ins) db.vehicleLogs.unshift(normalizeVehLog(ins));
  }
  return true;
}
function vehToDb(v){
  return { kind:v.kind, emp_id:v.empId||null, manager_ids:v.managerIds||[], plate:v.plate, vin:v.vin||'', ownership:v.ownership||'own', rent_company:v.rentCompany||'', rent_end:v.rentEnd||null, model:v.model, car_type:v.carType, car_size:v.carSize,
    model_year:v.modelYear?Number(v.modelYear):null, first_reg_date:v.firstRegDate||null, insurer:v.insurer, ins_start:v.insStart||null, ins_end:v.insEnd||null,
    last_inspect_date:v.lastInspectDate||null, inspect_expire:v.inspectExpire||null, mileage:v.mileage, mileage_date:v.mileageDate||null, memo:v.memo, is_active:v.isActive };
}
async function approveVehUpdate(id){
  const u=(db.vehicleUpdates||[]).find(x=>String(x.id)===String(id)); if(!u) return;
  const v=(db.vehicles||[]).find(x=>String(x.id)===String(u.vehicleId)); if(!v){ showToast('⚠️ 차량 없음'); return; }
  if(!confirm(v.plate+' '+VEH_UPDATE_LABEL[u.kind]+'\n'+vehUpdateSummary(u).replace(/<[^>]+>/g,'')+'\n\n승인하시겠습니까?')) return;
  _keepScroll=true;
  const ok=await applyVehUpdate(u,v);
  if(!ok){ showToast('⚠️ 차량 정보 반영 실패'); return; }
  await sbUpdate('vehicle_updates',u.id,{status:'approved',processed_at:new Date().toISOString()});
  u.status='approved';
  showToast('✅ 승인 — 차량 정보에 반영됨');
  go(currentPage);
}
async function rejectVehUpdate(id){
  const u=(db.vehicleUpdates||[]).find(x=>String(x.id)===String(id)); if(!u) return;
  const reason=prompt('반려 사유를 입력하세요:'); if(reason===null) return;
  _keepScroll=true;
  const ok=await sbUpdate('vehicle_updates',u.id,{status:'rejected',reject_reason:reason,processed_at:new Date().toISOString()});
  if(!ok){ showToast('⚠️ 처리 실패'); return; }
  u.status='rejected'; u.rejectReason=reason;
  const v=(db.vehicles||[]).find(x=>String(x.id)===String(u.vehicleId));
  const e=eid(u.empId);
  if(e&&e.email) vehSendMail([e.email],'[근태관리] 차량 '+VEH_UPDATE_LABEL[u.kind]+' 반려 ('+(v?v.plate:'')+')',
    '<p style="font-size:16px;margin:0 0 12px"><b>'+vEsc(e.name)+'</b> 님의 차량 <b>'+VEH_UPDATE_LABEL[u.kind]+'</b> 신청이 반려되었습니다.</p><p style="font-size:14px">사유: '+vEsc(reason)+'</p>');
  showToast('❌ 반려됨');
  go(currentPage);
}

function vlDisp(f,val){
  if(val==null||val==='') return '';
  if(f.type==='date') return fmt(val);
  if(f.type==='money') return Number(val).toLocaleString()+'원';
  if(f.type==='number') return Number(val).toLocaleString();
  if(f.type==='emp') return ename(val);
  return vEsc(val);
}
function renderVehLogTab(v, cat){
  const c=VEH_LOG_CATS[cat], yr=String(currentYear);
  const logs=(db.vehicleLogs||[]).filter(l=>String(l.vehicleId)===String(v.id)&&l.category===cat&&String(l.data.date||'').startsWith(yr))
    .sort((a,b)=>String(b.data.date||'').localeCompare(String(a.data.date||''))||b.id-a.id);
  const extra=c.extra||[];
  const head='<tr>'+c.fields.map(f=>'<th>'+f.label+'</th>').join('')+extra.map(x=>'<th>'+x.label+'</th>').join('')+'<th>사진</th><th>등록자</th><th></th></tr>';
  const rows=logs.map(l=>'<tr>'+c.fields.map(f=>'<td style="font-size:13px">'+vlDisp(f,l.data[f.k])+'</td>').join('')

    const km=vehCurrentKm(v);
    const due=Object.values(latest).filter(l=>(l.data.nextDate&&vehDays(l.data.nextDate)<=30)||(l.data.nextKm&&km!=null&&Number(l.data.nextKm)-km<=1000));
    if(due.length) tip='<div class="info-bar" style="background:#fff7ed;border:1px solid #fdba74;color:#c2410c">🧰 교체 임박: '+due.map(l=>'<b>'+vEsc(l.data.item)+'</b>'+(l.data.nextDate?' ('+fmt(l.data.nextDate)+')':'')+(l.data.nextKm?' ('+Number(l.data.nextKm).toLocaleString()+'km)':'')).join(', ')+'</div>';
  }
  return tip+'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">'
    +'<div style="font-size:14px;font-weight:700">'+c.icon+' '+c.label+' <span style="font-size:12px;color:var(--text3);font-weight:400">('+yr+'년 · 상단 연도 기준)</span></div>'

    +'<div class="table-wrap"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>'

function vlInput(f,val){
  const id='vl-'+f.k;
  if(f.type==='date') return makeDateInput(id, val||(f.k==='date'?todayStr():''));
  if(f.type==='select') return '<select id="'+id+'">'+f.options.map(o=>'<option'+(o===val?' selected':'')+'>'+o+'</option>').join('')+'</select>';
  if(f.type==='emp') return '<select id="'+id+'"><option value="">—</option>'+empOptionsAll(val||(currentEmp?currentEmp.id:''))+'</select>';
  if(f.type==='number'||f.type==='money') return '<input id="'+id+'" type="number" min="0" value="'+(val??'')+'">';
  return '<input id="'+id+'" value="'+vEsc(val)+'">';
}
function vlRead(f){
  if(f.type==='date') return getDateVal('vl-'+f.k);
  const el=document.getElementById('vl-'+f.k); if(!el) return '';
  if(f.type==='number'||f.type==='money') return el.value===''?null:Number(el.value);
  return el.value.trim();
}

}
async function saveVehLog(cat, logId){
  const c=VEH_LOG_CATS[cat]; const vid=window._vehSelId;
  const data={};
  for(const f of c.fields){
    const val=vlRead(f);
    if(f.req&&(val===''||val==null)){ showToast('⚠️ '+f.label+'을(를) 입력하세요'); return; }
    if(val!==''&&val!=null) data[f.k]=val;
  }
  if(cat==='drive'&&data.startKm!=null&&data.endKm!=null&&data.endKm<data.startKm){ showToast('⚠️ 도착 km가 출발 km보다 작습니다'); return; }
  const btn=document.getElementById('vl-save-btn'); if(btn) btn.disabled=true;
  let photoUrl=null;
  const file=document.getElementById('vl-photo')?.files?.[0];
  if(file){ try{ photoUrl=await vehUpload(file); }catch(e){ showToast('⚠️ 사진 업로드 실패: '+e.message); if(btn) btn.disabled=false; return; } }
  if(logId){
    const l=(db.vehicleLogs||[]).find(x=>String(x.id)===String(logId));
    const row={data, updated_at:new Date().toISOString()}; if(photoUrl) row.photo_url=photoUrl;
    const ok=await sbUpdate('vehicle_logs',logId,row);
    if(!ok){ showToast('⚠️ 수정 실패'); if(btn) btn.disabled=false; return; }
    if(l){ l.data=data; if(photoUrl) l.photoUrl=photoUrl; }
    showToast('✅ 수정되었습니다');
  } else {
    const ins=await sbInsert('vehicle_logs',{vehicle_id:vid, category:cat, data, photo_url:photoUrl||'', emp_id:currentEmp?currentEmp.id:null});
    if(!ins){ showToast('⚠️ 저장 실패'); if(btn) btn.disabled=false; return; }
    db.vehicleLogs.unshift(normalizeVehLog(ins));
    showToast('✅ 등록되었습니다');
  }
  closeModal(); vehLogRefresh(cat);
}
async function deleteVehLog(id){
  if(!isAdmin){ showToast('⚠️ 삭제는 관리자만 가능합니다'); return; }
  if(!confirm('이 내역을 삭제하시겠습니까?')) return;
  const ok=await sbDelete('vehicle_logs',id);
  if(!ok){ showToast('⚠️ 삭제 실패'); return; }
  db.vehicleLogs=(db.vehicleLogs||[]).filter(l=>String(l.id)!==String(id));
  showToast('🗑️ 삭제됨'); vehLogRefresh(window._vehTab||'drive');
}

let _vehAdminShowInactive=false;
// 직원명부와 같은 정렬 (직책순 → 이름순)
function vehRosterCompare(a,b){
  const ea=a.empId?eid(a.empId):null, eb=b.empId?eid(b.empId):null;
  if(!ea&&!eb) return a.plate.localeCompare(b.plate,'ko');
  if(!ea) return 1; if(!eb) return -1;
  if(ea.isInactive!==eb.isInactive) return ea.isInactive?1:-1;
  const ai=POS_ORDER.findIndex(p=>(ea.position||'').includes(p)), bi=POS_ORDER.findIndex(p=>(eb.position||'').includes(p));
  const pd=(ai===-1?99:ai)-(bi===-1?99:bi);
  return pd!==0?pd:(ea.name||'').localeCompare(eb.name||'','ko');
}

async function saveVeh(id){
  const v=vehReadModal();
  if(!v.plate){ showToast('⚠️ 차량번호를 입력하세요'); return; }
  if(v.insStart&&v.insEnd&&!checkDateOrder(v.insStart,v.insEnd,'보험')) return;
  const dup=(db.vehicles||[]).find(x=>x.plate.replace(/\s/g,'')===v.plate.replace(/\s/g,'')&&String(x.id)!==String(id));
  if(dup){ showToast('⚠️ 이미 등록된 차량번호입니다'); return; }
  if(!v.inspectExpire) v.inspectExpire=vehAutoExpire(v);
  if(v.kind==='personal') v.managerIds=[]; else v.empId=null;
  if(v.ownership!=='rental'){ v.rentCompany=''; v.rentEnd=''; }
  const row=vehToDb(v); row.updated_at=new Date().toISOString();
  if(id){
    const ok=await sbUpdate('vehicles',id,row);
    if(!ok){ showToast('⚠️ 수정 실패'); return; }
    const cur=db.vehicles.find(x=>String(x.id)===String(id)); Object.assign(cur, normalizeVehicle({...row,id}));
    showToast('✅ 수정되었습니다');
  } else {
    const ins=await sbInsert('vehicles',row);
    if(!ins){ showToast('⚠️ 저장 실패'); return; }
    db.vehicles.push(normalizeVehicle(ins));
    showToast('✅ 등록되었습니다');
  }
  closeModal(); renderVehicleAdmin();
}
async function deleteVeh(id){
  const v=(db.vehicles||[]).find(x=>String(x.id)===String(id)); if(!v) return;
  if(!confirm(v.plate+' 차량을 삭제하시겠습니까?\n\n⚠️ 갱신 내역과 공용차량 일지가 모두 함께 삭제됩니다.\n보관이 필요하면 [수정]에서 \'사용 중\'을 해제(비활성)하세요.')) return;
  const ok=await sbDelete('vehicles',id);
  if(!ok){ showToast('⚠️ 삭제 실패'); return; }
  db.vehicles=db.vehicles.filter(x=>String(x.id)!==String(id));
  db.vehicleUpdates=(db.vehicleUpdates||[]).filter(u=>String(u.vehicleId)!==String(id));
  db.vehicleLogs=(db.vehicleLogs||[]).filter(l=>String(l.vehicleId)!==String(id));
  showToast('🗑️ 삭제됨'); renderVehicleAdmin();
}

const VEH_XL_HEADERS=['구분(개인/공용)','소유(자사/렌탈)','렌트사','렌탈만기일','차량번호','차대번호','모델','차종(승용/승합/화물)','규모(경형/소형/중형/대형)','연식','최초등록일','사용자/담당자(이름, 공용은 쉼표구분)','보험사','보험가입일','보험만기일','최근검사일','검사만료일','주행거리(km)','메모'];

async function importVehExcel(input){
  const file=input.files[0]; if(!file) return; input.value='';
  await vehEnsureXLSX();
  let aoa;
  try{ const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false}); aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}); }
  catch(e){ showToast('⚠️ 파일을 읽을 수 없습니다'); return; }
  const hi=aoa.findIndex(r=>r.some(c=>String(c).replace(/\s/g,'').includes('차량번호')));
  if(hi<0){ showToast('⚠️ \'차량번호\' 헤더를 찾을 수 없습니다'); return; }
  const H=aoa[hi];
  const col=kw=>{ for(const k of kw){ const i=findColByKeywords(H,[k]); if(i>=0) return i; } return -1; }; // 키워드 우선순위대로
  const C={kind:col(['구분(개인','구분']),own:col(['소유']),rentco:col(['렌트사']),rentEnd:col(['렌탈만기','계약만기']),plate:col(['차량번호']),vin:col(['차대번호']),model:col(['모델','차명']),type:col(['차종']),size:col(['규모']),year:col(['연식']),reg:col(['최초등록']),
    who:col(['사용자','담당자']),insurer:col(['보험사']),insStart:col(['보험가입','가입일']),insEnd:col(['보험만기','만기일']),last:col(['최근검사']),exp:col(['검사만료','검사유효']),km:col(['주행거리']),memo:col(['메모','비고'])};
  const g=(r,i)=>i>=0?r[i]:'';
  const byName=n=>db.employees.find(e=>e.name===String(n).trim());
  const parsed=[], warns=[];
  aoa.slice(hi+1).forEach((r,ri)=>{
    const plate=String(g(r,C.plate)||'').trim(); if(!plate) return;
    const kind=String(g(r,C.kind)).includes('공용')?'shared':'personal';
    const names=String(g(r,C.who)||'').split(/[,，\/]/).map(s=>s.trim()).filter(Boolean);
    const emps=names.map(byName).filter(Boolean);
    names.filter(n=>!byName(n)).forEach(n=>warns.push(plate+': \''+n+'\' 직원 없음'));
    const pd=c=>{ const x=g(r,c); return x?parseCellDate(x):''; };
    const own=String(g(r,C.own)).includes('렌')?'rental':'own';
    const v={kind, ownership:own, rentCompany:own==='rental'?String(g(r,C.rentco)||'').trim():'', rentEnd:own==='rental'?pd(C.rentEnd):'', empId:kind==='personal'&&emps[0]?emps[0].id:null, managerIds:kind==='shared'?emps.map(e=>String(e.id)):[],
      plate, vin:String(g(r,C.vin)||'').trim().toUpperCase(), model:String(g(r,C.model)||'').trim(), carType:['승용','승합','화물'].find(t=>String(g(r,C.type)).includes(t))||'승용',
      carSize:['경형','소형','중형','대형'].find(t=>String(g(r,C.size)).includes(t))||'소형', modelYear:g(r,C.year)?String(parseInt(g(r,C.year))):'',
      firstRegDate:pd(C.reg), insurer:String(g(r,C.insurer)||'').trim(), insStart:pd(C.insStart), insEnd:pd(C.insEnd),
      lastInspectDate:pd(C.last), inspectExpire:pd(C.exp), mileage:g(r,C.km)!==''?Number(String(g(r,C.km)).replace(/[^0-9.]/g,''))||null:null,
      mileageDate:g(r,C.km)!==''?todayStr():'', memo:String(g(r,C.memo)||'').trim(), isActive:true};
    if(!v.inspectExpire) v.inspectExpire=vehAutoExpire(v);
    parsed.push(v);
  });
  if(!parsed.length){ showToast('⚠️ 등록할 차량이 없습니다'); return; }
  const exist=parsed.filter(p=>(db.vehicles||[]).some(x=>x.plate.replace(/\s/g,'')===p.plate.replace(/\s/g,''))).length;
  if(!confirm('총 '+parsed.length+'대 (신규 '+(parsed.length-exist)+' / 기존 갱신 '+exist+')\n'+(warns.length?'\n⚠️ 확인 필요:\n'+warns.slice(0,10).join('\n')+'\n':'')+'\n업로드하시겠습니까?')) return;
  let ok=0, fail=0;
  for(const v of parsed){
    const cur=(db.vehicles||[]).find(x=>x.plate.replace(/\s/g,'')===v.plate.replace(/\s/g,''));
    const row=vehToDb(v); row.updated_at=new Date().toISOString();
    if(cur){ if(await sbUpdate('vehicles',cur.id,row)){ Object.assign(cur,normalizeVehicle({...row,id:cur.id})); ok++; } else fail++; }
    else { const ins=await sbInsert('vehicles',row); if(ins){ db.vehicles.push(normalizeVehicle(ins)); ok++; } else fail++; }
  }
  showToast('✅ '+ok+'대 반영'+(fail?' / 실패 '+fail+'대':''));
  renderVehicleAdmin();
}

// ── 로그인 팝업 알림 (D-60 / D-30 / D-15 / 만료) ──
function vehAlertItems(){
  if(!currentEmp) return [];
  const list=(db.vehicles||[]).filter(v=>v.isActive&&(isAdmin||vehRelevantToMe(v)));
  const items=[];
  list.forEach(v=>{
    [['insurance','보험 만기',v.insEnd],['inspection','정기검사 만료',v.inspectExpire]].forEach(([item,label,due])=>{
      if(!due) return; const d=vehDays(due); if(d>60) return;
      const stage=d<0?'over':(d<=15?15:(d<=30?30:60));
      const key='veh_ack_'+currentEmp.id+'_'+v.id+'_'+item+'_'+due+'_'+stage+(stage==='over'?'_'+todayStr():'');
      if(localStorage.getItem(key)) return;
      items.push({v,item,label,due,days:d,key,pending:vehPending(v.id,item).length>0});
    });
  });
  return items.sort((a,b)=>a.days-b.days);
}
function checkVehicleAlertPopup(){
  if(window._vehTablesMissing) return;
  const items=vehAlertItems(); if(!items.length) return;
  window._vehAlertKeys=items.map(i=>i.key);
  const rows=items.map(i=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:'+(i.days<=15?'#fef2f2':'#fffbeb')+';margin-bottom:6px">'
    +'<div><div style="font-weight:700">'+vEsc(i.v.plate)+' <span style="font-size:13px;color:var(--text2);font-weight:500">'+i.label+'</span></div>'
    +'<div style="font-size:12px;color:var(--text3)">'+(i.v.kind==='shared'?'공용 · ':'')+vehOwnerText(i.v)+' · '+fmt(i.due)+(i.pending?' · <span style="color:#d97706">갱신 승인대기</span>':'')+'</div></div>'+vehDdayBadge(i.due)+'</div>').join('');
  const target=isAdmin?'vehicleadmin':(items.some(i=>i.v.kind==='personal')?'vehicle':'sharedvehicle');
  document.getElementById('veh-alert-content').innerHTML=
    '<div style="font-size:26px;text-align:center;margin-bottom:6px">🚗</div><div style="font-size:18px;font-weight:700;text-align:center;margin-bottom:14px;color:var(--accent)">차량 만기 알림</div>'
    +'<div style="max-height:50vh;overflow-y:auto">'+rows+'</div>'
    +'<div style="font-size:12px;color:var(--text3);margin:8px 0 14px">※ 보험을 갱신했거나 검사를 완료했다면 사진과 함께 신청해 주세요. 승인되면 알림이 멈춥니다.</div>'
    +'<div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="closeVehAlertPopup(true);go(\''+target+'\')">차량 보기</button><button class="btn btn-primary" style="flex:1" onclick="closeVehAlertPopup(true)">확인</button></div>';
  document.getElementById('veh-alert-popup').style.display='flex';
}
function closeVehAlertPopup(ack){
  if(ack) (window._vehAlertKeys||[]).forEach(k=>localStorage.setItem(k,'1'));
  const p=document.getElementById('veh-alert-popup'); if(p) p.style.display='none';
}

  try {
    // Supabase 세션 키 직접 제거

      if (k.includes('supabase') || k.includes('sb-')) localStorage.removeItem(k);
    });
  } catch(e) {}
  showLoginScreen();

  // 로그인/로그아웃 이벤트 감지
  _supa.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session?.user) {
      if (currentUser) return;
      await onSignedIn(session.user);
    } else if (event === 'SIGNED_OUT') {
      onSignedOut();
    }
  });
} else {
  // Supabase 미설정 → 설정 화면
  setContent('');

}
