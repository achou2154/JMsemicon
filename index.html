async function saveHealthComplete(empId) {
  const checkupDate = document.getElementById('h-checkup-date')?.value;
  if (!checkupDate) { showToast('수검일을 입력하세요'); return; }
  const yr = currentYear;
  const h = db.health.find(r=>String(r.empId)===String(empId)&&String(r.year)===String(yr));
  if (!h) return;

  // 가족 수검 정보 업데이트
  const famMembers = (h.members||[]).filter(m=>m.relation!=='본인');
  famMembers.forEach((m,i) => {
    const dateEl = document.getElementById(`fam-check-${i}`);
    const doneEl = document.getElementById(`fam-done-${i}`);
    if (dateEl) m.checkupDate = dateEl.value;
    if (doneEl) m.confirmed = doneEl.checked;
  });
  const mainMember = h.members.find(m=>m.relation==='본인')||{relation:'본인'};
  mainMember.checkupDate = checkupDate;
  mainMember.confirmed = true;
  if (!h.members.find(m=>m.relation==='본인')) h.members.unshift(mainMember);

  try {
    const { error } = await _supa.from('health_records').update({
      checkup_date: checkupDate, members_json: JSON.stringify(h.members), status: 'completed'
    }).eq('id', h.id);
    if (error) { console.error('수검완료 오류:', error); showToast('⚠️ 저장 실패: ' + error.message); return; }
    h.checkupDate = checkupDate;
    h.status = 'completed';
    saveAll();
    showToast('✅ 수검 완료 저장됨');
    closeModal();
    renderHealth();
  } catch(e) { console.error('수검완료 예외:', e); showToast('⚠️ 저장 실패'); }
}

// 건강검진 상세 (관리자용 - 가족 추가 등)

async function deleteHealth(empId) {
  if (!confirm('건강검진 신청을 삭제하시겠습니까?')) return;
  const yr = currentYear;
  const h = db.health.find(r => String(r.empId) === String(empId) && String(r.year) === String(yr));
  if (!h) return;
  const { error } = await _supa.from('health_records').delete().eq('id', h.id);
  if (!error) {
    db.health = db.health.filter(r => String(r.id) !== String(h.id));
    saveAll(); showToast('🗑️ 삭제됨');
    await notifyHealthChange(empId, [], '', '삭제');
    renderHealth();
  } else { console.error('deleteHealth error:',error); showToast('⚠️ 삭제 실패: '+error.message); }
}

}
async function rejectHealthFromReq(empId) {
  if (!confirm('건강검진 신청을 반려하시겠습니까?')) return;
  _keepScroll=true;
  const yr = currentYear;
  const h = db.health.find(r => String(r.empId)===String(empId) && String(r.year)===String(yr));
  if (!h) return;
  const { error } = await _supa.from('health_records').update({ status: 'rejected' }).eq('id', h.id);
  if (!error) {
    h.status = 'rejected';
    saveAll(); showToast('❌ 건강검진 신청 반려됨');
  } else { showToast('⚠️ 반려 실패: ' + error.message); }

}
async function approveHealth(empId) {
  const yr = currentYear;
  const h = db.health.find(r => String(r.empId) === String(empId) && String(r.year) === String(yr));
  if (!h) { showToast('⚠️ 데이터 없음'); return; }
  try {
    const { error } = await _supa.from('health_records').update({ status: 'approved', approved: true }).eq('id', h.id);
    if (error) { console.error('승인 오류:', error); showToast('⚠️ 승인 실패: ' + error.message); return; }
    h.status = 'approved';
    h.approved = true;
    saveAll();
    showToast('✅ 건강검진 승인됨');
  } catch(e) { console.error('승인 예외:', e); showToast('⚠️ 승인 실패'); }
  renderHealth();
}

function renderCalendar(){
  updateBdayAlarmBar();
  const y=calYear,m=calMonth;
  const first=new Date(y,m-1,1).getDay();
  const last=new Date(y,m,0).getDate();
  const ev={};
  // 우선순위: 생일(0) 기념일(1) 건강검진(2) 특근(3) 출장(4) 교육(5) 대휴(6) 연차/반차/외출(7) 기타(8)
  const EV_PRIORITY = {'ev-bday-birthday':0,'ev-bday-anniv':1,'ev-health':2,'ev-ot-special':3,'ev-trip':4,'ev-ot-edu':5,'ev-comp':6,'ev-leave':7,'ev-ot':3};
  function evPriority(cls, label) {
    if(cls==='ev-bday') return label.includes('🎂')?0:label.includes('🏢')?1:1;
    if(cls==='ev-health') return 2;
    if(cls==='ev-ot') return label.includes('교육')?5:3;
    if(cls==='ev-trip') return 4;
    if(cls==='ev-comp') return 6;
    if(cls==='ev-leave'||cls==='ev-summer') return 7;
    return 8;
  }
  function evName(label) {
    // 라벨에서 이름 추출 (이모지/아이콘 제거)
    return label.replace(/^[⏳✅❌🎂🎉🏢🏥]/,'').trim().split(' ')[0]||'';
  }
  function addEv(ds,label,cls,status='approved',req=null){
    if(!ev[ds])ev[ds]=[];
    ev[ds].push({label,cls,status,req,priority:evPriority(cls,label),name:evName(label)});
  }
  const mStr=`${y}-${String(m).padStart(2,'0')}`;
  // 승인여부 관계없이 canView인 신청 모두 표시
  db.requests.filter(r=>canViewCalendar(r)).forEach(r=>{
    const statusIcon = r.status==='pending'?'⏳':r.status==='rejected'?'❌':'✅';
    if(r.type==='leave')iterDates(r.startDate,r.endDate||r.startDate,ds=>{if(ds.startsWith(mStr))addEv(ds,statusIcon+' '+ename(r.empId)+' '+r.leaveType,r.leaveType==='하계휴가'?'ev-summer':'ev-leave',r.status,r);});
    else if(r.type==='ot'&&(r.date||'').startsWith(mStr))addEv(r.date,statusIcon+' '+ename(r.empId)+' 특근','ev-ot',r.status);
    else if(r.type==='trip')iterDates(r.startDate,r.endDate||r.startDate,ds=>{if(ds.startsWith(mStr))addEv(ds,statusIcon+' '+ename(r.empId)+' 출장','ev-trip',r.status,r);});
    else if(r.type==='comp')iterDates(r.startDate,r.endDate||r.startDate,ds=>{if(ds.startsWith(mStr))addEv(ds,statusIcon+' '+ename(r.empId)+' 대휴','ev-comp',r.status,r);});
    else if(r.type==='outside')iterDates(r.startDate,r.endDate||r.startDate,ds=>{if(ds.startsWith(mStr))addEv(ds,statusIcon+' '+ename(r.empId)+' 외근','ev-trip',r.status);});
    else if(r.type==='education')iterDates(r.startDate,r.endDate||r.startDate,ds=>{if(ds.startsWith(mStr))addEv(ds,statusIcon+' '+ename(r.empId)+' 교육','ev-ot',r.status,r);});
  });
  // 생일/기념일 달력 표시 비활성화 (숨김 처리)
  const _healthSeen = new Set(); // empId+date+relation 중복 방지
  db.health.filter(h=>String(h.year)===String(y)).forEach(h=>{
    (h.members||[]).filter(mem=>!mem.relation||mem.relation==='본인').forEach(mem=>{
      // 예정(reserveDate) 또는 완료(checkupDate) 중 실제 표시할 날짜 하나만 사용
      const displayDate = mem.confirmed ? (mem.checkupDate||mem.reserveDate) : (mem.reserveDate||mem.checkupDate);
      if(displayDate&&displayDate.startsWith(mStr)){
        const dedupKey = h.empId+'_'+displayDate+'_'+(mem.confirmed?'done':'pending');
        if(_healthSeen.has(dedupKey)) return;
        _healthSeen.add(dedupKey);
        const statusTxt = mem.confirmed ? '검진완료' : '검진예정';
        addEv(displayDate,'🏥 '+ename(h.empId)+' '+statusTxt,'ev-health');
      }
    });
  });
  window._calEv = {}; // 초기화
  Object.assign(window._calEv, ev); // 이벤트 다 채운 후 저장
  const todayDateStr=todayStr();
  const total=Math.ceil((first+last)/7)*7;
  let cells='';
  for(let i=0;i<total;i++){
    const dn=i-first+1;const inM=dn>=1&&dn<=last;
    const ds=inM?`${y}-${String(m).padStart(2,'0')}-${String(dn).padStart(2,'0')}`:'';
    const dow=i%7;const evList=ds&&ev[ds]?[...ev[ds]].sort((a,b)=>a.priority!==b.priority?a.priority-b.priority:a.name.localeCompare(b.name,'ko')):[];
    const clickHandler = inM&&evList.length>0 ? `onclick="openDayDetail('${ds}')"` : '';
    cells+=`<div class="cal-day${!inM?' other-month':''}${ds===todayDateStr?' today':''}${dow===0?' sun':''}" ${clickHandler} style="${inM&&evList.length>0?'cursor:pointer':''}">
      ${inM?`<div class="dn">${dn}</div>`:''}
      ${evList.slice(0,4).map(e=>`<div class="cal-event ${e.cls}">${e.label}</div>`).join('')}
      ${evList.length>4?`<div style="font-size:12px;color:var(--text3)">+${evList.length-4}건 더보기</div>`:''}
    </div>`;
  }
  // 오늘의 자리비움 / 오늘의 특근 카드
  const todayStr2 = todayStr();
  const todayReqs = db.requests.filter(r => canViewCalendar(r) && r.status !== 'rejected' && (
    (r.type==='leave' && r.startDate<=todayStr2 && (r.endDate||r.startDate)>=todayStr2) ||
    (r.type==='comp' && r.startDate<=todayStr2 && (r.endDate||r.startDate)>=todayStr2) ||
    (r.type==='trip' && r.startDate<=todayStr2 && (r.endDate||r.startDate)>=todayStr2) ||
    (r.type==='education' && r.startDate<=todayStr2 && (r.endDate||r.startDate)>=todayStr2) ||
    (r.type==='ot' && r.date===todayStr2)
  ));

  // 자리비움: 연차, 대휴, 출장
  const absenceToday = todayReqs.filter(r => r.type==='leave'||r.type==='comp'||r.type==='trip'||r.type==='outside'||r.type==='education');
  // 특근: ot
  const otToday = todayReqs.filter(r => r.type==='ot');

  const typeLabel = {leave:'연차',ot:'특근',comp:'대휴',trip:'출장',outside:'외근',education:'교육'};
  const stBadge = r => r.status==='other_clinic'?'<span class="badge" style="background:#fef3c7;color:#92400e">타기관</span>':r.status==='pending'
    ? `<span style="font-size:12px;background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 5px">승인대기</span>`
    : `<span style="font-size:12px;background:#d1fae5;color:#065f46;border-radius:4px;padding:1px 5px">승인</span>`;

  const mkCard = (title, reqs, bg, border, titleColor) => reqs.length === 0 ? '' : `
    <div style="background:${bg};border:1px solid ${border};border-radius:var(--radius);padding:12px 16px;flex:1;min-width:200px">
      <div style="font-size:14px;font-weight:700;color:${titleColor};margin-bottom:8px">📌 ${title} (${reqs.length}명)</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:${4*32}px;overflow-y:auto">
        ${reqs.map(r=>`
          <div style="display:flex;align-items:center;gap:6px;font-size:16px;background:rgba(255,255,255,.6);border-radius:20px;padding:3px 10px 3px 4px;white-space:nowrap">
            ${av(r.empId,22)}
            <span style="font-weight:500">${ename(r.empId)}</span>
            <span style="font-size:13px;color:#64748b">${r.type==='leave'?(r.leaveType||'연차'):typeLabel[r.type]||''}</span>
            ${stBadge(r)}
          </div>`).join('')}
      </div>
    </div>`;

  const todayBannerHtml = (absenceToday.length || otToday.length) ? `
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      ${mkCard('오늘의 자리비움', absenceToday, '#eff6ff', '#93c5fd', '#1d4ed8')}
      ${mkCard('오늘의 특근', otToday, '#fdf4ff', '#d8b4fe', '#7e22ce')}
    </div>` : '';

  // 30일 이내 예정 이벤트 (생일/기념일)
  const todayD2 = parseLocalDate(todayStr());
  // db.events 기준 (올해 지났으면 내년으로)
  const upcoming30 = [];
  if(false) db.events.forEach(ev2 => {
    let ds2 = getEventDate(ev2, todayD2.getFullYear());
    if (!ds2) return;
    let diff2 = Math.round((parseLocalDate(ds2) - todayD2) / 864e5);
    if (diff2 < 0) {
      ds2 = getEventDate(ev2, todayD2.getFullYear() + 1);
      if (!ds2) return;
      diff2 = Math.round((parseLocalDate(ds2) - todayD2) / 864e5);
    }
    if (diff2 < 0 || diff2 > 30) return;
    upcoming30.push({ ...ev2, ds: ds2, diff: diff2 });
  });
  // 직원 birthdate 직접 보완 (events 테이블에 없는 경우)
  const evEmpIds30 = new Set(upcoming30.map(ev => String(ev.empId)));
  db.employees.filter(e => e.birthdate && !e.isExternal).forEach(e => {
    if (evEmpIds30.has(String(e.id))) return;
    const parts = e.birthdate.split('-'); if (parts.length < 3) return;
    const m2 = parseInt(parts[1]), d2 = parseInt(parts[2]);
    let ds2 = `${todayD2.getFullYear()}-${String(m2).padStart(2,'0')}-${String(d2).padStart(2,'0')}`;
    let diff2 = Math.round((parseLocalDate(ds2) - todayD2) / 864e5);
    if (diff2 < 0) { ds2 = `${todayD2.getFullYear()+1}-${String(m2).padStart(2,'0')}-${String(d2).padStart(2,'0')}`; diff2 = Math.round((parseLocalDate(ds2) - todayD2) / 864e5); }
    if (diff2 < 0 || diff2 > 30) return;
    upcoming30.push({ id:'bd_'+e.id, empId:e.id, type:'birthday', name:e.name+' 생일', month:m2, day:d2, calType:e.birthdateLunar?'lunar':'solar', ds:ds2, diff:diff2 });
  });
  upcoming30.sort((a,b) => a.diff - b.diff);

  const upcoming30Html = ''; // 30일 이내 예정 비활성화

  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  setContent(`<div class="card">
    ${todayBannerHtml}
    ${upcoming30Html}
    <div class="cal-nav">
      <button class="btn" style="position:absolute;left:0" onclick="chM(-1)">&#8249;</button>
      <h2>${y}년 ${months[m-1]}</h2>
      <button class="btn btn-sm" style="margin-left:8px;font-size:14px" onclick="calYear=new Date().getFullYear();calMonth=new Date().getMonth()+1;renderCalendar()">오늘</button>
      <button class="btn" style="position:absolute;right:0" onclick="chM(1)">&#8250;</button>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--leave-bg);border:1px solid var(--leave)"></div>연차</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--ot-bg);border:1px solid var(--ot)"></div>특근</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--trip-bg);border:1px solid var(--trip)"></div>출장</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--comp-bg);border:1px solid var(--comp)"></div>대체휴무</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--bday-bg);border:1px solid var(--bday)"></div>생일/기념일</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--health-bg);border:1px solid var(--health)"></div>건강검진</div>
    </div>
    <div class="cal-grid">
      ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}
    </div>
  </div>`);
}
function chM(d){calMonth+=d;if(calMonth>12){calMonth=1;calYear++;}if(calMonth<1){calMonth=12;calYear--;}renderCalendar();}

// 시작일 바뀌면 종료일도 동일하게 자동세팅 (빈값이거나 시작일보다 이전일 때)
function syncEndDate(){
  const sy=document.getElementById('f-start-y')?.value||'';
  const sm=document.getElementById('f-start-m')?.value||'';
  const sd=document.getElementById('f-start-d')?.value||'';
  if(!sy||!sm||!sd) return;
  const ey=document.getElementById('f-end-y');
  const em=document.getElementById('f-end-m');
  const ed=document.getElementById('f-end-d');
  if(!ey) return;
  // 시작일 변경 시 종료일을 시작일과 동일하게 세팅 (dispatchEvent 없이 값만 변경)
  ey.value=sy;
  if(em) em.value=sm;
  if(ed) ed.value=sd;
  // 자동계산 함수만 직접 호출 (이벤트 발생 금지 — 포커스 이동 방지)
  if(typeof autoCalcLeaveHours==='function') autoCalcLeaveHours();
  if(typeof autoCalcCompHours==='function') autoCalcCompHours();
  if(typeof updateLeaveRemainPreview==='function') updateLeaveRemainPreview();
  if(typeof updateCompRemainPreview==='function') updateCompRemainPreview();
}

// 모달 Enter 리스너 AbortController (중복 방지)
let _modalAC = null;
function openModal(html, large=false){
  const box=document.getElementById('modal-box');
  // 기존 리스너 완전 제거 후 재등록
  if(_modalAC){ _modalAC.abort(); _modalAC=null; }
  box.innerHTML=html;
  if(large) box.classList.add('modal-lg');
  else box.classList.remove('modal-lg');
  document.getElementById('modal-bg').classList.add('show');
  // Enter 키 → 신청/저장 버튼 (AbortController로 정확히 1개만 등록)
  _modalAC = new AbortController();
  box.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
    e.preventDefault();
    e.stopPropagation();
    const btn=box.querySelector('.modal-footer .btn-primary');
    if(btn && !btn.disabled) btn.click();
  }, {signal: _modalAC.signal});
}
function closeModal(){
  document.getElementById('modal-bg').classList.remove('show');
  const box=document.getElementById('modal-box');
  box.classList.remove('modal-lg');
  if(_modalAC){ _modalAC.abort(); _modalAC=null; }
  box.innerHTML='';
}

async function saveEmp(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('이름을 입력하세요');return;}
  const id=nextId++;
  const empType=document.querySelector('input[name="f-emptype"]:checked')?.value||'정직원';
  const isExternal=empType==='상임이사';
  const birth=getDateVal('f-birth')||'';
  const calSel=document.querySelector('input[name="f-cal"]:checked');
  const birthdateLunar=calSel?calSel.value==='lunar':false;
  const annexSel=document.querySelector('input[name="f-anniv"]:checked');
  const anniversaryType=annexSel?annexSel.value:'birthday';
  const emp={id,name,dept:document.getElementById('f-dept').value||'',position:document.getElementById('f-pos').value||'',phone:document.getElementById('f-phone').value||'',email:document.getElementById('f-email').value||'',joinDate:getDateVal('f-join')||'',isExternal,employmentType:empType,birthdate:birth,birthdateLunar,anniversaryType,address:'',avatarUrl:''};
  db.employees.push(emp);
  if(!isExternal){
    db.leaveAlloc.push({empId:id,year:currentYear,total:(parseFloat(document.getElementById('f-leave').value)||15)*8,carryover:(parseFloat(document.getElementById('f-carry').value)||0)*8});
  }
  // 이메일로 Supabase Auth user_id 자동 연결
  let userId = null;
  if (emp.email) {
    const { data: authUsers } = await _supa.auth.admin?.listUsers?.() || {};
    if (!authUsers) {
      // admin API 없으면 employees 테이블에서 같은 이메일 user_id 찾기
      const { data: existEmp } = await _supa.from('employees').select('user_id').eq('email', emp.email).single();
      if (existEmp?.user_id) userId = existEmp.user_id;
    } else {
      const matched = authUsers.users?.find(u => u.email === emp.email);
      if (matched) userId = matched.id;
    }
  }
  const empRow={name:emp.name,dept:emp.dept,position:emp.position,phone:emp.phone,email:emp.email,join_date:emp.joinDate||null,is_external:emp.isExternal||false,employment_type:empType,birthdate:birth||null,birthdate_lunar:birthdateLunar,anniversary_type:anniversaryType,user_id:userId||null};
  const saved=await sbInsert('employees',empRow);

async function submitReq(){
  const t=document.getElementById('req-type').value;
  const empId=document.getElementById('f-emp').value;
  const reason=document.getElementById('f-reason')?.value||'';
  const td2=todayStr();
  let r={id:nextId++,type:t,empId,status:'approved',year:currentYear,reason,reqDate:td2};
  if(t==='leave'){
    const s=getDateVal('f-start');if(!s){alert('날짜 입력');return;}
    const e2=getDateVal('f-end')||s;
    const ltSel=document.querySelector('input[name="ltype"]:checked');
    // 중복 체크
    const overlaps = checkLeaveOverlap(empId, s, e2);
    if (overlaps.length > 0) {
      const overlapInfo = overlaps.map(o => '• ' + fmt(o.startDate) + (o.endDate&&o.endDate!==o.startDate?' ~ '+fmt(o.endDate):'') + ' (' + o.leaveType + ', ' + (o.status==='pending'?'승인대기':'승인됨') + ')').join('\n');
      alert('⚠️ 중복 신청\n\n해당 기간에 이미 신청된 연차가 있습니다:\n\n' + overlapInfo + '\n\n중복 저장이 불가합니다.');
      return;
    }
    Object.assign(r,{startDate:s,endDate:e2,leaveType:ltSel?ltSel.value:'연차',hours:parseInt(document.getElementById('f-hours').value)||8});
  }
  else if(t==='ot'){const date=getDateVal('f-date');if(!date){alert('날짜 입력');return;}
    const otDups=checkOTOverlap(empId,date);
    if(otDups.length>0){alert('⚠️ 중복 신청\n\n해당 날짜('+fmt(date)+')에 이미 특근이 신청되어 있습니다.\n('+(otDups[0].status==='pending'?'승인대기':'승인됨')+')\n\n중복 저장이 불가합니다.');return;}
    const otSel=document.querySelector('input[name="otsub"]:checked');Object.assign(r,{date,otType:otSel?otSel.value:'특근',hours:parseInt(document.getElementById('f-hours').value)||4,useTransport:false});}
  else if(t==='trip'){const s=getDateVal('f-start');if(!s){alert('날짜 입력');return;}Object.assign(r,{startDate:s,endDate:getDateVal('f-end')||s,dest:document.getElementById('f-dest')?.value||''});}
  else if(t==='comp'){const s=getDateVal('f-start');if(!s){alert('날짜 입력');return;}
    const compDups=checkCompOverlap(empId,s);
    if(compDups.length>0){alert('⚠️ 중복 신청\n\n해당 날짜('+fmt(s)+')에 이미 대체휴무가 신청되어 있습니다.\n('+(compDups[0].status==='pending'?'승인대기':'승인됨')+')\n\n중복 저장이 불가합니다.');return;}
    Object.assign(r,{startDate:s,endDate:s,hours:parseInt(document.getElementById('f-hours').value)||8});}
  // Supabase 저장
  const row = reqToDb(r);
  let saved = null;
  if(_supa){
    const {data,error}=await _supa.from('requests').insert(row).select().single();
    if(error){console.error('submitReq error:',error);showToast('⚠️ 저장 실패: '+error.message);return;}
    saved=data;
  }
  if(saved) r.id=saved.id;
  db.requests.unshift(r);
  saveAll();
  showToast('✅ 신청 완료 — 관리자 승인 후 반영됩니다');
  await notifyAdmin(r);
  closeModal();go(currentPage);
}

// ── 중복 신청 체크 ──
function checkOTOverlap(empId, date) {
  return db.requests.filter(r =>
    String(r.empId)===String(empId) &&
    r.type==='ot' && r.date===date &&
    r.status!=='rejected'
  );
}
function checkCompOverlap(empId, startDate) {
  return db.requests.filter(r =>
    String(r.empId)===String(empId) &&
    r.type==='comp' && r.startDate===startDate &&
    r.status!=='rejected'
  );
}
// ── 연차 중복 체크 ──
function checkLeaveOverlap(empId, startDate, endDate) {
  const end = endDate || startDate;
  const overlaps = db.requests.filter(r => {
    if (String(r.empId) !== String(empId)) return false;
    if (r.type !== 'leave') return false;
    if (r.status === 'rejected') return false; // 반려된 건 제외
    const rEnd = r.endDate || r.startDate;
    // 날짜 범위 겹침 체크
    return r.startDate <= end && rEnd >= startDate;
  });
  return overlaps;
}

// 신청 객체 → DB row 변환
function reqToDb(r) {
  return {
    type:r.type, emp_id:r.empId, status:'pending', year:r.year,
    reason:r.reason||'', substitute:r.substitute||'', req_date:r.reqDate||todayStr(),
    start_date:r.startDate||null, end_date:r.endDate||null,
    leave_type:r.leaveType||null, hours:r.hours||null,
    date:r.date||null, ot_type:r.otType||null,
    use_transport:r.useTransport||false,
    dest:r.dest||null, trip_kind:r.tripKind||null, allowance:r.allowance||0,
    start_time:r.startTime||null, end_time:r.endTime||null
  };
}

function onLtypeChange(){
  const sel=document.querySelector('input[name="ltype"]:checked');
  if(!sel) return;
  const hEl=document.getElementById('f-hours');
  const alldayEl=document.getElementById('f-allday');
  const sTimeWrap=document.getElementById('leave-start-time-wrap');
  const eTimeWrap=document.getElementById('leave-end-time-wrap');
  const noHourTypes=['병가','특별휴가'];
  const fullDayTypes=['연차','병가','특별휴가','하계휴가'];
  const isFullDay=fullDayTypes.includes(sel.value);

  // 병가/특별휴가: 총 시간 비활성화
  if(hEl){
    hEl.disabled=noHourTypes.includes(sel.value);
    hEl.style.opacity=noHourTypes.includes(sel.value)?'0.4':'1';
  }
  // 종일 체크박스
  if(alldayEl) alldayEl.checked=isFullDay;
  // 시각 입력 표시/숨김
  if(sTimeWrap) sTimeWrap.style.display=isFullDay?'none':'';
  if(eTimeWrap) eTimeWrap.style.display=isFullDay?'none':'';

  // 반차 아닐 때 오전/오후 wrap 숨김
  const ampmWrap=document.getElementById('half-ampm-wrap');
  if(ampmWrap) ampmWrap.style.display=sel.value==='반차'?'flex':'none';

  // 시각 기본값 세팅 (비종일)
  if(!isFullDay){
    const nowK=new Date(Date.now()+9*3600*1000);
    const hh=String(nowK.getUTCHours()).padStart(2,'0');
    const mm=String(nowK.getUTCMinutes()).padStart(2,'0');
    const hh1=String((nowK.getUTCHours()+1)%24).padStart(2,'0');
    const sT=document.getElementById('f-start-time');
    const eT=document.getElementById('f-end-time');
    if(sT&&!sT.value) sT.value=hh+':'+mm;
    if(eT&&!eT.value) eT.value=hh1+':'+mm;
  }

  if(!hEl) return;
  if(sel.value==='연차'||sel.value==='하계휴가') hEl.value=8;
  else if(sel.value==='반차'){
    hEl.value=4;
    // 오전/오후 wrap 표시
    const ampmWrap=document.getElementById('half-ampm-wrap');
    if(ampmWrap) ampmWrap.style.display='flex';
    // 현재 선택된 오전/오후에 따라 시간 설정
    const ampmSel=document.querySelector('input[name="half_ampm"]:checked')?.value||'오전';
    const sT=document.getElementById('f-start-time');
    const eT=document.getElementById('f-end-time');
    if(ampmSel==='오전'){ if(sT) sT.value='09:00'; if(eT) eT.value='14:00'; }
    else                 { if(sT) sT.value='14:00'; if(eT) eT.value='18:00'; }
  }
  else if(sel.value==='외출'){
    hEl.value=1;
    const nowK=new Date(Date.now()+9*3600*1000);
    const hh=String(nowK.getUTCHours()).padStart(2,'0');
    const mm=String(nowK.getUTCMinutes()).padStart(2,'0');
    const hh1=String((nowK.getUTCHours()+1)%24).padStart(2,'0');
    const sT=document.getElementById('f-start-time');
    const eT=document.getElementById('f-end-time');
    if(sT) sT.value=hh+':'+mm;
    if(eT) eT.value=hh1+':'+mm;
  }
  else if(sel.value==='병가') hEl.value=0;
  else if(sel.value==='특별휴가') hEl.value=0;

  if(!isFullDay && sel.value!=='외출') onLeaveTimeChange();
  updateLeaveRemainPreview();
}

function onLeaveTimeChange(){
  const s=document.getElementById('f-start-time')?.value;
  const e=document.getElementById('f-end-time')?.value;
  if(!s||!e) return;
  const [sh,sm]=s.split(':').map(Number);
  const [eh,em]=e.split(':').map(Number);
  const startMin=sh*60+sm, endMin=eh*60+em;
  let diff=endMin-startMin;
  if(diff>0){
    // 점심시간(12:00~13:00) 차감: 근무구간이 점심과 겹치는 분만큼 빼기
    const lunchStart=12*60, lunchEnd=13*60;
    const overlapStart=Math.max(startMin,lunchStart);
    const overlapEnd=Math.min(endMin,lunchEnd);
    const lunchOverlap=Math.max(0,overlapEnd-overlapStart);
    diff-=lunchOverlap;
    const hEl=document.getElementById('f-hours');
    if(hEl&&diff>0) hEl.value=Math.round(diff/60*10)/10;
  }
  updateLeaveRemainPreview();
}

function onLeaveHoursInput(){
  const hEl=document.getElementById('f-hours');
  const sT=document.getElementById('f-start-time');
  const eT=document.getElementById('f-end-time');
  if(!hEl||!sT||!eT){ updateLeaveRemainPreview(); return; }
  const hours=parseFloat(hEl.value);
  if(isNaN(hours)||hours<=0){ updateLeaveRemainPreview(); return; }
  let sv=sT.value;
  if(!sv){const nowK=new Date(Date.now()+9*3600*1000);sv=String(nowK.getUTCHours()).padStart(2,'0')+':'+String(nowK.getUTCMinutes()).padStart(2,'0');sT.value=sv;}
  const [sh,sm]=sv.split(':').map(Number);
  let cur=sh*60+sm;
  let rem=Math.round(hours*60);
  // 점심시간(720~780분=12:00~13:00)을 건너뛰면서 rem만큼 진행
  const lunchS=720, lunchE=780;
  if(cur<lunchS){
    const beforeLunch=lunchS-cur;
    if(rem<=beforeLunch){ cur+=rem; rem=0; }
    else{ cur=lunchE; rem-=beforeLunch; } // 점심 건너뜀
  }
  cur+=rem;
  eT.value=String(Math.floor(cur/60)%24).padStart(2,'0')+':'+String(cur%60).padStart(2,'0');
  updateLeaveRemainPreview();
}

async function saveLeave(){
  const s=getDateVal('f-start');if(!s){alert('날짜 입력');return;}
  const sel=document.querySelector('input[name="ltype"]:checked');
  const leaveType=sel?sel.value:'연차';

    showToast('⚠️ 상임이사/임원은 하계휴가만 신청 가능합니다');
    return;
  }
  const e2=getDateVal('f-end')||s;
  if(!checkDateOrder(s,e2,'연차')) return;
  // 중복 체크
  const overlaps=checkLeaveOverlap(empId,s,e2);
  if(overlaps.length>0){
    const info=overlaps.map(o=>'• '+fmt(o.startDate)+(o.endDate&&o.endDate!==o.startDate?' ~ '+fmt(o.endDate):'')+' ('+o.leaveType+', '+(o.status==='pending'?'승인대기':'승인됨')+')').join('\n');

    return;
  }
  const _startTime=document.getElementById('f-start-time')?.value||'';
  const _endTime=document.getElementById('f-end-time')?.value||'';
  const _hours=parseFloat(document.getElementById('f-hours').value)||8;
  const _substitute=document.getElementById('f-substitute')?.value?.trim()||'';
  if(!_substitute){ showToast('⚠️ 대직자를 입력해 주세요'); return; }
  const _r={id:nextId++,type:'leave',empId,status:'pending',year:currentYear,startDate:s,endDate:e2,leaveType,hours:_hours,reason:document.getElementById('f-reason').value||'',substitute:_substitute,reqDate:nowKST(),startTime:_startTime,endTime:_endTime};
  const _saved=await sbInsert('requests',reqToDb(_r));
  if(_saved){
    _r.id=_saved.id;
    // 첨부파일 업로드
    if(window._leaveAttachFile&&_supa){
      try{
        const fn='leave_'+_saved.id+'_'+encodeURIComponent(window._leaveAttachFile.name);
        const {error:upErr}=await _supa.storage.from('attachments').upload(fn,window._leaveAttachFile);
        if(!upErr){
          const {data:{publicUrl}}=_supa.storage.from('attachments').getPublicUrl(fn);
          _r.attachmentUrl=publicUrl||fn;
          await sbUpdate('requests',_saved.id,{attachment_url:_r.attachmentUrl});
        }
        window._leaveAttachFile=null;
      }catch(e){console.warn('첨부파일 오류:',e);}
    }
    db.requests.unshift(_r);
    saveAll();showToast('✅ 신청 완료');await notifyAdmin(_r);
  }else{showToast('⚠️ 저장 실패');}
  closeModal();
  renderLeave();
}

function updateCompRemainPreview(){

function onCompAlldayChange(){
  const allday=document.getElementById('f-comp-allday')?.checked;
  const stW=document.getElementById('comp-st-wrap'),etW=document.getElementById('comp-et-wrap');
  if(stW) stW.style.display=allday?'none':'';
  if(etW) etW.style.display=allday?'none':'';
  if(allday){ const h=document.getElementById('f-hours'); if(h) h.value=8; }
  updateCompRemainPreview();
}
function onCompTimeChange(){
  const s=document.getElementById('f-start-time')?.value;
  const e=document.getElementById('f-end-time')?.value;
  if(!s||!e) return;
  const [sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  const diff=(eh*60+em)-(sh*60+sm);
  if(diff>0){const h=document.getElementById('f-hours');if(h)h.value=Math.round(diff/60*10)/10;}
  updateCompRemainPreview();
}
function onCompHoursInput(){
  const h=document.getElementById('f-hours'),st=document.getElementById('f-start-time'),et=document.getElementById('f-end-time');
  if(!h||!st||!et){ updateCompRemainPreview(); return; }
  const hrs=parseFloat(h.value); if(isNaN(hrs)||hrs<=0){ updateCompRemainPreview(); return; }
  let sv=st.value; if(!sv){const nk=new Date(Date.now()+9*3600*1000);sv=String(nk.getUTCHours()).padStart(2,'0')+':'+String(nk.getUTCMinutes()).padStart(2,'0');st.value=sv;}
  const [sh,sm]=sv.split(':').map(Number),tot=sh*60+sm+Math.round(hrs*60);
  et.value=String(Math.floor(tot/60)%24).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
  updateCompRemainPreview();
}
function autoCalcCompHours(){
  const allday=document.getElementById('f-comp-allday')?.checked;
  if(!allday) return;
  const s=getDateVal('f-start'), e=getDateVal('f-end');
  if(!s) return;
  const start=parseLocalDate(s), end=e?parseLocalDate(e):start;
  if(!start||!end||end<start) return;
  const days=Math.round((end-start)/864e5)+1;
  const h=document.getElementById('f-hours');
  if(h) h.value=days*8;
}

async function saveCompanyEvent(){
  const name=document.getElementById('f-company-name')?.value?.trim();
  if(!name){showToast('⚠️ 일정 내용을 입력하세요');return;}
  const calType=document.querySelector('input[name="caltype"]:checked')?.value||'solar';
  const month=parseInt(document.getElementById('f-month').value)||1;
  const day=parseInt(document.getElementById('f-day').value)||1;
  const note=document.getElementById('f-note')?.value||'';
  const row={emp_id:null,type:'anniversary',name,month,day,cal_type:calType,note};
  let saved=null;
  if(_supa){
    // upsert 대신 onConflict 무시 방식으로 시도, 실패 시 상세 로그
    const {data,error}=await _supa.from('events').insert(row).select().single();
    if(error){
      console.error('saveCompanyEvent error code:',error.code,'message:',error.message,'details:',error.details);
      // 409(중복) 또는 RLS 오류면 upsert로 재시도
      if(error.code==='23505'||error.code==='409'||error.status===409||String(error.code).includes('23')){
        const {data:d2,error:e2}=await _supa.from('events').upsert({...row},{ignoreDuplicates:false}).select().single();
        if(e2){showToast('⚠️ 저장 실패: '+e2.message);return;}
        saved=d2;
      } else {
        showToast('⚠️ 저장 실패: '+error.message);return;
      }
    } else {saved=data;}
  }
  const newEv={id:saved?saved.id:nextEventId++,empId:null,type:'anniversary',name,month,day,calType,note};
  db.events.push(newEv);
  saveAll();showToast('✅ 전사 공통 일정 등록됨');closeModal();renderBday();
}

async function saveHealth(){
  _hMembers.forEach((m,i)=>{
    m.birthdate=getDateVal(`hb-${i}`)||m.birthdate||'';
    m.reserveDate=getDateVal(`hr-${i}`)||m.reserveDate||'';
    m.checkupDate=getDateVal(`hd-${i}`)||m.checkupDate||'';
    m.institution=document.getElementById(`hinst-${i}`)?.value||m.institution||'메디피움 동탄';
    m.cost=+(document.getElementById(`hcost-${i}`)?.value||0);
    m.confirmed=document.getElementById(`conf_${i}`)?.checked||m.confirmed||false;
    m.otherClinic=document.getElementById(`other_${i}`)?.checked||m.otherClinic||false;
    // 생년월일을 직원 정보에도 저장 (본인의 경우)
    if(m.relation==='본인'&&m.birthdate){
      const emp=eid(_hEmpId);
      if(emp) emp.birthdate=m.birthdate;
    }
  });
  const rec={empId:_hEmpId,year:currentYear,members:_hMembers};
  if(_hExistId>=0){const idx=db.health.findIndex(r=>r.id===_hExistId);if(idx>=0)db.health[idx]={...db.health[idx],...rec};}
  else{rec.id=nextHealthId++;db.health.push(rec);}
  if(_hExistId>=0){await sbUpdate('health_records',_hExistId,{members_json:JSON.stringify(_hMembers)});}
  else{const hr=await sbInsert('health_records',{emp_id:_hEmpId,year:currentYear,members_json:JSON.stringify(_hMembers)});if(hr)db.health[db.health.length-1].id=hr.id;}
  // 건강검진 신청/변경 시 관리자 이메일 발송
  await notifyHealthChange(_hEmpId, _hMembers);
  saveAll();showToast('✅ 건강검진 저장됨');closeModal();renderHealth();
}

//  1. 연차·대체휴무 만료 (다음해 3월 1일 소멸)
// ══════════════════════════════════════════════
// 이월연차: 전년도 잔여연차 → 당해 3월 1일 소멸
// 이월대체휴무: 전전년도 잔여대체휴무 → 이미 소멸 처리됨
// getCompCarryover: 전년도 잔여만 이월, 단 3월 1일 이후면 소멸

function isAfterMarch1(year) {
  const today = parseLocalDate(todayStr());
  const march1 = new Date(year, 2, 1); // 3월 1일
  return today >= march1;
}

// 이월 연차: 전년도 잔여, 단 당해 3월 1일 이후면 0
function getLeaveCarryoverEffective(empId, year) {
  const a = getAlloc(empId, year);
  const carryover = +a.carryover || 0;
  // 이미 getAlloc에 저장된 carryover를 쓰되, 3월1일 이후면 소멸
  if (carryover > 0 && isAfterMarch1(year)) return 0;
  return carryover;
}

// 이월 대체휴무: 전년도 잔여, 단 당해 3월 1일 이후면 소멸
function getCompCarryoverEffective(empId, year) {
  if (isAfterMarch1(year)) return 0;
  return Math.max(0, getCompEarned(empId, year-1) - getCompUsed(empId, year-1));
}

function getActiveAlerts() {
  const today = todayStr();
  const mmdd = today.slice(5); // MM-DD
  const customAlerts = db.alerts || [];
  // 기본 알람 + 커스텀 알람 합치기
  const allAlerts = [
    ...DEFAULT_ALERTS.map(a => ({...a, isDefault: true})),
    ...customAlerts.map(a => ({...a, isDefault: false}))
  ];
  // 오늘 날짜가 alert date와 일치하는 것만 (MM-DD 형식 비교) + 대상자 지정 알림은 본인만
  return allAlerts.filter(a => {
    if (a.target_emp_id && (!currentEmp || String(a.target_emp_id) !== String(currentEmp.id))) return false;
    const aDate = a.date || '';
    // full date (YYYY-MM-DD) 또는 MM-DD 둘 다 지원
    if (aDate.length === 10) return aDate === today;
    if (aDate.length === 5) return aDate === mmdd;
    return false;
  });
}

let _absenceBarItems = [];
let _absenceBarIdx = 0;
let _absenceBarTimer = null;

function _slideAbsenceBar(text) {
  const inner = document.getElementById('bday-alarm-inner');
  if (!inner) return;
  inner.style.transition = 'none';
  inner.style.transform = 'translateY(110%)';
  inner.style.opacity = '0';
  inner.textContent = text;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    inner.style.transition = 'transform 0.45s cubic-bezier(.4,0,.2,1), opacity 0.4s ease';
    inner.style.transform = 'translateY(0)';
    inner.style.opacity = '1';
  }));
}

function updateBdayAlarmBar() {
  const bar = document.getElementById('bday-alarm-bar');
  const inner = document.getElementById('bday-alarm-inner');
  // DOM이 아직 준비 안 됐으면 잠시 후 재시도
  if (!bar || !inner) { setTimeout(updateBdayAlarmBar, 300); return; }

  const td = todayStr();
  const typeLabel = {leave:'연차',comp:'대휴',trip:'출장',outside:'외출',education:'교육'};
  _absenceBarItems = (db.requests||[]).filter(r =>
    r && canViewCalendar(r) && r.status==='approved' &&
    (r.type==='leave'||r.type==='comp'||r.type==='trip'||r.type==='outside'||r.type==='education') &&
    r.startDate && r.startDate<=td && (r.endDate||r.startDate)>=td
  ).map(r => {
    const e = eid(r.empId);
    const name = e ? e.name : '?';
    const label = r.type==='leave' ? (r.leaveType||'연차') : (typeLabel[r.type]||r.type);
    return '📌 ' + name + ' ' + label;
  });

  if (!_absenceBarItems.length) { bar.style.setProperty('display','none','important'); return; }
  bar.style.setProperty('display','flex','important');
  bar.style.setProperty('align-items','center','important');
  bar.style.setProperty('visibility','visible','important');
  bar.style.setProperty('opacity','1','important');
  _absenceBarIdx = 0;
  inner.style.transition = 'none';
  inner.style.transform = 'translateY(0)';
  inner.style.opacity = '1';
  inner.textContent = _absenceBarItems[0];

  if (_absenceBarTimer) clearInterval(_absenceBarTimer);
  if (_absenceBarItems.length > 1) {
    _absenceBarTimer = setInterval(() => {
      _absenceBarIdx = (_absenceBarIdx + 1) % _absenceBarItems.length;
      _slideAbsenceBar(_absenceBarItems[_absenceBarIdx]);
    }, 10000);
  }
}

function isNoticeRepeatToday(n) {
  if (!n.repeatConfig) return false;
  const rc = n.repeatConfig;
  const d = parseLocalDate(todayStr());
  if (!d) return false;
  if (rc.unit === 'weekly') return d.getDay() === rc.weekday;
  if (rc.unit === 'monthly') return d.getDate() === rc.day;
  if (rc.unit === 'yearly') {
    if (rc.mode === 'date') return (d.getMonth()+1) === rc.month && d.getDate() === rc.day;
    if (rc.mode === 'week') {
      if ((d.getMonth()+1) !== rc.month || d.getDay() !== rc.weekday) return false;
      const weekOfMonth = Math.ceil(d.getDate() / 7);
      if (rc.week === 5) {
        // 마지막 주: 다음주 같은 요일이 다음달이면 마지막 주
        const next = new Date(d); next.setDate(next.getDate()+7);
        return next.getMonth() !== d.getMonth();
      }
      return weekOfMonth === rc.week;
    }
  }
  return false;
}

  const now = new Date();
  const activeNotices = (db.notices||[]).filter(n => {
    if (n.repeatConfig) {
      if (!isNoticeRepeatToday(n)) return false;
    } else {
      if (!n.startDate || !n.endDate) { return false; }
      if (today < n.startDate || today > n.endDate) { return false; }
    }
    if (n.targetIds && n.targetIds.length && !n.targetIds.map(String).includes(String(currentEmp.id))) { return false; }
    const skipKey = `notice_skip_${n.id}_${today}`;
    if (localStorage.getItem(skipKey)) { return false; }
    return true;
  });
  if (!activeNotices.length) return;
  // 가장 최신 공지 표시
  const notice = activeNotices[0];
  const popupContent = document.getElementById('notice-popup-content');
  if (!popupContent) return;
  popupContent.innerHTML = `
    <div style="font-size:18px;font-weight:700;margin-bottom:12px;color:var(--accent)">📢 공지사항</div>
    <div style="font-size:16px;font-weight:600;margin-bottom:10px">${notice.title}</div>
    ${notice.imageData?`<img src="${notice.imageData}" style="max-width:100%;border-radius:var(--radius);margin-bottom:10px">`:''}
    <div style="font-size:15px;line-height:1.8;white-space:pre-wrap;color:var(--text)">${notice.content}</div>
    <div style="font-size:12px;color:var(--text3);margin-top:10px">게시기간: ${fmt(notice.startDate)} ~ ${fmt(notice.endDate)}</div>
  `;
  const popupBg = document.getElementById('notice-popup-bg');
  if (!popupBg) return;
  popupBg.style.cssText = 'display:flex;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;align-items:center;justify-content:center';
  popupBg._noticeId = notice.id;
}

function closeNoticePopup() {
  const bg = document.getElementById('notice-popup-bg');
  const noToday = document.getElementById('notice-no-today')?.checked;
  if (noToday && bg._noticeId) {
    localStorage.setItem(`notice_skip_${bg._noticeId}_${todayStr()}`, '1');
  }
  bg.style.display = 'none';
}

// ── ESC 키로 열려있는 팝업 닫기 (위에 있는 것부터 하나씩) ──
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  const isOpen = id => {
    const el = document.getElementById(id);
    return el && getComputedStyle(el).display !== 'none';
  };
  // z-index 높은 순: 공지(9000) → 건강알림(2001) → 일반모달(100)
  if (isOpen('notice-popup-bg'))   { closeNoticePopup(); return; }
  if (isOpen('veh-alert-popup'))   { closeVehAlertPopup(false); return; }
  if (isOpen('health-alert-popup')){ closeHealthAlert();  return; }
  if (isOpen('modal-bg'))          { closeModal();        return; }
});

// ══════════════════════════════════════════════
//  공지사항 팝업 관리 (관리자 알람설정 탭)
// ══════════════════════════════════════════════
function renderNoticeManage() {
  const _todayN = todayStr();
  const _noticeRepeatDesc = (n) => {
    const rc = n.repeatConfig;
    if (rc.unit==='weekly') return WEEKDAY_KR[rc.weekday]+'요일마다';
    if (rc.unit==='monthly') return rc.day+'일마다';
    if (rc.unit==='yearly') return rc.mode==='date' ? rc.month+'월 '+rc.day+'일마다' : rc.month+'월 '+['첫째','둘째','셋째','넷째','마지막'][rc.week-1]+'주 '+WEEKDAY_KR[rc.weekday]+'요일';
    return '';
  };
  const _noticeRow = (n) => {
    const isScheduled = n.startDate > _todayN;
    const statusTag = n.repeatConfig
      ? `<span style="background:#e0e7ff;color:#4338ca;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px">🔁 반복</span>`
      : isScheduled
      ? `<span style="background:#fef3c7;color:#92400e;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px">⏰ 예약중</span>`
      : `<span style="background:#dcfce7;color:#166534;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px">게시중</span>`;
    return `
    <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:14px;font-weight:500">${n.title}${statusTag}</div>
        <div style="font-size:13px;color:var(--text3)">${n.repeatConfig?_noticeRepeatDesc(n):(fmt(n.startDate)+' ~ '+fmt(n.endDate))} · 대상 ${n.targetIds.length?n.targetIds.length+'명':'전체'}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" onclick="editNotice(${n.id})">✏️ 수정</button>
        <button class="btn btn-sm btn-danger" onclick="deleteNotice(${n.id})">삭제</button>
      </div>
    </div>`;
  };
  const _noticeDoneRow = (n) => `
    <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;opacity:0.7">
      <div>
        <div style="font-size:14px;font-weight:500">${n.title}<span style="background:#f3f4f6;color:var(--text3);font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px">종료</span></div>
        <div style="font-size:13px;color:var(--text3)">${fmt(n.startDate)} ~ ${fmt(n.endDate)} · 대상 ${n.targetIds.length?n.targetIds.length+'명':'전체'}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" onclick="editNotice(${n.id})">✏️ 수정</button>
        <button class="btn btn-sm btn-danger" onclick="deleteNotice(${n.id})">삭제</button>
      </div>
    </div>`;
  const _allNotices = (db.notices||[]).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const _pendingNotices = _allNotices.filter(n=>n.repeatConfig || n.endDate>=_todayN);
  const _doneNotices = _allNotices.filter(n=>!n.repeatConfig && n.endDate<_todayN);
  const noticeScheduleList = _pendingNotices.map(_noticeRow).join('') || '<div style="color:var(--text3);font-size:14px;padding:12px 0">예약/게시중인 공지사항이 없습니다</div>';
  const noticeDoneList = _doneNotices.map(_noticeDoneRow).join('') || '<div style="color:var(--text3);font-size:14px;padding:12px 0">종료된 공지사항이 없습니다</div>';

  return `
    <div style="margin-top:16px">
      <div class="field" style="margin-bottom:12px"><label>공지 제목</label><input id="notice-title" placeholder="공지 제목"></div>
      <div class="field" style="margin-bottom:12px">
        <label>내용</label>
        <textarea id="notice-content" rows="5" placeholder="공지 내용을 입력하세요"
          style="width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:15px;font-family:inherit;resize:vertical"></textarea>
      </div>
      <div class="field" style="margin-bottom:16px">
        <label>이미지 첨부 (선택)</label>
        <input id="notice-image" type="file" accept="image/*" onchange="onNoticeImageSelect(this)">
        <div style="font-size:12px;color:var(--danger);margin-top:4px">※ 이미지 용량은 2MB를 초과할 수 없습니다.</div>
        <div id="notice-image-preview" style="margin-top:6px"></div>
      </div>
      <div class="field" style="margin-bottom:16px">
        <label>게시 시작일</label>
        <div style="display:flex;gap:12px;margin-top:6px;align-items:center;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px"><input type="radio" name="notice-when" value="now" checked onchange="toggleNoticeSchedule('now')" style="width:14px;height:14px"> 바로 게시</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px"><input type="radio" name="notice-when" value="later" onchange="toggleNoticeSchedule('later')" style="width:14px;height:14px"> 예약 게시</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px"><input type="radio" name="notice-when" value="repeat" onchange="toggleNoticeSchedule('repeat')" style="width:14px;height:14px"> 반복 게시</label>

        <div id="notice-schedule-wrap" style="display:none;margin-top:10px">
          <input id="notice-start-date" type="date" style="padding:9px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:14px">
          <div style="font-size:12px;color:var(--text3);margin-top:4px">※ 선택한 날짜가 되면 자동으로 팝업 알림이 게시됩니다.</div>
        </div>
        <div id="notice-repeat-wrap" style="display:none;margin-top:10px;padding:12px;background:var(--bg);border-radius:var(--radius)">
          <div style="display:flex;gap:12px;margin-bottom:10px">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px"><input type="radio" name="notice-repeat-unit" value="weekly" checked onchange="onNoticeRepeatUnitChange()" style="width:14px;height:14px"> 매주</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px"><input type="radio" name="notice-repeat-unit" value="monthly" onchange="onNoticeRepeatUnitChange()" style="width:14px;height:14px"> 매달</label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px"><input type="radio" name="notice-repeat-unit" value="yearly" onchange="onNoticeRepeatUnitChange()" style="width:14px;height:14px"> 매년</label>
          </div>
          <div id="notice-repeat-detail"></div>
        </div>
      </div>
      <div class="field" style="margin-bottom:16px">
        <label>게시 기간</label>
        <div style="display:flex;gap:12px;margin-top:6px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px"><input type="radio" name="notice-dur" value="1" checked style="width:14px;height:14px"> 하루</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px"><input type="radio" name="notice-dur" value="7" style="width:14px;height:14px"> 일주일</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px"><input type="radio" name="notice-dur" value="30" style="width:14px;height:14px"> 한달</label>
        </div>
      </div>
      <div style="margin-bottom:16px">${makeTargetSelector('notice-target')}</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:20px">
        <button id="notice-cancel-edit-btn" class="btn" style="display:none" onclick="cancelEditNotice()">취소</button>
        <button id="notice-save-btn" class="btn btn-primary" onclick="saveNotice()">📢 공지 등록</button>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:16px">
        <div style="font-size:14px;font-weight:600;margin-bottom:8px">📌 예약/게시중 리스트</div>
        <div id="notice-list" style="max-height:290px;overflow-y:auto">${noticeScheduleList}</div>
        <div style="font-size:14px;font-weight:600;margin:20px 0 8px">✅ 완료 리스트</div>
        <div id="notice-done-list" style="max-height:290px;overflow-y:auto">${noticeDoneList}</div>
      </div>
    </div>`;
}

function onNoticeImageSelect(input) {
  const file = input.files[0];
  if (!file) return;
  const maxSize = 2 * 1024 * 1024; // 2MB
  if (file.size > maxSize) {
    alert('⚠️ 이미지 용량 초과\n\n선택한 이미지: ' + Math.round(file.size/1024) + 'KB\n최대 허용 용량: 2MB(2048KB)\n\n2MB 이하 이미지를 선택해 주세요.');
    input.value = '';
    document.getElementById('notice-image-preview').innerHTML = '';
    window._noticeImageData = null;
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    window._noticeImageData = e.target.result;
    document.getElementById('notice-image-preview').innerHTML =
      '<img src="'+e.target.result+'" style="max-width:100%;max-height:150px;border-radius:var(--radius);border:1px solid var(--border2)">'
      +'<button style="display:block;margin-top:4px;background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px" onclick="clearNoticeImage()">✕ 이미지 제거</button>';
  };
  reader.readAsDataURL(file);
}
function clearNoticeImage() {
  window._noticeImageData = null;
  document.getElementById('notice-image-preview').innerHTML = '';
  document.getElementById('notice-image').value = '';
}

function toggleNoticeSchedule(mode) {
  const wrap = document.getElementById('notice-schedule-wrap');
  if (wrap) wrap.style.display = mode === 'later' ? '' : 'none';
  const repeatWrap = document.getElementById('notice-repeat-wrap');
  if (repeatWrap) {
    repeatWrap.style.display = mode === 'repeat' ? '' : 'none';
    if (mode === 'repeat') onNoticeRepeatUnitChange();
  }
}

const WEEKDAY_KR = ['일','월','화','수','목','금','토'];
function onNoticeRepeatUnitChange() {
  const unit = document.querySelector('input[name="notice-repeat-unit"]:checked')?.value || 'weekly';
  const box = document.getElementById('notice-repeat-detail');
  if (!box) return;
  if (unit === 'weekly') {
    box.innerHTML = `<label style="font-size:13px;color:var(--text2)">
      <select id="notice-repeat-weekday" style="padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:14px">
        ${WEEKDAY_KR.map((d,i)=>`<option value="${i}">${d}요일</option>`).join('')}
      </select> 마다 반복</label>`;
  } else if (unit === 'monthly') {
    box.innerHTML = `<label style="font-size:13px;color:var(--text2)">
      <input id="notice-repeat-day" type="number" min="1" max="31" value="1" style="width:60px;padding:6px 8px;border:1px solid var(--border2);border-radius:var(--radius);font-size:14px;text-align:center">일 마다 반복</label>`;
  } else if (unit === 'yearly') {
    box.innerHTML = `
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="notice-yearly-mode" value="date" checked onchange="onNoticeYearlyModeChange()" style="width:14px;height:14px">
          <span id="notice-yearly-date-wrap"><select id="notice-repeat-month" style="padding:5px 8px;border:1px solid var(--border2);border-radius:var(--radius)">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}월</option>`).join('')}</select>
          <select id="notice-repeat-mday" style="padding:5px 8px;border:1px solid var(--border2);border-radius:var(--radius)">${Array.from({length:31},(_,i)=>`<option value="${i+1}">${i+1}일</option>`).join('')}</select> 마다 반복</span>
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="notice-yearly-mode" value="week" onchange="onNoticeYearlyModeChange()" style="width:14px;height:14px">
          <span id="notice-yearly-week-wrap" style="opacity:0.4"><select id="notice-repeat-month2" disabled style="padding:5px 8px;border:1px solid var(--border2);border-radius:var(--radius)">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}월</option>`).join('')}</select>
          <select id="notice-repeat-week" disabled style="padding:5px 8px;border:1px solid var(--border2);border-radius:var(--radius)">${['첫째','둘째','셋째','넷째','마지막'].map((w,i)=>`<option value="${i+1}">${w}주</option>`).join('')}</select>
          <select id="notice-repeat-wday" disabled style="padding:5px 8px;border:1px solid var(--border2);border-radius:var(--radius)">${WEEKDAY_KR.map((d,i)=>`<option value="${i}">${d}요일</option>`).join('')}</select></span>
        </label>
      </div>`;
  }
}
function onNoticeYearlyModeChange() {
  const mode = document.querySelector('input[name="notice-yearly-mode"]:checked')?.value;
  const dateWrap = document.getElementById('notice-yearly-date-wrap');
  const weekWrap = document.getElementById('notice-yearly-week-wrap');
  if (dateWrap) { dateWrap.style.opacity = mode==='date'?'1':'0.4'; dateWrap.querySelectorAll('select').forEach(s=>s.disabled = mode!=='date'); }
  if (weekWrap) { weekWrap.style.opacity = mode==='week'?'1':'0.4'; weekWrap.querySelectorAll('select').forEach(s=>s.disabled = mode!=='week'); }
}

async function saveNotice() {
  const title = document.getElementById('notice-title')?.value?.trim();
  const content = document.getElementById('notice-content')?.value?.trim();
  const dur = parseInt(document.querySelector('input[name="notice-dur"]:checked')?.value || '1');
  if (!title || !content) { showToast('제목과 내용을 입력하세요'); return; }
  const targets = [...document.querySelectorAll('.notice-target:checked')].map(c => c.value);
  // (notice-target 클래스 사용)
  const whenMode = document.querySelector('input[name="notice-when"]:checked')?.value || 'now';
  let start = todayStr();
  let repeatConfig = null;
  if (whenMode === 'later') {
    const scheduledDate = document.getElementById('notice-start-date')?.value;
    if (!scheduledDate) { showToast('⚠️ 예약 게시일을 선택하세요'); return; }
    if (scheduledDate < todayStr()) { showToast('⚠️ 예약일은 오늘 이후여야 합니다'); return; }
    start = scheduledDate;
  } else if (whenMode === 'repeat') {
    const unit = document.querySelector('input[name="notice-repeat-unit"]:checked')?.value || 'weekly';
    if (unit === 'weekly') {
      repeatConfig = { unit, weekday: parseInt(document.getElementById('notice-repeat-weekday')?.value||'0') };
    } else if (unit === 'monthly') {
      repeatConfig = { unit, day: parseInt(document.getElementById('notice-repeat-day')?.value||'1') };
    } else if (unit === 'yearly') {
      const yMode = document.querySelector('input[name="notice-yearly-mode"]:checked')?.value || 'date';
      if (yMode === 'date') {
        repeatConfig = { unit, mode:'date', month: parseInt(document.getElementById('notice-repeat-month')?.value||'1'), day: parseInt(document.getElementById('notice-repeat-mday')?.value||'1') };
      } else {
        repeatConfig = { unit, mode:'week', month: parseInt(document.getElementById('notice-repeat-month2')?.value||'1'), week: parseInt(document.getElementById('notice-repeat-week')?.value||'1'), weekday: parseInt(document.getElementById('notice-repeat-wday')?.value||'0') };
      }
    }
  }
  const endD = new Date(start); endD.setDate(endD.getDate() + dur - 1);
  const end = endD.toISOString().slice(0,10);
  const imgData = (window._noticeImageData !== undefined) ? window._noticeImageData : (window._editingNoticeImage || null);
  const row = { title, content, duration: dur, target_ids: JSON.stringify(targets), start_date: start, end_date: end, image_data: imgData, repeat_config: repeatConfig?JSON.stringify(repeatConfig):null };

  if (window._editingNoticeId) {
    // 수정 모드
    const editId = window._editingNoticeId;
    const ok = await sbUpdate('notices', editId, row);
    if (ok) {
      const idx = db.notices.findIndex(n=>String(n.id)===String(editId));
      if (idx>=0) db.notices[idx] = { ...db.notices[idx], title, content, duration: dur, targetIds: targets, startDate: start, endDate: end, imageData: row.image_data, repeatConfig };
      window._editingNoticeId = null;
      window._noticeImageData = null;
      showToast('✅ 공지사항 수정됨');
      renderNotifySetting();
    } else { showToast('⚠️ 수정 실패'); }
    return;
  }

  const saved = await sbInsert('notices', row);
  if (saved) {
    db.notices.unshift({ id: saved.id, title, content, duration: dur, targetIds: targets, startDate: start, endDate: end, createdAt: saved.created_at, imageData: row.image_data, repeatConfig });
    window._noticeImageData = null;
    showToast('✅ 공지사항 등록됨');
    // 탭 내 콘텐츠만 갱신 (renderNotifySetting 대신)
    const ec = document.getElementById('notify-extra-content');
    if (ec) ec.innerHTML = renderNoticeManage();
    else renderNotifySetting();
  } else { showToast('⚠️ 등록 실패'); }
}

function editNotice(id) {
  const n = db.notices.find(x=>String(x.id)===String(id));
  if (!n) return;
  window._editingNoticeId = id;
  window._editingNoticeImage = n.imageData || null;

  const titleEl = document.getElementById('notice-title');
  const contentEl = document.getElementById('notice-content');
  if (titleEl) titleEl.value = n.title;
  if (contentEl) contentEl.value = n.content;

  // 반복/예약 여부에 따라 라디오 세팅
  if (n.repeatConfig) {
    const r = document.querySelector('input[name="notice-when"][value="repeat"]');
    if (r) { r.checked = true; toggleNoticeSchedule('repeat'); }
    const unitRadio = document.querySelector(`input[name="notice-repeat-unit"][value="${n.repeatConfig.unit}"]`);
    if (unitRadio) { unitRadio.checked = true; onNoticeRepeatUnitChange(); }
    setTimeout(()=>{
      const rc = n.repeatConfig;
      if (rc.unit==='weekly') { const el=document.getElementById('notice-repeat-weekday'); if(el) el.value=rc.weekday; }
      else if (rc.unit==='monthly') { const el=document.getElementById('notice-repeat-day'); if(el) el.value=rc.day; }
      else if (rc.unit==='yearly') {
        if (rc.mode==='date') {
          const m=document.getElementById('notice-repeat-month'), d=document.getElementById('notice-repeat-mday');
          if(m) m.value=rc.month; if(d) d.value=rc.day;
        } else {
          const wm=document.querySelector('input[name="notice-yearly-mode"][value="week"]');
          if(wm){ wm.checked=true; onNoticeYearlyModeChange(); }
          const m2=document.getElementById('notice-repeat-month2'), w=document.getElementById('notice-repeat-week'), wd=document.getElementById('notice-repeat-wday');
          if(m2) m2.value=rc.month; if(w) w.value=rc.week; if(wd) wd.value=rc.weekday;
        }
      }
    }, 50);
  } else {
    const startD = n.startDate;
    if (startD > todayStr()) {
      const r = document.querySelector('input[name="notice-when"][value="later"]');
      if (r) { r.checked = true; toggleNoticeSchedule('later'); }
      const dateEl = document.getElementById('notice-start-date');
      if (dateEl) dateEl.value = startD;
    }
  }

  // 게시기간(일수) 세팅
  const days = Math.round((parseLocalDate(n.endDate) - parseLocalDate(n.startDate))/864e5) + 1;
  const durRadio = document.querySelector(`input[name="notice-dur"][value="${days}"]`) || document.querySelector('input[name="notice-dur"][value="1"]');
  if (durRadio) durRadio.checked = true;

  // 대상자 세팅
  setTimeout(()=>{
    if (n.targetIds && n.targetIds.length) {
      n.targetIds.forEach(tid=>{
        const cb = document.querySelector(`.notice-target[value="${tid}"]`);
        if (cb) cb.checked = true;
      });
    }
  }, 50);

  if (n.imageData) {
    const preview = document.getElementById('notice-image-preview');
    if (preview) preview.innerHTML = `<img src="${n.imageData}" style="max-width:100%;max-height:150px;border-radius:var(--radius);border:1px solid var(--border2)">
      <button style="display:block;margin-top:4px;background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px" onclick="clearNoticeImage()">✕ 이미지 제거</button>`;
  }

  const saveBtn = document.getElementById('notice-save-btn');
  const cancelBtn = document.getElementById('notice-cancel-edit-btn');
  if (saveBtn) saveBtn.textContent = '✏️ 공지 수정 저장';
  if (cancelBtn) cancelBtn.style.display = '';

  document.querySelector('#notify-popup-body')?.scrollIntoView({behavior:'smooth', block:'start'});
}

function cancelEditNotice() {
  window._editingNoticeId = null;
  window._editingNoticeImage = null;
  renderNotifySetting();
}

async function deleteNotice(id) {
  if (!confirm('공지사항을 삭제하시겠습니까?')) return;
  await sbDelete('notices', id);
  db.notices = db.notices.filter(n => String(n.id) !== String(id));
  showToast('🗑️ 삭제됨');
  updateNoticeAlarmBar();
  if (document.getElementById('page-title')?.textContent === '공지사항') renderNoticeBoard();
  else renderNotifySetting();
}

function renderNoticeBoard() {
  const today = todayStr();

  if (isAdmin) {
    // 관리자: 전체 공지 + 반복알람 목록
    const noticeRows = (db.notices||[]).map(n => {
      const isActive = today >= n.startDate && today <= n.endDate;
      return `<tr>
        <td><span class="badge" style="background:${isActive?'#d1fae5':'#f1f5f9'};color:${isActive?'#065f46':'#64748b'}">${isActive?'게시중':'종료'}</span></td>
        <td style="font-weight:500">${n.title}</td>
        <td style="font-size:13px;color:var(--text2)">${fmt(n.startDate)} ~ ${fmt(n.endDate)}</td>
        <td style="font-size:13px">${n.targetIds?.length||0}명</td>
        <td><button class="btn btn-sm btn-danger" onclick="deleteNotice(${n.id})">삭제</button></td>
      </tr>`;
    }).join('') || `<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:16px">등록된 공지사항 없음</td></tr>`;

    const scheduleRows = (db.notifySchedules||[]).map(s => `
      <tr>
        <td><span class="badge" style="background:${s.sent?'#f1f5f9':'#fef3c7'};color:${s.sent?'#64748b':'#92400e'}">${s.sent?'발송완료':'예약중'}</span></td>
        <td style="font-weight:500">${s.title||'(제목없음)'}</td>
        <td style="font-size:13px;color:var(--text2)">${s.sendAt?fmtDateTime(s.sendAt):'즉시'}</td>
        <td style="font-size:13px">${JSON.parse(s.targetIds||'[]').length}명</td>
        <td>${!s.sent?`<button class="btn btn-sm btn-danger" onclick="cancelSchedule(${s.id})">취소</button>`:''}</td>
      </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:16px">예약된 알람 없음</td></tr>`;

    setContent(`
      <div class="card" style="margin-bottom:10px">
        <div class="card-title">📢 팝업 공지사항
          <button class="btn btn-sm btn-primary" onclick="go('notifysetting')">+ 공지 등록</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>상태</th><th>제목</th><th>게시기간</th><th>대상</th><th></th></tr></thead>
          <tbody>${noticeRows}</tbody>

        <div class="card-title">🔔 반복 알람 내역

        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>상태</th><th>제목</th><th>발송시각</th><th>대상</th><th></th></tr></thead>
          <tbody>${scheduleRows}</tbody>

  } else {

    const myNotices = (db.notices||[]).filter(n => {

function fmtDateTime(dt) {
  if (!dt) return '—';
  const d = new Date(dt);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function submitInquiry() {
  if (!currentEmp) return;
  const title = document.getElementById('inq-title')?.value?.trim();
  const content = document.getElementById('inq-content')?.value?.trim();
  if (!title) { showToast('제목을 입력하세요'); return; }
  if (!content) { showToast('내용을 입력하세요'); return; }
  const row = { emp_id: currentEmp.id, title, content, status: 'pending' };
  const saved = await sbInsert('inquiries', row);
  if (saved) {
    db.inquiries.unshift({ id: saved.id, empId: currentEmp.id, title, content, status: 'pending', createdAt: saved.created_at });
    showToast('✅ 문의가 접수되었습니다');
    closeModal();
    renderInquiry();
  } else { showToast('⚠️ 제출 실패'); }
}

async function editInquiry(inqId) {
  const inq = db.inquiries.find(x => String(x.id) === String(inqId));
  if (!inq) return;
  openModal(`
    <div class="modal-title">문의 수정</div>
    <div class="field" style="margin-bottom:12px">
      <label>제목</label>
      <input id="edit-inq-title" value="${inq.title}">

      <label>내용</label>
      <textarea id="edit-inq-content" rows="6"

    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveEditInquiry(${inqId})">저장</button>

async function saveEditInquiry(inqId) {
  const title = document.getElementById('edit-inq-title')?.value?.trim();
  const content = document.getElementById('edit-inq-content')?.value?.trim();
  if (!title || !content) { showToast('제목과 내용을 입력하세요'); return; }
  const ok = await sbUpdate('inquiries', inqId, { title, content });
  if (ok) {
    const inq = db.inquiries.find(x => String(x.id) === String(inqId));
    if (inq) { inq.title = title; inq.content = content; }
    showToast('✅ 수정되었습니다');
    closeModal();
    renderInquiry();
  } else { showToast('⚠️ 수정 실패'); }
}

async function deleteInquiry(inqId) {
  if (!confirm('문의를 삭제하시겠습니까?')) return;
  // 답변 먼저 삭제
  const repIds = db.inquiryReplies.filter(r => String(r.inquiryId) === String(inqId)).map(r => r.id);
  for (const rid of repIds) { await sbDelete('inquiry_replies', rid); }
  db.inquiryReplies = db.inquiryReplies.filter(r => String(r.inquiryId) !== String(inqId));
  // 문의 삭제
  await sbDelete('inquiries', inqId);
  db.inquiries = db.inquiries.filter(x => String(x.id) !== String(inqId));
  showToast('🗑️ 삭제되었습니다');
  closeModal();
  renderInquiry();
}

async function submitReply(inqId) {
  const content = document.getElementById('inq-reply')?.value?.trim();
  if (!content) { showToast('내용을 입력하세요'); return; }
  const row = { inquiry_id: inqId, emp_id: currentEmp?.id || null, is_admin: isAdmin, content };
  const saved = await sbInsert('inquiry_replies', row);
  if (saved) {
    db.inquiryReplies.push({ id: saved.id, inquiryId: inqId, empId: currentEmp?.id, isAdmin, content, createdAt: saved.created_at });
    // 관리자가 답변하면 상태 변경
    if (isAdmin) {
      await sbUpdate('inquiries', inqId, { status: 'answered' });
      const inq = db.inquiries.find(x => String(x.id) === String(inqId));
      if (inq) inq.status = 'answered';
    }
    showToast('✅ 등록되었습니다');
    closeModal();
    openInquiryDetail(inqId);
  } else { showToast('⚠️ 등록 실패'); }
}

// ══════════════════════════════════════════════
//  관리자 알람설정
// ══════════════════════════════════════════════
// 직책 정렬 순서
const POS_ORDER = ['대표이사','고문','감사','부사장','전무','상무','이사','부장','차장','과장','대리','주임','사원'];
function sortByPosition(emps) {
  return emps.slice().sort((a,b) => {
    const ai = POS_ORDER.findIndex(p => (a.position||'').includes(p));
    const bi = POS_ORDER.findIndex(p => (b.position||'').includes(p));
    return (ai===-1?99:ai) - (bi===-1?99:bi);
  });
}

function makeTargetSelector(cls='notify-target', remainMode=null) {
  // remainMode: 'leave' | 'comp' | null → 잔여치 0이하 대상자 비활성화
  const validEmps = sortByPosition(db.employees.filter(e => !e.isExternal && e.email));
  const yr = currentYear;
  const isDisabled = (e) => {
    if (remainMode==='leave') return getLeaveRemain(e.id, yr) <= 0;
    if (remainMode==='comp') return getCompRemain(e.id, yr) <= 0;
    return false;
  };
  const depts = [...new Set(validEmps.map(e => e.dept).filter(Boolean))].sort();
  const positions = [...new Set(validEmps.map(e => e.position).filter(Boolean))].sort((a,b)=>{
    const ai=POS_ORDER.findIndex(p=>a.includes(p)); const bi=POS_ORDER.findIndex(p=>b.includes(p));
    return (ai===-1?99:ai)-(bi===-1?99:bi);
  });
  const deptBtns = depts.map(d=>`<button class="btn btn-sm" style="font-size:12px" onclick="selectNotifyGroup('dept','${d}','${cls}')">${d}</button>`).join(' ');
  const posBtns = positions.map(p=>`<button class="btn btn-sm" style="font-size:12px" onclick="selectNotifyGroup('position','${p}','${cls}')">${p}</button>`).join(' ');
  const empChk = validEmps.map(e=>{
    const dis = isDisabled(e);
    return `
    <label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:${dis?'not-allowed':'pointer'};font-size:14px;${dis?'opacity:0.4':''}">
      <input type="checkbox" class="${cls}" value="${e.id}" data-email="${e.email}" data-dept="${e.dept||''}" data-position="${e.position||''}" style="width:15px;height:15px" ${dis?'disabled':''}>
      ${av(e.id,22)} ${e.name} <span style="color:var(--text3);font-size:13px">${e.dept} · ${e.position}</span>${dis?' <span style="color:var(--text3);font-size:12px">(잔여 없음)</span>':''}
    </label>`;
  }).join('');
  return `
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">대상자 선택${remainMode?' <span style="font-size:12px;color:var(--text3);font-weight:400">※ 잔여 수 0이하인 경우 비활성화</span>':''}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px">

  if(_supa){

  db.appSettings=db.appSettings||{};

  showToast(`✅ ${emails.length}명 수신 메일 저장 완료`);

async function sendRemainPopupNotify() {
  const title = document.getElementById('popup-notify-title')?.value?.trim();
  const content1 = document.getElementById('popup-notify-content1')?.value?.trim();
  if (!title) { showToast('⚠️ 제목을 입력하세요'); return; }
  const targets = [...document.querySelectorAll('.popup-notify-target:checked')].map(cb=>cb.value);
  if (!targets.length) { showToast('⚠️ 대상자를 선택하세요'); return; }
  const remainType = document.querySelector('input[name="remain-type"]:checked')?.value || 'leave';
  const sendType = document.querySelector('input[name="popup-send-type"]:checked')?.value || 'immediate';
  const yr = currentYear;

  if (sendType === 'schedule') {
    const dateVal = document.getElementById('popup-schedule-date')?.value;
    const timeVal = document.getElementById('popup-schedule-time')?.value || '09:00';
    if (!dateVal) { showToast('⚠️ 예약 날짜를 선택하세요'); return; }
    const sendAt = dateVal + 'T' + timeVal + ':00';
    const row = { type: 'popup-'+remainType, title, content1: content1||'', target_ids: JSON.stringify(targets), send_at: sendAt, sent: false };
    let saved = null;
    if (_supa) {
      const {data,error} = await _supa.from('notify_schedules').insert(row).select().single();
      if (error) { showToast('⚠️ 예약 실패: '+error.message); return; }
      saved = data;
    }
    (db.notifySchedules=db.notifySchedules||[]).push({...row,id:saved?.id,sendAt,targetIds:targets});
    showToast('✅ '+dateVal+' '+timeVal+' 예약 완료');
    document.getElementById('popup-remain-schedule-list').innerHTML = renderPopupRemainScheduleList();
    return;
  }

  // 즉시 게시
  let saved = 0;
  for (const empId of targets) {
    const e = eid(empId);
    if (!e) continue;
    let content2 = '';
    if (remainType === 'leave') {
      const rem = getLeaveRemain(empId, yr);
      content2 = e.name+'님의 잔여 연차: '+Math.round(rem/8*10)/10+'일 ('+rem+'h)';
    } else {
      const rem = getCompRemain(empId, yr);
      content2 = e.name+'님의 잔여 대체휴무: '+rem+'h';
    }
    const row = { date: todayStr(), title, content: (content1?content1+'\n\n':'')+content2, color: '#3b82f6', target_emp_id: empId };
    if (_supa) {
      const { data, error } = await _supa.from('alerts').insert(row).select().single();
      if (!error) { (db.alerts=db.alerts||[]).push({...row, id:data.id}); saved++; }
    }
  }
  // 완료 리스트에 기록
  const doneRow = { type: 'popup-'+remainType, title, content1: content1||'', target_ids: JSON.stringify(targets), send_at: new Date().toISOString(), sent: true };
  if (_supa) {
    const {data} = await _supa.from('notify_schedules').insert(doneRow).select().single();
    if (data) (db.notifySchedules=db.notifySchedules||[]).push({...doneRow,id:data.id,sendAt:doneRow.send_at,targetIds:targets});
  }
  showToast('✅ 팝업 알림 등록 완료 ('+saved+'명)');
  const doneList = document.getElementById('popup-remain-done-list');
  if (doneList) doneList.innerHTML = renderPopupRemainDoneList();
}

async function sendRemainNotify() {
  const remainType = document.querySelector('input[name="remain-type"]:checked')?.value || 'leave';
  const title = document.getElementById('notify-title')?.value?.trim();
  const content1 = document.getElementById('notify-content1')?.value?.trim();
  if (!title) { showToast('⚠️ 제목을 입력하세요'); return; }
  const targets = [...document.querySelectorAll('.notify-target:checked')].map(cb=>cb.value);
  if (!targets.length) { showToast('⚠️ 대상자를 선택하세요'); return; }
  const sendType = document.querySelector('input[name="notify-send-type"]:checked')?.value;
  if (sendType === 'schedule') {
    const dateVal = document.getElementById('notify-schedule-date')?.value;
    const timeVal = document.getElementById('notify-schedule-time')?.value || '09:00';
    if (!dateVal) { showToast('⚠️ 예약 날짜를 선택하세요'); return; }
    const sendAt = dateVal + 'T' + timeVal + ':00';
    const row = { type: remainType, title, content1: content1||'', target_ids: JSON.stringify(targets), send_at: sendAt, sent: false };
    let saved = null;
    if (_supa) {
      const {data,error} = await _supa.from('notify_schedules').insert(row).select().single();
      if (error) { showToast('⚠️ 예약 실패: '+error.message); return; }
      saved = data;
    }
    (db.notifySchedules=db.notifySchedules||[]).push({...row,id:saved?.id,sendAt,targetIds:targets});
    showToast('✅ '+dateVal+' '+timeVal+' 예약 완료');
    document.getElementById('notify-schedule-list').innerHTML = renderNotifyScheduleList('remain');
    return;
  }
  // 즉시 전송
  const yr = currentYear;
  for (const empId of targets) {
    const e = eid(empId);
    if (!e || !e.email) continue;
    let content2 = '';
    if (remainType === 'leave') {
      const rem = getLeaveRemain(empId, yr);
      content2 = e.name+'님의 잔여 연차: '+Math.round(rem/8*10)/10+'일 ('+rem+'h)';
    } else {
      const rem = getCompRemain(empId, yr);
      content2 = e.name+'님의 잔여 대체휴무: '+rem+'h';
    }
    await sendEmailViaResend(e.email, title, (content1?content1+'\n\n':'')+content2);
  }
  showToast('✅ 발송 완료 ('+targets.length+'명)');
  const doneRow = { type: remainType, title, content1: content1||'', target_ids: JSON.stringify(targets), send_at: new Date().toISOString(), sent: true };
  if (_supa) {
    const {data} = await _supa.from('notify_schedules').insert(doneRow).select().single();
    if (data) (db.notifySchedules=db.notifySchedules||[]).push({...doneRow,id:data.id,sendAt:doneRow.send_at,targetIds:targets});
  }
  const dl = document.getElementById('notify-done-list');
  if (dl) dl.innerHTML = renderNotifyDoneList('remain');
}

async function sendEmailViaResend(to, subject, body) {

    });

function onAlertImageSelect(input) {
  const file = input.files[0];
  if (!file) return;
  const maxSize = 2 * 1024 * 1024; // 2MB
  if (file.size > maxSize) {
    alert('⚠️ 이미지 용량 초과\n\n선택한 이미지: ' + Math.round(file.size/1024) + 'KB\n최대 허용 용량: 2MB(2048KB)\n\n2MB 이하 이미지를 선택해 주세요.');
    input.value = '';
    document.getElementById('alert-image-preview').innerHTML = '';
    window._alertImageData = null;
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    window._alertImageData = e.target.result;
    document.getElementById('alert-image-preview').innerHTML =
      '<img src="'+e.target.result+'" style="max-width:100%;max-height:150px;border-radius:var(--radius);border:1px solid var(--border2)">'
      +'<button style="display:block;margin-top:4px;background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px" onclick="clearAlertImage()">✕ 이미지 제거</button>';
  };
  reader.readAsDataURL(file);
}
function clearAlertImage() {
  window._alertImageData = null;
  document.getElementById('alert-image-preview').innerHTML = '';
  document.getElementById('f-alert-image').value = '';
}

async function saveAlert() {
  const date = document.getElementById('f-alert-date')?.value?.trim();

  let saved = null;
  if (_supa) {

function renderNotifyScheduleList(typeFilter) {
  // typeFilter: 'remain' → leave/comp, 'etc' → etc, undefined → 전체
  const matchType = (t) => {
    if (typeFilter==='remain') return t==='leave'||t==='comp';
    if (typeFilter==='etc') return t==='etc';
    return true;
  };
  const scheduled = (db.notifySchedules || []).filter(s => !s.sent && s.sendAt && matchType(s.type))
    .slice().sort((a,b)=>(b.sendAt||'').localeCompare(a.sendAt||''));
  if (!scheduled.length) return '<div style="text-align:center;padding:16px;color:var(--text3);font-size:14px">예약된 알림이 없습니다</div>';
  return scheduled.map(s => `

      <div>
        <div style="font-size:14px;font-weight:500">${s.title}</div>
        <div style="font-size:13px;color:var(--text3)">${fmtDateTime(s.sendAt)} 발송 예정 · 대상 ${JSON.parse(s.targetIds||'[]').length}명</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" onclick="editSchedule(${s.id})">✏️ 수정</button>
        <button class="btn btn-sm btn-danger" onclick="cancelSchedule(${s.id})">삭제</button>
      </div>
    </div>
  `).join('');
}
function renderNotifyDoneList(typeFilter) {
  const matchType = (t) => {
    if (typeFilter==='remain') return t==='leave'||t==='comp';
    if (typeFilter==='etc') return t==='etc';

  const done = (db.notifySchedules || []).filter(s => s.sent && matchType(s.type))
    .slice().sort((a,b)=>(b.sendAt||'').localeCompare(a.sendAt||''));

async function syncBirthdayEvent(e) {
  // 이 직원의 birthday 이벤트 전체 조회 (중복 포함)
  const allBirthdays = db.events.filter(ev =>
    String(ev.empId) === String(e.id) && ev.type === 'birthday'
  );

  // 생일 정보 없으면 → 전부 삭제
  if (!e.birthdate) {
    for (const ev of allBirthdays) {
      await sbDelete('events', ev.id);
    }
    db.events = db.events.filter(ev =>
      !(String(ev.empId) === String(e.id) && ev.type === 'birthday')
    );
    return;
  }

  const parts = e.birthdate.split('-');
  if (parts.length < 3) return;
  const month   = parseInt(parts[1]);
  const day     = parseInt(parts[2]);
  const calType = e.birthdateLunar ? 'lunar' : 'solar';
  const evName  = e.name + ' 생일';

  if (allBirthdays.length === 0) {
    // 없으면 새로 생성
    const saved = await sbInsert('events', {
      emp_id: e.id, type: 'birthday', name: evName, month, day, cal_type: calType, note: ''
    });
    if (saved) {
      db.events.push({ id: saved.id, empId: e.id, type: 'birthday', name: evName, month, day, calType, note: '' });
    }
  } else {
    // 첫 번째만 업데이트, 나머지 중복 삭제
    const keep = allBirthdays[0];
    const dups = allBirthdays.slice(1);
    for (const dup of dups) {
      await sbDelete('events', dup.id);
    }
    db.events = db.events.filter(ev =>
      !dups.some(d => String(d.id) === String(ev.id))
    );
    keep.name = evName; keep.month = month; keep.day = day; keep.calType = calType;
    await sbUpdate('events', keep.id, {
      name: evName, month, day, cal_type: calType, type: 'birthday', note: keep.note || ''
    });
  }
  saveAll();
}

function vehAddMonths(ds, m){
  const d=parseLocalDate(ds); if(!d) return '';

  const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day,last));
  return toLocalDateStr(d);
}
function vehAddDays(ds, n){ const d=parseLocalDate(ds); if(!d) return ''; d.setDate(d.getDate()+n); return toLocalDateStr(d); }

// ── 정기검사 자동 계산 (비사업용) ──
function vehAgeYears(v, atDate){
  const at=parseLocalDate(atDate||todayStr());
  if(v.firstRegDate){ const r=parseLocalDate(v.firstRegDate); return (at-r)/(365.25*864e5); }
  if(v.modelYear) return at.getFullYear()-Number(v.modelYear);
  return 0;
}
function vehPeriodMonths(v, atDate){
  const type=v.carType||'승용', size=v.carSize||'소형', age=vehAgeYears(v, atDate);
  if(type==='승용') return 24;
  if(size==='경형'||size==='소형') return age<=4?24:12;
  if(type==='승합') return age<=8?12:6;
  return 12; // 화물 중형·대형
}
function vehFirstExpire(v){
  if(!v.firstRegDate) return '';
  if((v.carType||'승용')==='승용') return vehAddMonths(v.firstRegDate, VEH_FIRST_INSPECT_MONTHS_SEDAN);
  return vehAddMonths(v.firstRegDate, vehPeriodMonths(v, v.firstRegDate));
}
// 검사기간(만료일 전 90일 ~ 후 31일) 안에 받으면 기존 만료일 기준, 아니면 검사일 기준으로 다음 만료일 계산
function vehCalcNextExpire(v, inspectDate){
  if(!inspectDate) return '';
  const exp=v.inspectExpire;
  let base=inspectDate;
  if(exp){
    const ws=vehAddDays(exp,-90), we=vehAddDays(exp,31);
    if(inspectDate>=ws && inspectDate<=we) base=exp;
  }
  return vehAddMonths(base, vehPeriodMonths(v, base));
}
function vehInspectWindowBadge(v){
  if(!v.inspectExpire) return '';
  const t=todayStr(), ws=vehAddDays(v.inspectExpire,-90), we=vehAddDays(v.inspectExpire,31);
  if(t>=ws && t<=we) return '<span style="background:#dbeafe;color:#1d4ed8;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600;margin-left:4px">검사 가능 기간 ('+fmt(ws)+'~'+fmt(we)+')</span>';
  return '';
}
