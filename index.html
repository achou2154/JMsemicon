<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f9f8f5;--border:#e8e6df;--border2:#d4d1c8;
  --text:#1a1916;--text2:#6b6860;--text3:#9b9890;
  --accent:#2d5a8e;--accent-light:#e8f0f9;--accent2:#1a3d5c;
  --leave:#2e7d52;--leave-bg:#eaf5ef;
  --ot:#b45309;--ot-bg:#fef3e2;
  --trip:#6d28d9;--trip-bg:#f3f0ff;
  --comp:#be185d;--comp-bg:#fdf2f8;
  --bday:#0369a1;--bday-bg:#e0f2fe;
  --health:#0f766e;--health-bg:#f0fdfa;
  --danger:#c0392b;--danger-bg:#fdf0ef;
  --warn:#d97706;--warn-bg:#fffbeb;
  --ok:#15803d;--ok-bg:#f0fdf4;
  --radius:8px;--radius-lg:12px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button{cursor:pointer;font-family:inherit;font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:18px 18px 12px;border-bottom:1px solid var(--border)}
.logo h1{font-size:16px;font-weight:700;color:var(--accent)}
.logo p{font-size:12px;color:var(--text3);margin-top:2px}
.sync-row{display:flex;align-items:center;gap:5px;margin-top:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:#22c55e;animation:pulse 2s infinite}
.sync-dot.err{background:#ef4444}
.sync-dot.loading{background:#f59e0b;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-label{font-size:11px;color:var(--text3)}
.nav-wrap{padding:8px 6px;flex:1;overflow-y:auto;padding-bottom:80px}
.nav-sec{padding:10px 8px 3px;font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:1px 0;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:14px;border:none;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{position:sticky;bottom:0;padding:10px;border-top:1px solid var(--border);background:var(--surface);z-index:100}
.footer-btns{display:flex;gap:5px;margin-bottom:8px}
.footer-btn{flex:1;padding:5px 0;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);background:transparent;color:var(--text2);text-align:center}
.footer-btn:hover{background:var(--bg)}

.mode-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--bg);border-radius:var(--radius)}
.mode-label{font-size:13px;color:var(--text2)}
.mode-btn{font-size:12px;padding:3px 9px;border:1px solid var(--border2);border-radius:5px;background:var(--surface);color:var(--text)}
.admin-chip{font-size:11px;padding:2px 7px;border-radius:3px;background:var(--accent);color:#fff;font-weight:600}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow-y:auto;height:100vh;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 22px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-title{font-size:16px;font-weight:600;padding-left:36px}
.topbar-right{display:flex;align-items:center;gap:10px}
select.yr{padding:5px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:14px;background:var(--surface);color:var(--text)}
.content{flex:1;overflow-y:auto;padding:22px}

/* Setup banner */
.setup-banner{background:#fff8e6;border:1px solid #fcd34d;border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px}
.setup-banner h2{font-size:16px;font-weight:600;margin-bottom:8px;color:#92400e}
.setup-url-row{display:flex;gap:8px;margin-top:10px}
.setup-url-row input{flex:1;padding:8px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:14px;font-family:monospace}
.setup-url-row button{padding:8px 16px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-size:14px}

/* Cards, tables, badges, buttons — same as before */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow)}
.stat-label{font-size:12px;color:var(--text3);margin-bottom:5px}
.stat-val{font-size:24px;font-weight:700}
.stat-sub{font-size:12px;color:var(--text3);margin-top:3px}
.stat-card.leave .stat-val{color:var(--leave)}
.stat-card.ot .stat-val{color:var(--ot)}
.stat-card.trip .stat-val{color:var(--trip)}
.stat-card.comp .stat-val{color:var(--comp)}
.stat-card.health .stat-val{color:var(--health)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:8px 12px;font-size:12px;color:var(--text3);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
.table-wrap{overflow-x:auto}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.badge-leave{background:var(--leave-bg);color:var(--leave)}
.badge-ot{background:var(--ot-bg);color:var(--ot)}
.badge-trip{background:var(--trip-bg);color:var(--trip)}
.badge-comp{background:var(--comp-bg);color:var(--comp)}
.badge-bday{background:var(--bday-bg);color:var(--bday)}
.badge-health{background:var(--health-bg);color:var(--health)}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-neutral{background:var(--bg);color:var(--text2);border:1px solid var(--border2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:14px}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-sm{padding:4px 10px;font-size:13px}
.btn-danger{color:var(--danger);border-color:#e8a09a}.btn-danger:hover{background:var(--danger-bg)}
.btn-ok{color:var(--ok);border-color:#86efac}.btn-ok:hover{background:var(--ok-bg)}
.btn-warn{color:var(--warn);border-color:#fcd34d}.btn-warn:hover{background:var(--warn-bg)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.col1{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--text2);font-weight:500}
.field input,.field select{padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:14px;background:var(--surface);color:var(--text);font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
/* 커스텀 날짜 입력 */
.date-input-wrap{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 10px;background:var(--surface);font-size:14px;color:var(--text);width:100%}
.date-input-wrap:focus-within{border-color:var(--accent)}
.date-seg{border:none;outline:none;background:transparent;font-size:14px;color:var(--text);font-family:inherit;text-align:center;padding:0;min-width:0;caret-color:var(--accent)}
.date-seg::placeholder{color:var(--text3)}
.date-sep{color:var(--text3);font-size:14px;padding:0 2px;user-select:none;flex-shrink:0}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.name-cell{display:flex;align-items:center;gap:8px}
.info-bar{border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-size:13px}
.req-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);font-size:13px;color:var(--text2)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sub-tab-btn{padding:5px 14px;border-radius:16px;border:1px solid #86efac;background:#fff;font-size:13px;color:#166534;cursor:pointer}
/* 서류철 폴더탭 스타일 */
.folder-tabs{display:flex;gap:2px;margin-bottom:0;padding-left:4px}
.folder-tab{padding:9px 20px;border:1px solid var(--border2);border-bottom:none;border-radius:10px 10px 0 0;background:#eef0f2;color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;position:relative;top:1px}
.folder-tab.active{background:var(--surface);color:var(--text);font-weight:700;border-bottom:1px solid var(--surface);z-index:2}
.folder-body{border:1px solid var(--border2);border-radius:0 8px 8px 8px;background:var(--surface);padding:20px;min-height:200px}
.sub-tab-btn.active{background:#22c55e;color:#fff;border-color:#22c55e;font-weight:600}
.row-pending td{background:#fffdf5}
.prog-bar-wrap{background:var(--bg);border-radius:99px;height:6px;width:80px;display:inline-block;vertical-align:middle;overflow:hidden}
.prog-bar{height:100%;border-radius:99px;background:var(--leave)}
.empty-row td{text-align:center;color:var(--text3);padding:32px}
/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative}
.cal-nav h2{font-size:16px;font-weight:600;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
@media(max-width:768px){
  .cal-grid{gap:2px}
  .cal-day{min-height:0 !important;aspect-ratio:1/1.1;padding:2px 3px !important;font-size:11px !important}
  .cal-day .dn{font-size:12px !important}
  .cal-event{font-size:10px !important;padding:1px 2px !important}
}
.cal-dow{text-align:center;font-size:12px;color:var(--text3);font-weight:600;padding:4px 0 8px}
.cal-day{min-height:72px;border:1px solid var(--border);border-radius:6px;padding:4px 5px;background:var(--surface);font-size:12px;box-sizing:border-box}
.cal-day.today{border-color:var(--accent)}
.cal-day.other-month{background:var(--surface2);opacity:.5}
.cal-day .dn{font-weight:600;margin-bottom:2px;font-size:13px}
.cal-day.today .dn{color:var(--accent)}
.cal-day.sun .dn{color:#e11d48}
.cal-event{font-size:11px;padding:1px 4px;border-radius:3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-leave{background:var(--leave-bg);color:var(--leave)}
.ev-summer{background:#ffedd5;color:#c2410c;font-weight:600}
.ev-ot{background:var(--ot-bg);color:var(--ot)}
.ev-trip{background:var(--trip-bg);color:var(--trip)}
.ev-comp{background:var(--comp-bg);color:var(--comp)}
.ev-bday{background:var(--bday-bg);color:var(--bday)}
.ev-health{background:var(--health-bg);color:var(--health)}
.legend{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:2px}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:28px 32px;width:480px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal.modal-lg{width:min(1400px,95vw) !important;max-width:95vw !important;max-height:92vh !important}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:20px 24px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-title{font-size:18px;font-weight:600;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.upcoming-chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;background:#fef9c3;color:#854d0e;margin-left:5px}
.health-ok{color:var(--ok)}
.health-warn{color:var(--warn)}
.health-danger{color:var(--danger)}
.health-none{color:var(--text3)}
</style>
</head>
<body>
<div class="app">

<!-- Sidebar -->

async function loadAllData() {

      _supa.from('events').select('*'),
      _supa.from('health_records').select('*'),
      _supa.from('alerts').select('*').order('date'),
    ]);
    db.employees  = (emp.data    || []).map(normalizeEmp);
    db.leaveAlloc = (la.data     || []).map(normalizeLa);
    db.requests   = (req.data    || []).map(normalizeReq);
    db.events     = (ev.data     || []).map(normalizeEv);

    try {
      const [inq, rep, noticeRes, nsRes] = await Promise.all([
        _supa.from('inquiries').select('*').order('created_at', {ascending:false}),
        _supa.from('inquiry_replies').select('*').order('created_at', {ascending:true}),
        _supa.from('notices').select('*').order('created_at', {ascending:false}),
        _supa.from('notify_schedules').select('*').order('send_at', {ascending:true}),

      db.inquiries      = (inq.data    || []).map(r=>({id:r.id,empId:r.emp_id,title:r.title,content:r.content,status:r.status,createdAt:r.created_at}));

      db.notices        = (noticeRes.data || []).map(r=>{

      });
      db.notifySchedules = (nsRes.data || []).map(r=>({id:r.id,type:r.type,title:r.title,content1:r.content1,targetIds:JSON.parse(r.target_ids||'[]'),sendAt:r.send_at,sent:r.sent||false}));
    } catch(e2) { console.warn('부가 테이블 로드 실패 (무시):', e2); }
    // 하계휴가 계획 + 전역설정 (테이블 없으면 무시)

      const [spRes, asRes] = await Promise.all([

      ]);

      db.appSettings = {};
      (asRes.data||[]).forEach(r=>{
        // JSON 문자열이면 파싱해서 저장 (배열 등)
        if(typeof r.value==='string'&&(r.value.startsWith('[')||r.value.startsWith('{'))){
          try{ db.appSettings[r.key]=JSON.parse(r.value); }catch(e){ db.appSettings[r.key]=r.value; }
        } else { db.appSettings[r.key]=r.value; }

    await loadVehicleData(); // 차량관리
    recalcNextIds();
    setSyncStatus('ok');
    saveCache(); // 삭제/변경사항이 반영된 최신 상태를 캐시에 저장
  } catch(e) {
    console.warn('loadAllData error:', e);
    setSyncStatus('err');
    loadFromCache();
  }
}

// ── 컬럼명 변환 (snake_case → camelCase) ──
function normalizeEmp(r) {
  return { id:r.id, user_id:r.user_id, name:r.name, dept:r.dept,
    position:r.position, phone:r.phone, email:r.email,
    joinDate:r.join_date||'', isExternal:r.is_external||false,
    employmentType:r.employment_type||(r.is_external?'상임이사':'정직원'),
    birthdate:r.birthdate||'', birthdateLunar:r.birthdate_lunar||false,
    address:r.address||'', avatarUrl:r.avatar_url||'',
    muteNotify:r.mute_notify||false,
    anniversaryType:r.anniversary_type||'birthday',
    isInactive:r.is_inactive||false };
}
function normalizeLa(r) {
  return { id:r.id, empId:r.emp_id, year:r.year, total:r.total||0, carryover:r.carryover||0, extinct:r.extinct||0 };
}
function normalizeReq(r) {
  return { id:r.id, type:r.type, empId:r.emp_id, status:r.status, year:r.year,
    reason:r.reason||'', substitute:r.substitute||'', reqDate:r.req_date||'', startDate:r.start_date||'',
    endDate:r.end_date||'', leaveType:r.leave_type||'', hours:r.hours||0,
    date:r.date||'', otType:r.ot_type||'', useTransport:r.use_transport||false,
    dest:r.dest||'', tripKind:r.trip_kind||'', allowance:r.allowance||0,
    transReqPending:r.trans_req_pending||false,
    startTime:r.start_time||'', endTime:r.end_time||'' };
}
function normalizeEv(r) {
  return { id:r.id, empId:r.emp_id??null, type:r.type, name:r.name,
    month:r.month, day:r.day, calType:r.cal_type||'solar', note:r.note||'' };
}
function normalizeHealth(r) {
  let members = [];
  try { members = JSON.parse(r.members_json||'[]'); } catch {}
  // 본인 예약일: members에서 relation=본인 우선, 없으면 reserve_date
  const mainMem = members.find(m=>m.relation==='본인')||members[0];
  const reserveDate = mainMem?.reserveDate || r.reserve_date || '';
  return {
    id: r.id, empId: r.emp_id, year: r.year, members,
    approved: r.approved||false,
    status: r.status||'pending',
    reserveDate,
    checkupDate: r.checkup_date||'',
    reqDate: r.req_date||''
  };
}

async function sbInsert(table, row) {
  if (!_supa) return null;
  // header_id나 id 컬럼에 TEMP_KEY가 들어오면 차단
  const checkId = row?.id ?? row?.header_id;
  if (checkId && String(checkId).startsWith('_')) {
    console.error(`sbInsert 차단: TEMP_KEY가 포함됨 (table=${table}, id=${checkId})`);
    return null;
  }
  const { data, error } = await _supa.from(table).insert(row).select().single();
  if (error) { console.error('insert error:', error); return null; }
  return data;
}
async function sbUpdate(table, id, row) {
  if (!_supa) return false;
  // 숫자(bigint) 또는 UUID만 허용 — 문자열 TEMP_KEY 차단
  const idStr = String(id ?? '');
  const isValidId = idStr && /^[0-9a-f-]{1,}$/i.test(idStr) && !idStr.startsWith('_');
  if (!isValidId) {
    console.error(`sbUpdate 차단: 유효하지 않은 id (table=${table}, id=${idStr})`);
    return false;
  }
  const { data, error } = await _supa.from(table).update(row).eq('id', id).select();
  if (error) { console.error('update error:', error); return false; }
  if (!data || data.length === 0) {
    console.error(`update matched 0 rows: table=${table}, id=${id} (RLS 차단 또는 id 불일치 가능성)`);
    return false;
  }
  return true;
}
async function sbDelete(table, id) {
  if (!_supa) return null;
  const { error } = await _supa.from(table).delete().eq('id', id);
  if (error) { console.error('delete error:', error); return null; }
  return true;
}

// 관리자 이메일 목록 (Supabase admins 테이블에서 로드)
let adminEmails = [];

async function loadAdminEmails() {
  if (!_supa) return;
  try {
    // admins 테이블의 user_id로 employees 테이블에서 이메일 조회
    const { data } = await _supa.from('admins').select('user_id');
    if (!data || !data.length) return;
    const adminUserIds = data.map(a => a.user_id);
    adminUserIdSet = new Set(adminUserIds);
    // 직원 전체에서 admin user_id와 일치하는 이메일 찾기 (알림 음소거 제외)
    const { data: empData } = await _supa.from('employees').select('user_id, email, mute_notify');
    if (empData) {
      adminEmails = empData
        .filter(e => adminUserIds.includes(e.user_id) && e.email && !e.mute_notify)
        .map(e => e.email);
    }
  } catch(e) { console.warn('관리자 이메일 로드 실패:', e); }
}

async function notifyAdmin(req) {
  if (!_supa) return;
  await loadAdminEmails(); // 매번 최신 음소거 상태 반영
  if (!adminEmails.length) return;
  const typeMap = { leave:'연차', ot:'특근', comp:'대체휴무', trip:'출장', outside:'외근', education:'교육' };
  const typeName = typeMap[req.type] || req.type;
  let detail = '';
  if (req.type==='leave') detail = `${req.leaveType} / ${req.startDate}${req.endDate&&req.endDate!==req.startDate?' ~ '+req.endDate:''} / ${req.hours}h`;
  else if (req.type==='ot') detail = `${req.otType} / ${req.date} / ${req.hours}h`;
  else if (req.type==='comp') detail = `${req.startDate} / ${req.hours}h`;
  else if (req.type==='trip') detail = `${req.startDate} ~ ${req.endDate} / ${req.dest}`;

  const applicant = eid(req.empId); // 실제 신청 대상 직원
  const agent = currentEmp;         // 현재 로그인한 사람 (대리 신청자)

  const whoLine = isSame
    ? `<strong>${applicant?.name||'직원'}</strong> (${applicant?.dept||''}) 님이`
    : `<strong>${applicant?.name||'직원'}</strong> (${applicant?.dept||''}) 님 / 대리신청: <strong>${agent?.name||''}</strong> 님이`;

    const _afterD = Math.round(_afterH/8*10)/10;

  // SheetJS(XLSX) 라이브러리로 Excel 생성
  if (typeof XLSX === 'undefined') {
    showToast('⚠️ Excel 라이브러리 로딩 중... 잠시 후 다시 시도해주세요');
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => exportExcel();
    document.head.appendChild(s);
    return;
  }

  const wb = XLSX.utils.book_new();
  const typeMap = {leave:'연차',ot:'특근',comp:'대체휴무',trip:'출장',outside:'외근',education:'교육'};
  const statusMap = {pending:'승인대기',approved:'승인됨',rejected:'반려',completed:'수검완료',modify_requested:'수정신청'};

  // 0-1. 전체현황 — 전월 컬럼 통합
  const yr0 = currentYear;
  const activeEmps0 = db.employees.filter(e=>!e.isExternal && !e.isInactive);
  const getOTTotalY = (empId,yr)=>db.requests.filter(r=>r.type==='ot'&&String(r.empId)===String(empId)&&String(r.year)===String(yr)&&r.status==='approved').reduce((s,r)=>s+(+r.hours||0),0);
  const summerByEmp0={};
  db.requests.filter(r=>r.type==='leave'&&r.leaveType==='하계휴가'&&String(r.year)===String(yr0)).forEach(r=>{
    (summerByEmp0[r.empId]=summerByEmp0[r.empId]||[]).push(r);
  });

  // 직전월 계산
  const nowD2 = new Date();
  const pMo = nowD2.getMonth()===0 ? 12 : nowD2.getMonth();
  const pYr = nowD2.getMonth()===0 ? nowD2.getFullYear()-1 : nowD2.getFullYear();
  const pStr = `${pYr}-${String(pMo).padStart(2,'0')}`;
  const inPrevMoStr = (d) => d && String(d).slice(0,7)===pStr;
  const inPrevMoRange2 = (r) => {
    const s2=r.startDate||r.date||'', e2=r.endDate||s2;
    return s2.slice(0,7)<=pStr && e2.slice(0,7)>=pStr;
  };
  const getPrevLeaveUsed = (empId) => Math.round(db.requests.filter(r=>r.type==='leave'&&r.status==='approved'&&String(r.empId)===String(empId)&&inPrevMoRange2(r)&&r.leaveType!=='하계휴가').reduce((acc,r)=>acc+(+r.hours||0),0)/8*10)/10;
  const getPrevOT = (empId) => db.requests.filter(r=>r.type==='ot'&&r.status==='approved'&&String(r.empId)===String(empId)&&inPrevMoStr(r.date||'')).reduce((acc,r)=>acc+(+r.hours||0),0);
  const getPrevCompUsed = (empId) => db.requests.filter(r=>r.type==='comp'&&r.status==='approved'&&String(r.empId)===String(empId)&&inPrevMoRange2(r)).reduce((acc,r)=>acc+(+r.hours||0),0);
  const getPrevTrip = (empId) => db.requests.filter(r=>r.type==='trip'&&r.status==='approved'&&String(r.empId)===String(empId)&&inPrevMoRange2(r)).length;

  const overviewRows = [];
  overviewRows.push({
    '연번':'', '직원':'', '부서':'',
    '① 잔여연차':'이월(일)', '__1':'부여(일)', '__2':'전월 사용(일)', '__3':'총 사용(일)', '__4':'잔여(일)',
    '② 발생특근':'전월 발생(h)', '__5':'총 특근(h)', '__6':'총 환산대휴(h)',
    '③ 잔여대휴':'발생(h)', '__7':'전월 사용(h)', '__8':'사용(h)', '__9':'잔여(h)',
    '④ 출장':'전월건수', '__10':'총 건수', '⑤ 교통비':'금액(원)',
    '⑥ 하계휴가':'휴가기간', '__11':'일수', '__12':'잔여연차(일)'
  });

  activeEmps0.slice().sort((a,b)=>getLeaveRemain(b.id,yr0)-getLeaveRemain(a.id,yr0)).forEach((e,idx)=>{
    const a=getAlloc(e.id,yr0);
    const carry=Math.round((a.carryover||0)/8*10)/10;
    const grant=Math.round((a.total||0)/8*10)/10;
    const used=Math.round(getLeaveUsed(e.id,yr0)/8*10)/10;
    const remain=Math.round(getLeaveRemain(e.id,yr0)/8*10)/10;
    const prevLeave=getPrevLeaveUsed(e.id)||'';
    const ot=getOTTotalY(e.id,yr0);
    const otConv=ot>0?getCompEarned(e.id,yr0):'';
    const prevOt=getPrevOT(e.id)||'';
    const earned=getCompEarned(e.id,yr0), compUsed=getCompUsed(e.id,yr0), compRemain=getCompRemain(e.id,yr0);
    const hasComp=earned>0||compUsed>0;
    const prevComp=getPrevCompUsed(e.id)||'';
    const tripCnt=db.requests.filter(r=>r.type==='trip'&&String(r.empId)===String(e.id)&&String(r.year)===String(yr0)&&r.status==='approved').length;
    const prevTrip=getPrevTrip(e.id)||'';
    const trans=getTransTotal(e.id,yr0);
    const summerItems=summerByEmp0[e.id]||[];
    const summerPeriods=summerItems.length?summerItems.slice().sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||'')).map(r=>r.startDate+(r.endDate&&r.endDate!==r.startDate?' ~ '+r.endDate:'')).join(', '):'';
    const summerDays=summerItems.length?Math.round(summerItems.reduce((acc,r)=>acc+(+r.hours||0),0)/8*10)/10:'';
    overviewRows.push({
      '연번':idx+1, '직원':e.name,
      '부서':e.dept+(e.employmentType==='계약직'?'(계약)':''),
      '① 잔여연차':carry, '__1':grant, '__2':prevLeave, '__3':used, '__4':remain,
      '② 발생특근':prevOt, '__5':ot>0?ot:'', '__6':otConv,
      '③ 잔여대휴':hasComp?earned:'', '__7':prevComp, '__8':hasComp?compUsed:'', '__9':hasComp?compRemain:'',
      '④ 출장':prevTrip, '__10':tripCnt>0?tripCnt:'', '⑤ 교통비':trans>0?trans:'',
      '⑥ 하계휴가':summerPeriods, '__11':summerDays, '__12':summerItems.length?remain:''
    });
  });
  const ws0 = XLSX.utils.json_to_sheet(overviewRows, {skipHeader:false});
  XLSX.utils.book_append_sheet(wb, ws0, '전체현황');

  // 0-2. 출퇴근내역
  const attRows = (db.attendance||[]).slice().sort((a,b)=>String(a.empId).localeCompare(String(b.empId))||(a.date||'').localeCompare(b.date||'')).map(a=>{
    const e=eid(a.empId);
    return {'직원':e?e.name:'?','부서':e?e.dept:'','날짜':a.date,'구분':a.dayType||'',
      '출근':a.clockIn||'','퇴근':a.clockOut||'','기본(h)':a.baseHours||0,'연장(h)':a.otHours||0};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(attRows), '출퇴근내역');

  // 1. 직원 명부
  const empRows = db.employees.map(e => ({
    'ID': e.id, '이름': e.name, '부서': e.dept, '직책': e.position,
    '연락처': e.phone, '이메일': e.email, '입사일': e.joinDate,
    '생년월일': e.birthdate, '음양력': e.birthdateLunar?'음력':'양력',
    '상임이사': e.isExternal?'⭐':''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(empRows), '직원 명부');

  // 2. 연차 배분
  const laRows = db.leaveAlloc.map(la => {
    const e = eid(la.empId);
    return { '직원': e?e.name:'?', '부서': e?e.dept:'', '년도': la.year,
      '부여연차(h)': la.total||0, '이월(h)': la.carryover||0,
      '부여(일)': Math.round((la.total||0)/8*10)/10,
      '이월(일)': Math.round((la.carryover||0)/8*10)/10 };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(laRows), '연차 배분');

  // 3. 신청 내역
  const reqRows = db.requests.map(r => {
    const e = eid(r.empId);
    return { '직원': e?e.name:'?', '부서': e?e.dept:'', '년도': r.year,
      '유형': typeMap[r.type]||r.type,
      '구분': r.leaveType||r.otType||r.tripKind||'',
      '시작일': r.startDate||r.date||'', '종료일': r.endDate||'',
      '시간(h)': r.hours||'', '사유': r.reason||'',
      '상태': statusMap[r.status]||r.status, '신청일': r.reqDate||'' };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(reqRows), '신청 내역');

  // 4. 기념일·생일
  const evRows = db.events.map(ev => {
    const e = eid(ev.empId);
    return { '직원': e?e.name:'?', '유형': ev.type==='birthday'?'생일':'기념일',
      '이름': ev.name, '월': ev.month, '일': ev.day,
      '음양력': ev.calType==='lunar'?'음력':'양력' };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(evRows), '기념일·생일');

  // 5. 건강검진
  const healthRows = db.health.map(h => {
    const e = eid(h.empId);
    const fam = (h.members||[]).filter(m=>m.relation!=='본인');
    return { '직원': e?e.name:'?', '부서': e?e.dept:'', '년도': h.year,
      '예약일': h.reserveDate||'', '수검일': h.checkupDate||'',
      '상태': statusMap[h.status]||h.status,
      '승인': h.approved?'승인':'미승인',
      '가족수': fam.length,
      '가족정보': fam.map(m=>`${m.relation}(${m.name||''}/${m.birthdate||''})`).join(', ') };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(healthRows), '건강검진');

  // 6. 공지사항
  const noticeRows = (db.notices||[]).map(n => ({
    '제목': n.title, '내용': n.content, '기간(일)': n.duration,
    '시작일': n.startDate, '종료일': n.endDate, '대상자수': (n.targetIds||[]).length
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(noticeRows), '공지사항');


  XLSX.writeFile(wb, `JM근태_${todayStr()}.xlsx`);
  showToast('📊 Excel 다운로드 시작');
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `근태백업_${todayStr()}.json`;
  a.click();
  showToast('💾 백업 파일 다운로드 시작');
}

function resetAll() {
  if (!confirm('⚠️ 모든 로컬 캐시를 초기화하시겠습니까?')) return;
  localStorage.removeItem(LS_CACHE);
  location.reload();
}

function saveCache() {
  try { localStorage.setItem(LS_CACHE, JSON.stringify(db)); } catch {}
}
function loadFromCache() {
  try {
    const raw = localStorage.getItem(LS_CACHE);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.employees) db = d;
    recalcNextIds();
  } catch {}
}

function recalcNextIds() {
  const allIds = [...(db.requests||[]).map(r=>+r.id||0), ...(db.employees||[]).map(r=>+r.id||0)];
  nextId = allIds.length ? Math.max(...allIds)+1 : 100;
  const eIds = (db.events||[]).map(r=>+r.id||0);
  nextEventId = eIds.length ? Math.max(...eIds)+1 : 100;
  const hIds = (db.health||[]).map(r=>+r.id||0);
  nextHealthId = hIds.length ? Math.max(...hIds)+1 : 100;
}

async function doLogin() {
  const email = document.getElementById('login-email')?.value?.trim();
  const pw    = document.getElementById('login-pw')?.value;
  const errEl = document.getElementById('login-err');
  const btn   = document.getElementById('login-btn');
  if (!email || !pw) { if(errEl) errEl.textContent='이메일과 비밀번호를 입력하세요'; return; }
  if (btn) { btn.textContent='로그인 중...'; btn.disabled=true; }
  const { error } = await _supa.auth.signInWithPassword({ email, password:pw });
  if (error) {
    if (errEl) errEl.textContent = '이메일 또는 비밀번호가 올바르지 않습니다';
    if (btn) { btn.textContent='로그인'; btn.disabled=false; }
  } else {
    // 아이디/비번 저장 처리
    const saveEmail = document.getElementById('save-email')?.checked;
    const savePw    = document.getElementById('save-pw')?.checked;
    if (saveEmail) localStorage.setItem('saved_email', email);
    else localStorage.removeItem('saved_email');
    if (savePw) localStorage.setItem('saved_pw', pw);
    else localStorage.removeItem('saved_pw');
  }
}

async function onSignedIn(user) {
  try {
    // 로그인 화면 숨기고 앱 표시 (먼저)
    const loginDiv = document.getElementById('login-screen');
    if (loginDiv) loginDiv.style.display = 'none';
    document.querySelector('.app').style.display = 'flex';
    currentUser = user;

    // 직원 정보 로드
    try {
      const { data: empData } = await _supa
        .from('employees').select('*').eq('user_id', user.id).single();
      currentEmp = empData ? normalizeEmp(empData) : null;
    } catch(e) { console.warn('직원정보 로드 실패:', e); }

    // 관리자 여부 확인
    try {
      const { data: adminData } = await _supa
        .from('admins').select('id').eq('user_id', user.id).maybeSingle();
      isAdmin = !!adminData;
    } catch(e) { isAdmin = false; }

    updateAdminUI();

    // 접기/펴기 버튼 표시
    const sbBtn = document.getElementById('sb-toggle-fixed-btn');
    if (sbBtn) sbBtn.style.display = '';

    // 데이터 로드
    await loadAllData();
    await loadAdminEmails();
    // 로그인 후 항상 달력으로 시작
    currentPage = 'calendar';
    go('calendar');
    setTimeout(checkAndShowAlerts, 2500);
    setTimeout(checkVehicleAlertPopup, 4000); // 차량 만기 알림
    startIdleTimer(); // 20분 무활동 자동 로그아웃 시작
  } catch(e) {
    console.error('onSignedIn 오류:', e);
    // 오류나도 앱은 표시
    go('calendar');
  }
}

function onSignedOut() {
  stopIdleTimer();
  currentUser = null; currentEmp = null; isAdmin = false;
  // 접기/펴기 버튼 숨김
  const sbBtn = document.getElementById('sb-toggle-fixed-btn');
  if (sbBtn) sbBtn.style.display = 'none';
  document.querySelector('.app').style.display = 'none';
  showLoginScreen();
}

// ══════════════════════════════════════════════
//  무활동 자동 로그아웃 (총 20분: 19분 경고 + 60초 카운트다운)
//  타임스탬프 기반 + 1초 인터벌 + 복귀 시 즉시검사 → 절전/방치에도 확실히 로그아웃
// ══════════════════════════════════════════════
const IDLE_LOGOUT_MS = 20 * 60 * 1000;  // 20분 → 로그아웃
const IDLE_WARN_MS   = 19 * 60 * 1000;  // 19분 → 경고 팝업
let _idleLastActive = Date.now();
let _idleInterval = null;
let _idleWarnShown = false;

// 실제 '활동'으로 간주할 이벤트 (마우스 단순 이동은 제외 → 방치 시 확실히 로그아웃)
const _IDLE_EVENTS = ['click','keydown','mousedown','scroll','touchstart'];

function _idleTouch() {
  // 경고 팝업이 떠있는 동안엔 '계속 사용하기' 버튼으로만 해제 (실수 방지)
  if (_idleWarnShown) return;
  _idleLastActive = Date.now();
}

function startIdleTimer() {
  _idleLastActive = Date.now();
  _IDLE_EVENTS.forEach(ev => document.addEventListener(ev, _idleTouch, { passive: true }));
  document.addEventListener('visibilitychange', _idleCheckNow);
  window.addEventListener('focus', _idleCheckNow);
  clearInterval(_idleInterval);
  _idleInterval = setInterval(_idleTick, 1000);
}

function stopIdleTimer() {
  clearInterval(_idleInterval); _idleInterval = null;
  _IDLE_EVENTS.forEach(ev => document.removeEventListener(ev, _idleTouch));
  document.removeEventListener('visibilitychange', _idleCheckNow);
  window.removeEventListener('focus', _idleCheckNow);
  hideIdleWarning();
}

function _idleTick() {
  if (!currentUser) return;
  const idle = Date.now() - _idleLastActive;
  if (idle >= IDLE_LOGOUT_MS) { _doIdleLogout(); return; }
  if (idle >= IDLE_WARN_MS) {
    const remain = Math.max(0, Math.ceil((IDLE_LOGOUT_MS - idle) / 1000));
    showIdleWarning(remain);
  }
}

// 탭 복귀/포커스 시 즉시 검사 (절전에서 깨어난 경우 등)
function _idleCheckNow() {
  if (!currentUser) return;
  if (Date.now() - _idleLastActive >= IDLE_LOGOUT_MS) _doIdleLogout();
}

function _doIdleLogout() {
  stopIdleTimer();
  if (_supa) _supa.auth.signOut();
}

function showIdleWarning(remain) {
  const bg = document.getElementById('idle-warn-bg');
  const num = document.getElementById('idle-warn-count');
  if (!bg || !num) return;
  _idleWarnShown = true;
  num.textContent = remain;
  bg.style.display = 'flex';
}

function hideIdleWarning() {
  _idleWarnShown = false;
  const bg = document.getElementById('idle-warn-bg');
  if (bg) bg.style.display = 'none';
}

// '계속 사용하기' 버튼
function keepSessionAlive() {
  _idleLastActive = Date.now();
  hideIdleWarning();
}

// 날짜 포맷: 2026-03-15 → 26.03.15 (연도 뒤 2자리)
function fmt(d){
  if(!d) return '';
  const s=String(d);
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1].slice(2)+'.'+m[2]+'.'+m[3];
  return s.replace(/-/g,'.');
}

function moveDateFocus(el, nextId, maxLen){
  // 숫자만 허용
  el.value = el.value.replace(/[^0-9]/g,'');
  if(el.value.length >= maxLen && nextId){
    const next = document.getElementById(nextId);
    if(next){ next.focus(); next.select(); }
  }
}

function dateSegKey(e, el, prevId, nextId){
  // Backspace on empty → 이전 필드로
  if(e.key==='Backspace' && el.value==='' && prevId){
    const prev=document.getElementById(prevId);
    if(prev){ prev.focus(); prev.setSelectionRange(prev.value.length,prev.value.length); }
  }
  // Tab/Enter → 다음
  if((e.key==='Tab'||e.key==='Enter') && nextId) {
    e.preventDefault();
    const next=document.getElementById(nextId);
    if(next){ next.focus(); next.select(); }
  }
}

// ── 근로기준법 연차 자동 계산 ──
function calcLegalLeave(joinDate) {
  // 입사일로부터 법정 연차 계산 (최대 25일)
  if (!joinDate) return 15;
  const join = parseLocalDate(joinDate);
  const today = parseLocalDate(todayStr());
  const yearsWorked = (today - join) / (365.25 * 24 * 60 * 60 * 1000);
  if (yearsWorked < 1) return 11; // 1년 미만: 매월 1일씩 (최대 11)
  const fullYears = Math.floor(yearsWorked);
  // 만 1년: 15일, 만 3년부터 2년마다 1일씩 추가, 최대 25일
  let days = 15;
  if (fullYears >= 3) days += Math.floor((fullYears - 1) / 2);
  return Math.min(days, 25);
}

// 연차 사용률 계산 기준: 당해 3/1 ~ 다음해 2/28(29)
function getLeavePeriod(year) {
  const start = `${year}-03-01`;
  const endYear = year + 1;
  // 윤년 확인
  const isLeap = (endYear % 4 === 0 && endYear % 100 !== 0) || endYear % 400 === 0;
  const end = `${endYear}-02-${isLeap ? '29' : '28'}`;
  return { start, end };
}

function getLeavePctInPeriod(empId, year) {
  // 3/1~2/28 기간 내 사용한 연차만 계산
  const { start, end } = getLeavePeriod(year);
  const used = db.requests.filter(r =>
    r.type === 'leave' && String(r.empId) === String(empId) &&
    r.status === 'approved' &&
    r.startDate >= start && r.startDate <= end
  ).reduce((s, r) => s + (+r.hours || 0), 0);
  const a = getAlloc(empId, year);
  const total = (+a.total || 0) + (+a.carryover || 0);
  return total > 0 ? Math.round(used / total * 100) : 0;
}

// 관리자용 연차 잔여 경고 기준 (월별)
function getLeaveAlertThreshold() {
  const month = new Date().getMonth() + 1; // 1~12
  const thresholds = { 5:80, 6:70, 7:60, 8:50, 9:40, 10:30, 11:20, 12:10 };
  return thresholds[month] || null; // null이면 경고 없음
}

function isLeaveAlert(pct) {
  if (!isAdmin) return false;
  const threshold = getLeaveAlertThreshold();
  if (threshold === null) return false;
  return pct >= threshold;
}

// leaveAlloc helpers
function getAlloc(empId, year) {
  const a = db.leaveAlloc.find(r=>String(r.empId)===String(empId)&&String(r.year)===String(year));
  if (!a) {
    const newA = { empId, year, total: 120, carryover: 0 };
    db.leaveAlloc.push(newA);
    return newA;
  }
  return a;
}
function getLeaveUsed(empId, year) {
  return db.requests.filter(r=>r.type==='leave'&&String(r.empId)===String(empId)&&String(r.year)===String(year)&&r.status==='approved'&&r.leaveType!=='병가'&&r.leaveType!=='특별휴가').reduce((s,r)=>s+(+r.hours||0),0);
}
// 양감 계약직: 입사일 기준 법정연차(만1년 후 15일~) 별도 적용
const YANGGAM_CONTRACT_NAMES = ['이연화', '임서진']; // 대상자 이름만 지정, 입사일은 직원정보의 실제 값 사용
function isYanggamContract(empId) {
  const e = db.employees.find(x=>String(x.id)===String(empId));
  return !!(e && YANGGAM_CONTRACT_NAMES.includes(e.name));
}
function getYanggamJoinDate(empId) {
  const e = db.employees.find(x=>String(x.id)===String(empId));
  return e ? e.joinDate : null; // 직원정보 화면에서 수정한 실제 입사일을 그대로 사용
}
function getLeaveRemain(empId, year) {
  if (isYanggamContract(empId)) {
    const joinDate = getYanggamJoinDate(empId);
    const legalDays = calcLegalLeave(joinDate); // 입사일 기준 법정연차(일)
    const totalHours = legalDays * 8;
    return totalHours - getLeaveUsed(empId, year);
  }
  const a=getAlloc(empId,year);
  return (+a.total||0)+(+a.carryover||0)-(+a.extinct||0)-getLeaveUsed(empId,year);
}
function calcComp(hours,otType){return Math.round((+hours)*(OT_RATE[otType]||1.5)*10)/10;}
function getCompEarned(empId,year){
  return db.requests.filter(r=>r.type==='ot'&&String(r.empId)===String(empId)&&String(r.year)===String(year)&&r.status==='approved'&&!r.useTransport).reduce((s,r)=>s+calcComp(r.hours,r.otType),0);
}
function getCompUsed(empId,year){
  return db.requests.filter(r=>r.type==='comp'&&String(r.empId)===String(empId)&&String(r.year)===String(year)&&r.status==='approved').reduce((s,r)=>s+(+r.hours||0),0);
}
function getCompCarryover(empId,year){
  const py=year-1;
  return Math.max(0,getCompEarned(empId,py)-getCompUsed(empId,py));
}
function getCompRemain(empId,year){return getCompCarryover(empId,year)+getCompEarned(empId,year)-getCompUsed(empId,year);}
// 대체휴무 만료 계산: 발생일로부터 1년 이내 사용 (건별)
function getCompExpired(empId, year) {
  // 해당 연도 특근 중 발생일+1년이 오늘 이전인 것 → 만료
  const today = todayStr();
  return db.requests
    .filter(r=>r.type==='ot'&&String(r.empId)===String(empId)&&String(r.year)===String(year)&&r.status==='approved'&&!r.useTransport)
    .filter(r=>{
      if(!r.date) return false;
      const exp = new Date(r.date); exp.setFullYear(exp.getFullYear()+1);
      return toLocalDateStr(exp) < today;
    })
    .reduce((s,r)=>s+calcComp(r.hours,r.otType),0);
}
function getCompValidRemain(empId, year) {
  // 유효한 잔여 대휴: 전체 잔여 - 만료된 것
  const rem = getCompRemain(empId, year);
  const expired = getCompExpired(empId, year);
  return Math.max(0, rem - expired);
}
// 만료 임박(30일 이내) 대휴 시간
function getCompExpiringSoon(empId, year) {
  const today = parseLocalDate(todayStr());
  const soon = new Date(today); soon.setDate(soon.getDate()+30);
  const soonStr = toLocalDateStr(soon);
  return db.requests
    .filter(r=>r.type==='ot'&&String(r.empId)===String(empId)&&String(r.year)===String(year)&&r.status==='approved'&&!r.useTransport)
    .filter(r=>{
      if(!r.date) return false;
      const exp = new Date(r.date); exp.setFullYear(exp.getFullYear()+1);
      const expStr = toLocalDateStr(exp);
      return expStr >= todayStr() && expStr <= soonStr;
    })
    .reduce((s,r)=>s+calcComp(r.hours,r.otType),0);
}

function isWeekendOrHoliday(dateStr) {
  const d = parseLocalDate(dateStr);
  if (!d) return false;
  const dow = d.getDay(); // 0=일, 6=토
  return dow === 0 || dow === 6 || isKrHoliday(dateStr);
}
// 시작일~종료일 사이 실제 근무일수(주말/공휴일 제외) 계산
function countWorkDays(startStr, endStr) {
  const start = parseLocalDate(startStr);
  const end = endStr ? parseLocalDate(endStr) : start;
  if (!start || !end || end < start) return 0;
  let count = 0;
  const cur = new Date(start);
  while (cur <= end) {
    const ds = toLocalDateStr(cur);
    if (!isWeekendOrHoliday(ds)) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

// 타임존 안전 날짜 유틸 (UTC 오프셋 문제 방지)
function parseLocalDate(str){
  if(!str) return null;
  const [y,m,d]=str.split('-').map(Number);
  return new Date(y,m-1,d); // 로컬 타임존 기준
}
function toLocalDateStr(date){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,'0');
  const d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function nowKST() {
  const d = new Date(Date.now() + 9*3600*1000);
  return d.toISOString().slice(0,10) + ' ' + d.toISOString().slice(11,16);
}
function checkDateOrder(startDate, endDate, label) {
  if (!startDate || !endDate) return true;
  if (endDate < startDate) {
    alert('⚠️ 날짜 오류' + (label?' ('+label+')':'') + '\n\n종료일이 시작일보다 이전입니다.\n\n시작일: ' + fmt(startDate) + '\n종료일: ' + fmt(endDate) + '\n\n날짜를 다시 확인해 주세요.');
    return false;
  }
  return true;
}
function todayStr(){
  return toLocalDateStr(new Date());
}
function lunarToSolar(year, lm, ld){
  const data = LUNAR_DATA[year];
  if(!data) return null;
  let offset = 0;
  for(let m = 1; m < lm; m++) offset += data.months[m-1] || 30;
  offset += ld - 1;
  const base = parseLocalDate(data.start);
  base.setDate(base.getDate() + offset);
  return toLocalDateStr(base);
}
function getEventDate(ev,year){
  if(ev.calType==='lunar') return lunarToSolar(year,+ev.month,+ev.day)||`${year}-${String(ev.month).padStart(2,'0')}-${String(ev.day).padStart(2,'0')}`;
  return `${year}-${String(ev.month).padStart(2,'0')}-${String(ev.day).padStart(2,'0')}`;
}
function iterDates(s,e,fn){
  let d=parseLocalDate(s);
  const end=parseLocalDate(e);
  while(d<=end){ fn(toLocalDateStr(d)); d.setDate(d.getDate()+1); }
}

// ── 마감일 헬퍼 ──
function cardDeadline(year, month) {
  // 당월 사용분 → 다음달 10일까지 제출
  // ex) 9월 사용분 → 10월 10일 마감
  const nextMonth = month === 12 ? 1 : month + 1;
  const nextYear  = month === 12 ? year + 1 : year;
  const mm = String(nextMonth).padStart(2,'0');
  return {
    soft: `${nextYear}-${mm}-05`,  // 다음달 5일: 조기 마감 권고
    hard: `${nextYear}-${mm}-10`   // 다음달 10일: 최종 마감
  };
}
function cardDeadlineStatus(year, month) {
  const today = todayStr();
  const { soft, hard } = cardDeadline(year, month);
  if (today > hard) return 'closed';   // 마감
  if (today > soft) return 'warning';  // 5일 초과 ~ 9일
  return 'open';
}

// ── db 초기화 헬퍼 ──
function getCardHeader(empId, year, month) {
  return (db.cardHeaders||[]).find(h => String(h.empId)===String(empId) && h.year===year && h.month===month) || null;
}
function getCardRows(headerId, category, filterYear, filterMonth) {
  return (db.cardRows||[]).filter(r => {
    if(String(r.headerId)!==String(headerId)) return false;
    if(category && r.category!==category) return false;
    // useDate가 있고 filterYear/filterMonth가 지정된 경우 해당 월 데이터만 표시
    if(filterYear && filterMonth && r.useDate){
      const d = String(r.useDate).slice(0,7); // 'YYYY-MM'
      const expected = `${filterYear}-${String(filterMonth).padStart(2,'0')}`;
      if(d && d!==expected) return false;
    }
    return true;
  }).sort((a,b)=>a.seq-b.seq);
}
function getCardAttachments(headerId) {
  return (db.cardAttachments||[]).filter(a => String(a.headerId)===String(headerId));
}

// ── 직전 제출 은행정보 불러오기 ──
function getLastBankInfo(empId) {
  // 상태 무관하게 계좌정보가 있는 가장 최근 헤더에서 가져옴 (월이 바뀌어도 유지)
  const headers = (db.cardHeaders||[])
    .filter(h=>String(h.empId)===String(empId) && (h.bankName||h.accountNumber||h.accountHolder))
    .sort((a,b)=>{ if(a.year!==b.year) return b.year-a.year; return b.month-a.month; });
  if (!headers.length) return { bankName:'', accountNumber:'', accountHolder:'' };
  const h = headers[0];
  return { bankName: h.bankName||'', accountNumber: h.accountNumber||'', accountHolder: h.accountHolder||'' };
}

      <button class="btn btn-primary" onclick="downloadCardExcel(${header.id})">📥 엑셀 다운로드</button>
    </div>` : `
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-bottom:24px">
      <button class="btn btn-primary" onclick="downloadCardExcel(${header?.id})">📥 엑셀 다운로드</button>
    </div>`)}
  `);
  window._cardYr=yr; window._cardMo=mo; window._cardEmpId=empId;
  window._cardHeaderId=headerId||(`_NEW_${empId}_${yr}_${mo}`);
}

// ── 기존 양식 엑셀 업로드 → 자동 파싱 ──
// ── 엑셀 헤더 기반 동적 매핑 파서 ──
// 헤더 텍스트로 컬럼 위치를 찾아서 매핑 → 양식 구조 변경에 강인
function parseCellDate(cell){
  if(!cell) return '';
  // Date 객체: toISOString()은 UTC 기준이라 한국(UTC+9)에서 하루 빠질 수 있음
  // → 로컬 날짜 기준으로 추출
  if(cell instanceof Date){
    const y=cell.getFullYear();
    const m=String(cell.getMonth()+1).padStart(2,'0');
    const d=String(cell.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  // Excel serial number → 로컬 날짜
  if(typeof cell==='number'&&cell>1000){
    const jsDate=new Date(Math.round((cell-25569)*86400*1000));
    // UTC 기준 날짜 사용 (serial은 UTC 기준)
    const y=jsDate.getUTCFullYear();
    const m=String(jsDate.getUTCMonth()+1).padStart(2,'0');
    const d=String(jsDate.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  // 문자열: YYYY-MM-DD / YYYY.MM.DD / 20260806 등
  const str=String(cell).replace(/\./g,'-').trim();
  const m=str.match(/(\d{4})[^\d](\d{2})[^\d](\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  // YYYYMMDD 붙어있는 경우
  const m2=str.match(/^(\d{4})(\d{2})(\d{2})/);
  if(m2) return `${m2[1]}-${m2[2]}-${m2[3]}`;
  return str.slice(0,10);
}

function findColByKeywords(headers, keywords){
  // 헤더 배열에서 키워드 중 하나라도 포함된 첫 번째 열 인덱스 반환
  for(let i=0;i<headers.length;i++){
    const h=String(headers[i]||'').replace(/\s|\n/g,'');
    if(keywords.some(k=>h.includes(k))) return i;
  }
  return -1;
}

function parseCardExcelSheet(aoa){
  const ccParsed=[], ctParsed=[];
  const KEY=window._cardHeaderId||'_NEW_';
  let bankInfo={bankName:'',accountNumber:'',accountHolder:''};

  // ── 입금 정보 파싱 (은행명/계좌번호/예금주명 헤더 행 탐색) ──
  aoa.forEach((row,ri)=>{
    const rowText=row.map(c=>String(c||'').trim());
    // '은행명' 헤더 행 찾기
    if(rowText.some(c=>c==='은행명')&&rowText.some(c=>c.includes('계좌'))){
      const bankCol  = row.findIndex(c=>String(c||'').trim()==='은행명');
      const acctCol  = row.findIndex(c=>String(c||'').replace(/\s/g,'').includes('계좌번호'));
      const holderCol= row.findIndex(c=>String(c||'').replace(/\s/g,'').includes('예금주'));
      // 다음 행이 실제 데이터
      const dataRow=aoa[ri+1]||[];
      if(bankCol>=0&&dataRow[bankCol])   bankInfo.bankName     =String(dataRow[bankCol]).trim();
      if(acctCol>=0&&dataRow[acctCol])   bankInfo.accountNumber=String(dataRow[acctCol]).trim();
      if(holderCol>=0&&dataRow[holderCol])bankInfo.accountHolder=String(dataRow[holderCol]).trim();
      // 헤더가 없이 바로 데이터가 있는 경우: 은행명 행 자체가 데이터인 경우
      if(!bankInfo.bankName&&bankCol>=0&&aoa[ri][bankCol]&&aoa[ri][bankCol]!=='은행명'){
        bankInfo.bankName     =String(aoa[ri][bankCol]).trim();
        bankInfo.accountNumber=acctCol>=0?String(aoa[ri][acctCol]||'').trim():'';
        bankInfo.accountHolder=holderCol>=0?String(aoa[ri][holderCol]||'').trim():'';
      }
    }
  });

  // NO 헤더가 있는 행들을 모두 찾아서 섹션별로 처리
  const headerRows=[];
  aoa.forEach((row,ri)=>{
    const r0=String(row[0]||'').trim();
    const r1=String(row[1]||'').trim();
    if((r0==='NO'||r1==='NO') && row.some(c=>String(c||'').includes('사용일'))){
      headerRows.push({ri, row, _section:''});
    }
  });

  for(const {ri, row} of headerRows){
    const noCol    = row.findIndex(c=>String(c||'').trim()==='NO');
    const dateCol  = findColByKeywords(row,['사용일자']);
    const detailCol= findColByKeywords(row,['사용내역','적요']);
    const amtCol   = findColByKeywords(row,['사용금액']);
    const placeCol = findColByKeywords(row,['사용처']);
    const rcptCol  = findColByKeywords(row,['지출증빙','영수증유']);
    const branchCol= findColByKeywords(row,['개인/본사','개인/본사/양감']);

    // 카드사/카드번호: 없을 수도 있음 (공백 셀 등) → 카드번호만 있는 경우도 처리
    let cardCoCol = findColByKeywords(row,['카드사','카드사(은행)']);
    let cardNoCol = findColByKeywords(row,['카드번호']);
    // 카드사 컬럼이 공백(' ')이거나 -1인데 카드번호 옆에 의미있는 값이 있으면 카드사=카드번호-1
    if(cardCoCol<0 && cardNoCol>0){
      // 카드번호 바로 왼쪽 셀에 뭔가 있으면 카드사로 사용
      const leftCell=String(row[cardNoCol-1]||'').trim();
      if(leftCell&&leftCell!=='NO'&&!leftCell.includes('사용')&&!leftCell.includes('금액')){
        cardCoCol=cardNoCol-1;
      }
    }

    if(dateCol<0||amtCol<0) continue;

    let sectionLabel='cc';
    for(let look=ri-1;look>=Math.max(0,ri-5);look--){
      const cellText=String(aoa[look]?.[0]||aoa[look]?.[1]||'').replace(/\s/g,'');
      if(cellText.includes('교통비'))  { sectionLabel='ct'; break; }
      if(cellText.includes('개인카드')){ sectionLabel='cc'; break; }
      if(cellText.includes('법인카드')){ sectionLabel='cc'; break; }
    }

    let seqCounter=0;
    for(let dr=ri+1; dr<aoa.length; dr++){
      const dataRow=aoa[dr];
      const noVal=noCol>=0?dataRow[noCol]:null;
      const noStr=String(noVal||'').trim();
      // '합계', '교통비', '총 지출' 등이 나오면 이 섹션 종료
      if(noStr&&isNaN(Number(noStr))) break;
      // NO가 숫자가 아니거나 없으면 스킵 (빈 번호 행)
      if(!noStr||isNaN(Number(noStr))) continue;

      const useDate=parseCellDate(dataRow[dateCol]);
      let _amtRaw=dataRow[amtCol];
      // SheetJS: 수식 결과가 숫자로 오거나, 수식 문자열(=...)로 올 수 있음
      let amount=0;
      if(typeof _amtRaw==='number') amount=_amtRaw;
      else if(_amtRaw){
        const _amtStr=String(_amtRaw).trim();
        if(_amtStr.startsWith('=')){
          // 수식: 간단한 덧셈/뺄셈만 계산 (예: =28636+2864)
          try{ amount=Function('"use strict";return ('+_amtStr.slice(1)+')')(); }catch(e){ amount=0; }
        } else {
          amount=Number(_amtStr.replace(/[^0-9.-]/g,''))||0;
        }
      }
      // 날짜도 금액도 없으면 빈 행 → 스킵 (break 아님, 다음 번호 행이 있을 수 있음)
      if(!useDate&&!amount) continue;

      seqCounter++;
      const item={
        seq:seqCounter,
        useDate,
        detail:   detailCol>=0?String(dataRow[detailCol]||'').trim():'',
        cardCompany: cardCoCol>=0?String(dataRow[cardCoCol]||'').trim():'',
        cardNumber:  cardNoCol>=0?String(dataRow[cardNoCol]||'').trim():'',
        place:    placeCol>=0?String(dataRow[placeCol]||'').trim():'',
        amount,
        receiptType: rcptCol>=0?String(dataRow[rcptCol]||'영수증').trim():'영수증',
        branch:   sectionLabel==='cc'?(branchCol>=0?String(dataRow[branchCol]||'본사').trim():'본사'):'',
        _uid:Math.random().toString(36).slice(2), id:null, headerId:KEY, category:sectionLabel==='ct'?'교통비':'개인카드', hasAttachment:false
      };
      if(sectionLabel==='ct') ctParsed.push(item);
      else ccParsed.push(item);
    }
  }
  return {ccParsed, ctParsed, bankInfo};
}

async function _loadXLSX(input){
  const file=input.files[0]; if(!file)return null;
  if(!window.XLSX){await new Promise(res=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;document.head.appendChild(sc);});}
  const buf=await file.arrayBuffer();
  const wb=window.XLSX.read(buf,{type:'array',cellDates:true});
  // 마지막 시트 우선, 단 빈 시트(1행 이하)는 건너뜀
  // 1순위: 'NO'+'사용일자' 헤더가 있는 시트 (마지막부터 검색)
  // 2순위: 내용이 있는 마지막 시트
  let activeSheet=null;
  for(let i=wb.SheetNames.length-1;i>=0;i--){
    const ws2=wb.Sheets[wb.SheetNames[i]];
    const aoa2=window.XLSX.utils.sheet_to_json(ws2,{header:1,defval:''});
    const hasCardHeader=aoa2.some(row=>{
      const r0=String(row[0]||'').trim(), r1=String(row[1]||'').trim();
      return (r0==='NO'||r1==='NO')&&row.some(c=>String(c||'').includes('사용일'));
    });
    if(hasCardHeader){activeSheet=ws2;break;}
  }
  // 2순위: 비어있지 않은 마지막 시트
  if(!activeSheet){
    for(let i=wb.SheetNames.length-1;i>=0;i--){
      const ws2=wb.Sheets[wb.SheetNames[i]];
      const aoa2=window.XLSX.utils.sheet_to_json(ws2,{header:1,defval:''});
      if(aoa2.filter(r=>r.some(c=>String(c||'').trim())).length>2){activeSheet=ws2;break;}
    }
  }
  if(!activeSheet) activeSheet=wb.Sheets[wb.SheetNames[wb.SheetNames.length-1]];
  return window.XLSX.utils.sheet_to_json(activeSheet,{header:1,defval:''});
}

async function _dupCheckAndPush(ccParsed,ctParsed){
  const KEY=window._cardHeaderId||'_NEW_';
  const existing=(db.cardRows||[]).filter(r=>String(r.headerId)===String(KEY));
  const dupList=[...ccParsed,...ctParsed].filter(nr=>existing.find(er=>er.useDate===nr.useDate&&Number(er.amount)===Number(nr.amount)&&er.category===nr.category)).map(nr=>`${nr.useDate} / ${Number(nr.amount).toLocaleString()}원 (${nr.category})`);
  if(dupList.length&&!confirm(`중복 항목:\n${dupList.join('\n')}\n\n그래도 추가하시겠습니까?`))return false;
  db.cardRows=db.cardRows||[];
  db.cardRows.push(...ccParsed,...ctParsed);
  return true;
}

async function importCardExcel(input) {
  const aoa=await _loadXLSX(input); if(!aoa)return;
  input.value=''; // 같은 파일 재선택 가능하게
  let ccParsed=[],ctParsed=[],bankInfo={};
  try {
    ({ccParsed,ctParsed,bankInfo}=parseCardExcelSheet(aoa));
  } catch(e2) {
    console.error('파싱 오류:', e2);
    showToast('⚠️ 파싱 중 오류가 발생했습니다: '+e2.message);
    return;
  }
  if(!ccParsed.length&&!ctParsed.length){showToast('⚠️ 파싱된 내역이 없습니다. 양식을 확인해 주세요.');return;}

  // ── 파싱 결과 확인 팝업 ──
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  function previewRows(rows) {
    if(!rows.length) return '<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:8px">없음</td></tr>';
    return rows.map(r=>'<tr style="border-bottom:1px solid var(--border)">'
      +'<td style="padding:5px 8px;font-size:13px">'+esc(r.useDate)+'</td>'
      +'<td style="padding:5px 8px;font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.detail)+'</td>'
      +'<td style="padding:5px 8px;font-size:13px">'+esc(r.cardCompany)+'</td>'
      +'<td style="padding:5px 8px;font-size:13px;text-align:right">'+Number(r.amount||0).toLocaleString()+'원</td>'
      +'<td style="padding:5px 8px;font-size:13px">'+esc(r.receiptType)+'</td>'
      +'</tr>').join('');
  }
  const tHead = '<thead><tr style="background:var(--primary);color:#fff">'
    +'<th style="padding:6px 8px;font-size:12px;text-align:left">사용일자</th>'
    +'<th style="padding:6px 8px;font-size:12px;text-align:left">사용내역</th>'
    +'<th style="padding:6px 8px;font-size:12px;text-align:left">카드사</th>'
    +'<th style="padding:6px 8px;font-size:12px;text-align:right">금액</th>'
    +'<th style="padding:6px 8px;font-size:12px;text-align:left">증빙</th>'

let _cardDirtyRows = {};
function markRowDirty(type, idx) { _cardDirtyRows[`${type}-${idx}`]=true; }

// 카드 날짜 3분리 → hidden 값 동기화 (YYYY-MM-DD)
function syncCardDate(el, type, idx) {
  const row = el.closest('tr');
  if (!row) return;
  const y = row.querySelector('.card-date-y')?.value?.padStart(4,'0')||'';
  const m = row.querySelector('.card-date-m')?.value?.padStart(2,'0')||'';
  const d = row.querySelector('.card-date-d')?.value?.padStart(2,'0')||'';
  const hid = row.querySelector('.card-date-val');
  if (hid) hid.value = (y&&m&&d) ? `${y}-${m}-${d}` : '';
  markRowDirty(type, idx);
}

function addCardRow(type) {
  if (!window._cardEmpId) return;  // 로그인 체크
  const isCc = type==='cc';
  const category = isCc?'개인카드':'교통비';
  const KEY = window._cardHeaderId; // renderCard()에서 항상 설정됨 (실제 headerId 또는 TEMP_KEY)
  if (!KEY) return;
  const existing = (db.cardRows||[]).filter(r=>(String(r.headerId)===String(KEY)));
  const seqList = existing.filter(r=>r.category===category).map(r=>r.seq);
  const newSeq = seqList.length ? Math.max(...seqList)+1 : 1;
  const newRow = { _uid:Math.random().toString(36).slice(2), id:null, headerId:KEY, category, seq:newSeq, useDate:'', detail:'', cardCompany:'', cardNumber:'', place:'', amount:0, receiptType:'영수증', branch:isCc?'본사':'', hasAttachment:false };
  db.cardRows = db.cardRows||[];
  db.cardRows.push(newRow);
  renderCard();
}

function deleteCardRowByUid(uid) {
  if(!uid){ console.warn('deleteCardRowByUid: uid 없음'); return; }
  const target = (db.cardRows||[]).find(r=>r._uid===uid);
  if(!target){ console.warn('deleteCardRowByUid: 행 없음', uid); return; }
  const doRemove = () => {
    db.cardRows = (db.cardRows||[]).filter(r=>r._uid!==uid);
    renderCard();
  };
  if(target.id){
    sbDelete('card_expense_rows',target.id).then(ok=>{ if(ok) doRemove(); else showToast('⚠️ 삭제 실패'); });
  } else {
    doRemove();
  }
}

function deleteCardRow(type, idx) {
  const category = type==='cc'?'개인카드':'교통비';
  const KEY = window._cardHeaderId;
  const rows = (db.cardRows||[]).filter(r=>String(r.headerId)===String(KEY)&&r.category===category).sort((a,b)=>a.seq-b.seq);
  const target = rows[idx];
  if (!target) { console.warn('deleteCardRow: 대상 행 없음', type, idx, rows.length); return; }
  if (target.id) {
    // DB에 저장된 행: DB 삭제 후 로컬에서도 제거
    sbDelete('card_expense_rows', target.id).then(ok=>{
      if(ok){ db.cardRows=(db.cardRows||[]).filter(r=>r!==target); renderCard(); }
      else showToast('⚠️ 삭제 실패');
    });
  } else {
    // 미저장 행(임시/업로드): 로컬에서만 제거
    db.cardRows=(db.cardRows||[]).filter(r=>r!==target);
    renderCard();
  }
}

// ── 증빙 업로드 ──
async function uploadCardReceipt(input, type, idx) {
  const file = input.files[0]; if (!file) return;
  if (file.size > 10*1024*1024) { showToast('⚠️ 10MB 이하 파일만 가능합니다'); return; }
  showToast('⏳ 업로드 중...');
  const headerId = window._cardHeaderId;
  if (!headerId) { showToast('⚠️ 먼저 임시저장해 주세요'); return; }
  const path = `${headerId}/${type}_${idx}_${Date.now()}_${file.name}`;
  const { error } = await _supa.storage.from('attachments').upload(path, file, {upsert:true});
  if (error) { showToast('⚠️ 업로드 실패: '+error.message); return; }
  const { data: urlData } = _supa.storage.from('attachments').getPublicUrl(path);
  const category = type==='cc'?'개인카드':'교통비';
  const rows = (db.cardRows||[]).filter(r=>String(r.headerId)===String(headerId)&&r.category===category).sort((a,b)=>a.seq-b.seq);
  const rowSeq = rows[idx]?.seq||idx+1;
  await sbInsert('card_expense_attachments',{header_id:headerId,row_seq:rowSeq,file_name:file.name,file_url:urlData?.publicUrl||path});
  if (rows[idx]) rows[idx].hasAttachment=true;
  showToast('✅ 증빙 업로드 완료');
  renderCard();
}

// ── 행 데이터 수집 ──
function collectCardRows(type) {
  const category = type==='cc'?'개인카드':'교통비';
  const isCc = type==='cc';
  const rows = document.querySelectorAll(`#${type}-table-wrap tr[id^="row-${type}-"]`);
  const result = [];
  rows.forEach((tr,i)=>{
    // 클래스 셀렉터로 직접 접근 (날짜 input 3개+hidden 때문에 인덱스 오염 방지)
    const hid=tr.querySelector('.card-date-val');
    const y=tr.querySelector('.card-date-y')?.value||'';
    const m=(tr.querySelector('.card-date-m')?.value||'').padStart(2,'0');
    const d=(tr.querySelector('.card-date-d')?.value||'').padStart(2,'0');
    const useDate=(hid?.value)||(y&&m&&d?`${y}-${m}-${d}`:'');
    result.push({
      category, seq:i+1,
      useDate,
      detail:      tr.querySelector('.cd-detail')?.value||'',
      cardCompany: tr.querySelector('.cd-cardco')?.value||'',
      cardNumber:  tr.querySelector('.cd-cardno')?.value||'',
      place:       tr.querySelector('.cd-place')?.value||'',
      amount:      parseInt(tr.querySelector('.cd-amount')?.value)||0,
      receiptType: tr.querySelector('.cd-rcpt')?.value||'영수증',
      branch:      isCc?(tr.querySelector('.cd-branch')?.value||'본사'):'',
      id: tr.dataset.id||null
    });
  });
  return result;
}

// ── 카드 데이터 재로드 (저장 후 호출) ──
async function reloadCardData() {
  if (!_supa) return;
  try {
    const meId = currentEmp ? currentEmp.id : null;
    let chQ = _supa.from('card_expense_headers').select('*').order('year',{ascending:false}).order('month',{ascending:false});
    if (!isAdmin && meId) chQ = chQ.eq('emp_id', meId);
    const { data: chData, error: chErr } = await chQ;
    if (chErr) { console.error('카드 헤더 재로드 실패:', chErr); return; }
    const headerIds = (chData||[]).map(r=>r.id);
    db.cardHeaders = (chData||[]).map(r=>({id:r.id,empId:r.emp_id,year:r.year,month:r.month,bankName:r.bank_name||'',accountNumber:r.account_number||'',accountHolder:r.account_holder||'',status:r.status||'작성중',submittedAt:r.submitted_at||null,rejectReason:r.reject_reason||''}));
    if (headerIds.length) {
      const {data:crData,error:crErr} = await _supa.from('card_expense_rows').select('*').in('header_id',headerIds).order('seq');
      if (crErr) { console.error('카드 행 재로드 실패:', crErr); return; }
      db.cardRows = (crData||[]).map(r=>({_uid:Math.random().toString(36).slice(2),id:r.id,headerId:r.header_id,category:r.category,seq:r.seq,useDate:r.use_date||'',detail:r.detail||'',cardCompany:r.card_company||'',cardNumber:r.card_number||'',place:r.place||'',amount:Number(r.amount)||0,receiptType:r.receipt_type||'영수증',branch:r.branch||'',hasAttachment:false}));
    } else {
      db.cardRows = [];
    }
    // 저장된 headerId로 window._cardHeaderId 동기화
    const currentHeader = (db.cardHeaders||[]).find(h=>String(h.empId)===String(window._cardEmpId)&&h.year===window._cardYr&&h.month===window._cardMo);
    if (currentHeader) window._cardHeaderId = currentHeader.id;
  } catch(e) { console.error('reloadCardData 오류:', e); }
}

// ── 헤더 저장/업데이트 ──
async function ensureCardHeader(status) {
  const yr=window._cardYr, mo=window._cardMo, empId=window._cardEmpId;
  const bankName=document.getElementById('card-bank')?.value||'';
  const accountNumber=document.getElementById('card-account')?.value||'';
  const accountHolder=document.getElementById('card-holder')?.value||'';
  const row={emp_id:empId,year:yr,month:mo,bank_name:bankName,account_number:accountNumber,account_holder:accountHolder,status,updated_at:new Date().toISOString()};
  if (status==='제출') row.submitted_at=new Date().toISOString();
  let headerId=window._cardHeaderId;
  // TEMP_KEY(_NEW_로 시작)는 실제 DB ID가 아니므로 INSERT 필요
  const isTempKey = !headerId || String(headerId).startsWith('_NEW_');
  if (isTempKey) {
    // 혹시 DB에 이미 같은 emp_id/year/month 헤더가 있으면 재사용
    const existing = (db.cardHeaders||[]).find(h=>String(h.empId)===String(empId)&&h.year===yr&&h.month===mo);
    if (existing) {
      headerId = existing.id;
      await sbUpdate('card_expense_headers',headerId,row);
      const h=db.cardHeaders.find(h=>h.id===headerId);
      if(h){h.bankName=bankName;h.accountNumber=accountNumber;h.accountHolder=accountHolder;h.status=status;}
      window._cardHeaderId=headerId;
    } else {
      const ins=await sbInsert('card_expense_headers',row);
      if (!ins) return null;
      headerId=ins.id;
      db.cardHeaders=db.cardHeaders||[];
      db.cardHeaders.push({id:headerId,empId,year:yr,month:mo,bankName,accountNumber,accountHolder,status,submittedAt:row.submitted_at||null});
      window._cardHeaderId=headerId;
    }
  } else {
    await sbUpdate('card_expense_headers',headerId,row);
    const h=db.cardHeaders.find(h=>h.id===headerId);
    if(h){h.bankName=bankName;h.accountNumber=accountNumber;h.accountHolder=accountHolder;h.status=status;}
  }
  return headerId;
}

// ── 행 일괄 저장 ──
async function saveCardRowsToDb(headerId, ccRows, ctRows) {
  // TEMP_KEY 또는 유효하지 않은 headerId면 저장 중단
  if (!headerId || String(headerId).startsWith('_NEW_') || String(headerId).startsWith('_')) {
    console.error('saveCardRowsToDb 차단: 유효하지 않은 headerId', headerId);
    return;
  }
  // TEMP_KEY(_NEW_로 시작) 임시키를 실제 headerId로 교체
  (db.cardRows||[]).forEach(r=>{ if(String(r.headerId).startsWith('_NEW_')) r.headerId=headerId; });
  const allNew=[...ccRows,...ctRows].filter(r=>!r.id);
  const allEdit=[...ccRows,...ctRows].filter(r=>r.id);
  for(const r of allNew){
    const ins=await sbInsert('card_expense_rows',{header_id:headerId,category:r.category,seq:r.seq,use_date:r.useDate||null,detail:r.detail,card_company:r.cardCompany,card_number:r.cardNumber,place:r.place,amount:r.amount,receipt_type:r.receiptType,branch:r.branch});
    if(ins){ r.id=ins.id; r.headerId=headerId; }
  }
  for(const r of allEdit){
    await sbUpdate('card_expense_rows',r.id,{seq:r.seq,use_date:r.useDate||null,detail:r.detail,card_company:r.cardCompany,card_number:r.cardNumber,place:r.place,amount:r.amount,receipt_type:r.receiptType,branch:r.branch});
  }
  db.cardRows=(db.cardRows||[]).filter(r=>String(r.headerId)!==String(headerId));
  db.cardRows.push(...[...ccRows,...ctRows].map(r=>({...r,headerId,_uid:r._uid||Math.random().toString(36).slice(2)})));

  // ── useDate 기준으로 헤더의 month 자동 보정 ──
  // rows의 useDate 중 최빈 월을 귀속월로 사용 (탭 선택 월과 다를 경우 보정)
  const allRows=[...ccRows,...ctRows].filter(r=>r.useDate);
  if(allRows.length>0){
    const moCounts={};
    allRows.forEach(r=>{
      const m=parseInt(String(r.useDate).slice(5,7));
      if(m>=1&&m<=12) moCounts[m]=(moCounts[m]||0)+1;
    });
    const dominantMo=Object.entries(moCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const dominantYr=parseInt(String(allRows[0].useDate).slice(0,4));
    if(dominantMo&&_supa){
      const correctMo=parseInt(dominantMo);
      const h=db.cardHeaders.find(h=>h.id===headerId);
      // 헤더의 month가 실제 데이터 월과 다르면 보정
      if(h && (h.month!==correctMo || h.year!==dominantYr)){
        await sbUpdate('card_expense_headers',headerId,{year:dominantYr,month:correctMo});
        h.month=correctMo; h.year=dominantYr;
        // window._cardMo도 보정
        window._cardMo=correctMo; window._cardYr=dominantYr;
        console.log(`카드 헤더 귀속월 보정: ${h.year}년 ${correctMo}월`);
      }
    }
  }
}

async function submitCard() {
  const ds=cardDeadlineStatus(window._cardYr,window._cardMo);
  if(!isAdmin && ds==='closed'){showToast('⛔ 제출 기한이 마감됐습니다');return;}
  const ccRows=collectCardRows('cc'), ctRows=collectCardRows('ct');
  if(ccRows.length===0 && ctRows.length===0){showToast('⚠️ 저장된 내역이 없습니다');return;}
  showToast('⏳ 저장 중...');
  const headerId=await ensureCardHeader('제출');
  if(!headerId){showToast('⚠️ 저장 실패');return;}
  await saveCardRowsToDb(headerId,ccRows,ctRows);
  await reloadCardData();
  showToast('✅ 저장 완료 — 엑셀 생성 중...');
  // 저장 완료 후 엑셀 생성 + 메일 발송
  try {
    const result = await downloadCardExcel(headerId);
    if (result && result.wbBin) {

      showToast('📨 담당자에게 메일 발송 완료');
    }
  } catch(exErr){ console.warn('엑셀/메일 실패:', exErr); }
  renderCard();
}

// ── 관리자 화면 ──
function renderCardAdmin(yr, mo) {
  const months=Array.from({length:12},(_,i)=>i+1);
  const monthTabs='<button onclick="currentMonth=0;renderCardAdmin(currentYear,0)" style="padding:5px 10px;border:1px solid var(--border2);border-radius:6px;background:'+(mo===0?'var(--accent)':'transparent')+';color:'+(mo===0?'#fff':'var(--text2)')+';cursor:pointer;font-size:13px;font-weight:600">전체</button> '+

const CARD_FIXED_ORDER = ['이두원','강상석','김영은','정기헌','김호문','초승열','허은경','문석상','김용해','이정호','정숙희','조완호','공정찬','장세현','김미영','초종복','박희용','신병택','조수인','류성윤','정영희','이선영','유소영','김국용','이명걸','김광태','윤보성','최창주','강지현','유용숙','유도선','박석수','최연호','류영균','편경호','오현묵','고영남','양구열','장해라','함헌평'];

function getSortedEmps(yr) {
  const allForCard=(db.employees||[]).filter(e=>!e.isExternal||CARD_FIXED_ORDER.includes(e.name));
  return [
    ...CARD_FIXED_ORDER.map(n=>allForCard.find(e=>e.name===n)).filter(Boolean),
    ...allForCard.filter(e=>!CARD_FIXED_ORDER.includes(e.name)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'))
  ];
}

async function downloadCardSummaryExcel(yr, mo) {
  if(!window.XLSX){
    await new Promise(res=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;document.head.appendChild(sc);});
  }
  const XL=window.XLSX;
  const wb=XL.utils.book_new();
  const emps=getSortedEmps(yr);
  const months=mo===0?Array.from({length:12},(_,i)=>i+1):[mo];

  for(const m of months){
    const headers=(db.cardHeaders||[]).filter(h=>h.year===yr&&h.month===m);
    if(!headers.length && mo!==0) continue;
    const label=`${String(yr).slice(2)}${String(m).padStart(2,'0')}귀속분`;
    const aoa=[];
    aoa.push([null,`개인카드비용_${yr}년도 ${m}월 귀속분`]);
    aoa.push([]);
    aoa.push([null,'코드','직원명',`${yr}년 ${m}월 총 사용금액`,'은행명','계좌번호','예금주']);
    let totalSum=0;
    emps.forEach((e,i)=>{
      const h=headers.find(h=>String(h.empId)===String(e.id));
      const ccAmt=h?getCardRows(h.id,'개인카드',yr,m).reduce((s,r)=>s+(Number(r.amount)||0),0):0;
      const ctAmt=h?getCardRows(h.id,'교통비',yr,m).reduce((s,r)=>s+(Number(r.amount)||0),0):0;
      const total=ccAmt+ctAmt;
      totalSum+=total;
      const bankInfo=h||getLastBankInfo(e.id);
      aoa.push([null,i+1,e.name,total||null,bankInfo.bankName||null,bankInfo.accountNumber||null,bankInfo.accountHolder||null]);
    });
    aoa.push([null,null,'합계',totalSum]);
    const ws=XL.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:4},{wch:6},{wch:10},{wch:20},{wch:14},{wch:22},{wch:10}];
    aoa.forEach((_,ri)=>{
      const cell=ws[XL.utils.encode_cell({r:ri,c:3})];
      if(cell&&typeof cell.v==='number') cell.z='#,##0';
    });
    XL.utils.book_append_sheet(wb,ws,label.slice(0,31));
  }

  if(mo===0){
    const aoa2=[];
    aoa2.push([null,`개인카드비용_${yr}년도 연간 합계`]);
    aoa2.push([]);
    aoa2.push([null,'코드','직원명',...Array.from({length:12},(_,i)=>`${i+1}월`),'연간합계','은행명','계좌번호','예금주']);
    let grandTotal=0;
    emps.forEach((e,i)=>{
      const monthAmts=Array.from({length:12},(_,mi)=>{
        const m2=mi+1;
        const h=(db.cardHeaders||[]).find(h=>h.year===yr&&h.month===m2&&String(h.empId)===String(e.id));
        return h?(getCardRows(h.id,'개인카드').reduce((s,r)=>s+(Number(r.amount)||0),0)+getCardRows(h.id,'교통비').reduce((s,r)=>s+(Number(r.amount)||0),0)):null;
      });
      const empTotal=monthAmts.reduce((s,v)=>s+(v||0),0);
      grandTotal+=empTotal;
      const lastH=(db.cardHeaders||[]).filter(h=>h.year===yr&&String(h.empId)===String(e.id)).sort((a,b)=>b.month-a.month)[0];
      aoa2.push([null,i+1,e.name,...monthAmts,empTotal||null,lastH?.bankName||null,lastH?.accountNumber||null,lastH?.accountHolder||null]);
    });
    const footAmts=Array.from({length:12},(_,mi)=>{
      const m2=mi+1;
      return emps.reduce((s,e)=>{
        const h=(db.cardHeaders||[]).find(h=>h.year===yr&&h.month===m2&&String(h.empId)===String(e.id));
        return s+(h?(getCardRows(h.id,'개인카드').reduce((ss,r)=>ss+(Number(r.amount)||0),0)+getCardRows(h.id,'교통비').reduce((ss,r)=>ss+(Number(r.amount)||0),0)):0);
      },0)||null;
    });
    aoa2.push([null,null,'합계',...footAmts,grandTotal]);
    const ws2=XL.utils.aoa_to_sheet(aoa2);
    aoa2.forEach((_,ri)=>{
      for(let ci=3;ci<=16;ci++){
        const cell=ws2[XL.utils.encode_cell({r:ri,c:ci})];
        if(cell&&typeof cell.v==='number') cell.z='#,##0';
      }
    });
    XL.utils.book_append_sheet(wb,ws2,'연간합계');
  }

  const wbBin=XL.write(wb,{bookType:'xlsx',type:'array'});
  const blob=new Blob([wbBin],{type:'application/octet-stream'});
  const fileName=mo===0?`개인카드비용_${yr}년_전체통계.xlsx`:`개인카드비용_${yr}년${mo}월.xlsx`;
  const url=URL.createObjectURL(blob);
  const a2=document.createElement('a'); a2.href=url; a2.download=fileName; a2.click(); URL.revokeObjectURL(url);
  showToast('📥 엑셀 추출 완료');
  return {wbBin, fileName};
}

async function sendCardSummaryMail(yr, mo) {
  const recvMails=_getCardRecvMails();
  if(!recvMails.length){showToast('⚠️ 수신 메일 주소를 먼저 설정해 주세요');return;}
  showToast('⏳ 엑셀 생성 및 업로드 중...');
  const result=await downloadCardSummaryExcel(yr,mo);
  if(!result)return;
  const {wbBin,fileName}=result;
  try{
    let fileUrl='';
    if(_supa&&wbBin){
      const blob=new Blob([wbBin],{type:'application/octet-stream'});
      const path=`card_exports/${fileName}`;
      const {error:upErr}=await _supa.storage.from('attachments').upload(path,blob,{upsert:true});
      if(!upErr){
        const {data:{publicUrl}}=_supa.storage.from('attachments').getPublicUrl(path);
        fileUrl=publicUrl||'';
      }
    }
    const {data:{session}}=await _supa.auth.getSession();
    const moLabel=mo===0?'전체통계':`${mo}월현황`;
    const payload={
      to:recvMails,
      subject:`[JM반도체] ${yr}년 ${moLabel} 개인카드비용 현황`,
      html:`<div style="font-family:sans-serif;max-width:480px;margin:0 auto;padding:24px">
        <div style="background:#1e40af;padding:16px 20px;border-radius:8px 8px 0 0">
          <span style="color:#fff;font-size:18px;font-weight:700">JM반도체 개인카드 현황</span>
        </div>
        <div style="border:1px solid #e2e8f0;border-top:none;border-radius:0 0 8px 8px;padding:20px">
          <p>${yr}년 ${moLabel} 개인카드비용 현황입니다.</p>
          ${fileUrl?`<p><a href="${fileUrl}" style="background:#1e40af;color:#fff;padding:10px 24px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:8px">📥 엑셀 다운로드 (${fileName})</a></p>`:'<p>근태관리 시스템에서 확인하세요.</p>'}
        </div>
      </div>`,
      text:`${yr}년 ${moLabel} 개인카드비용 현황입니다.${fileUrl?'\n다운로드: '+fileUrl:''}`
    };
    await fetch(`${SUPA_URL}/functions/v1/notify-admin`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SUPA_KEY}`},
      body:JSON.stringify(payload)
    });
    showToast(`📨 ${recvMails.length}명에게 메일 발송 완료`);
  }catch(err){console.error(err);showToast('⚠️ 메일 발송 실패: '+err.message);}
}


async function saveCardMailSettingAdmin() {
  const raw=document.getElementById('card-recv-mail-admin')?.value||'';
  // 줄바꿈 + 쉼표 모두 구분자로 처리
  const emails=raw.split(',').map(e=>e.trim()).filter(e=>e&&e.includes('@'));
  if(!emails.length){showToast('⚠️ 유효한 메일 주소를 입력하세요');return;}
  if(_supa){
    const {error}=await _supa.from('app_settings').upsert({key:'card_submit_email',value:JSON.stringify(emails),updated_at:new Date().toISOString()},{onConflict:'key'});
    if(error){showToast('⚠️ 저장 실패: '+error.message);return;}
  }
  db.appSettings=db.appSettings||{};
  db.appSettings['card_submit_email']=emails;
  showToast(`✅ ${emails.length}명 수신 메일 저장 완료`);
}

function addCardRowModal(type) {
  const isCc = type==='cc';
  const category = isCc?'개인카드':'교통비';
  const KEY = window._cardHeaderId || '_NEW_';
  const existing = (db.cardRows||[]).filter(r=>String(r.headerId)===String(KEY)&&r.category===category);
  const newSeq = existing.length ? Math.max(...existing.map(r=>r.seq))+1 : 1;
  db.cardRows=db.cardRows||[];
  db.cardRows.push({id:null,headerId:KEY,category,seq:newSeq,useDate:'',detail:'',cardCompany:'',cardNumber:'',place:'',amount:0,receiptType:'영수증',branch:isCc?'본사':'',hasAttachment:false});
  // 모달 내 테이블만 갱신
  const KEY2=window._cardHeaderId||'_NEW_';
  const rows=getCardRows(KEY2,category);
  const wrap=document.getElementById(`modal-${type}-wrap`);
  if(wrap) wrap.innerHTML=renderCardTable(type,rows,true,window._cardHeaderId);
}

function collectModalRows(type) {
  const category=type==='cc'?'개인카드':'교통비';
  const isCc=type==='cc';
  const trs=document.querySelectorAll(`#modal-${type}-wrap tr[id^="row-${type}-"]`);
  const result=[];
  trs.forEach((tr,i)=>{
    const getDate=()=>{
      const hid=tr.querySelector('.card-date-val');
      if(hid&&hid.value) return hid.value;
      const y=tr.querySelector('.card-date-y')?.value||'';
      const m=(tr.querySelector('.card-date-m')?.value||'').padStart(2,'0');
      const d=(tr.querySelector('.card-date-d')?.value||'').padStart(2,'0');
      return (y&&m&&d)?`${y}-${m}-${d}`:'';
    };
    result.push({category,seq:i+1,
      useDate:getDate(),
      detail:      tr.querySelector('.cd-detail')?.value||'',
      cardCompany: tr.querySelector('.cd-cardco')?.value||'',
      cardNumber:  tr.querySelector('.cd-cardno')?.value||'',
      place:       tr.querySelector('.cd-place')?.value||'',
      amount:      parseInt(tr.querySelector('.cd-amount')?.value)||0,
      receiptType: tr.querySelector('.cd-rcpt')?.value||'영수증',
      branch:      isCc?(tr.querySelector('.cd-branch')?.value||'본사'):'',
      id:tr.dataset.id||null});
  });
  return result;
}

async function _saveCardAdminModal(status) {
  const empId=window._cardEmpId;
  const yr=window._cardYr, mo=window._cardMo;
  const bankName=document.getElementById('modal-bank')?.value||'';
  const accountNumber=document.getElementById('modal-account')?.value||'';
  const accountHolder=document.getElementById('modal-holder')?.value||'';
  const row={emp_id:empId,year:yr,month:mo,bank_name:bankName,account_number:accountNumber,account_holder:accountHolder,status,updated_at:new Date().toISOString()};
  if(status==='제출') row.submitted_at=new Date().toISOString();
  let headerId=window._cardHeaderId;
  // TEMP_KEY(_NEW_로 시작)는 실제 DB ID가 아니므로 INSERT 필요
  const isTempKey = !headerId || String(headerId).startsWith('_NEW_');
  if(isTempKey){
    const existing=(db.cardHeaders||[]).find(h=>String(h.empId)===String(empId)&&h.year===yr&&h.month===mo);
    if(existing){
      headerId=existing.id;
      await sbUpdate('card_expense_headers',headerId,row);
      const h=db.cardHeaders.find(h=>h.id===headerId);
      if(h){h.bankName=bankName;h.accountNumber=accountNumber;h.accountHolder=accountHolder;h.status=status;}
      window._cardHeaderId=headerId;
    } else {
      const ins=await sbInsert('card_expense_headers',row);
      if(!ins){showToast('⚠️ 저장 실패');return null;}
      headerId=ins.id;
      db.cardHeaders=db.cardHeaders||[];
      db.cardHeaders.push({id:headerId,empId,year:yr,month:mo,bankName,accountNumber,accountHolder,status});
      window._cardHeaderId=headerId;
    }
  } else {
    await sbUpdate('card_expense_headers',headerId,row);
    const h=db.cardHeaders.find(h=>h.id===headerId);
    if(h){h.bankName=bankName;h.accountNumber=accountNumber;h.accountHolder=accountHolder;h.status=status;}
  }
  const ccRows=collectModalRows('cc'), ctRows=collectModalRows('ct');
  await saveCardRowsToDb(headerId,ccRows,ctRows);
  return headerId;
}

async function saveCardAdminDraft() {
  const hid=await _saveCardAdminModal('작성중');
  if(hid){await reloadCardData();showToast('💾 임시저장 완료');closeModal();renderCardAdmin(currentYear,currentMonth||new Date().getMonth()+1);}
}
async function saveCardAdminSubmit() {
  const hid=await _saveCardAdminModal('제출');
  if(hid){await reloadCardData();showToast('✅ 저장 완료');closeModal();renderCardAdmin(currentYear,currentMonth||new Date().getMonth()+1);}
}
async function deleteCardAdminHeader() {
  const hid=window._cardHeaderId;
  if(!hid||!confirm('이 직원의 해당 월 내역 전체를 삭제할까요?'))return;
  await sbDelete('card_expense_headers',hid);
  db.cardHeaders=(db.cardHeaders||[]).filter(h=>h.id!==hid);
  db.cardRows=(db.cardRows||[]).filter(r=>String(r.headerId)!==String(hid));
  showToast('🗑️ 삭제 완료');closeModal();
  renderCardAdmin(currentYear,currentMonth||new Date().getMonth()+1);
}

async function confirmCard(headerId) {
  if(!confirm('확인 처리하시겠습니까?'))return;
  const ok=await sbUpdate('card_expense_headers',headerId,{status:'확인',confirmed_at:new Date().toISOString()});
  if(!ok){showToast('⚠️ 처리 실패');return;}
  const h=db.cardHeaders.find(h=>h.id===headerId); if(h)h.status='확인';
  showToast('✅ 확인 완료');renderCard();
}

async function rejectCard(headerId) {
  const reason=prompt('반려 사유를 입력하세요:'); if(reason===null)return;
  const ok=await sbUpdate('card_expense_headers',headerId,{status:'반려',reject_reason:reason});
  if(!ok){showToast('⚠️ 처리 실패');return;}
  const h=db.cardHeaders.find(h=>h.id===headerId); if(h){h.status='반려';h.rejectReason=reason;}
  showToast('🔴 반려 처리 완료');renderCard();
}
