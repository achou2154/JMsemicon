// ── ZIP styles.xml 교체 유틸 (서식 적용 xlsx 생성) ──
async function _replaceZipStyles(zipBytes, stylesXml) {
  const enc=new TextEncoder(); const dec=new TextDecoder();
  const newBytes=enc.encode(stylesXml);
  const filename='xl/styles.xml';
  const u8=zipBytes instanceof Uint8Array?zipBytes:new Uint8Array(zipBytes);
  const view=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const entries=[]; let offset=0;
  while(offset<u8.length-4){
    if(view.getUint32(offset,true)!==0x04034b50)break;
    const comp=view.getUint16(offset+8,true);
    const cSize=view.getUint32(offset+18,true);
    const uSize=view.getUint32(offset+22,true);
    const fnLen=view.getUint16(offset+26,true);
    const exLen=view.getUint16(offset+28,true);
    const dOff=offset+30+fnLen+exLen;
    const name=dec.decode(u8.slice(offset+30,offset+30+fnLen));
    entries.push({name,comp,hOff:offset,dOff,cSize,uSize,
      hd:u8.slice(offset,dOff),data:u8.slice(dOff,dOff+cSize)});
    offset=dOff+cSize;
  }
  function crc32(data){
    const t=new Uint32Array(256);
    for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c;}
    let c=0xFFFFFFFF;
    for(let i=0;i<data.length;i++)c=t[(c^data[i])&0xFF]^(c>>>8);
    return(c^0xFFFFFFFF)>>>0;
  }
  let compNew=newBytes;
  try{
    const cs=new CompressionStream('deflate-raw');
    const w=cs.writable.getWriter(); w.write(newBytes); w.close();
    const chunks=[]; const r=cs.readable.getReader();
    while(true){const {done,value}=await r.read();if(done)break;chunks.push(value);}
    const tl=chunks.reduce((s,c)=>s+c.length,0); compNew=new Uint8Array(tl);
    let p=0; chunks.forEach(c=>{compNew.set(c,p);p+=c.length;});
  }catch(e){compNew=newBytes;}
  const crc=crc32(newBytes);
  const fnB=enc.encode(filename);
  const nh=new Uint8Array(30+fnB.length); const nhv=new DataView(nh.buffer);
  nhv.setUint32(0,0x04034b50,true); nhv.setUint16(4,20,true); nhv.setUint16(6,0,true);
  nhv.setUint16(8,8,true); nhv.setUint16(10,0,true); nhv.setUint16(12,0,true);
  nhv.setUint32(14,crc,true); nhv.setUint32(18,compNew.length,true); nhv.setUint32(22,newBytes.length,true);
  nhv.setUint16(26,fnB.length,true); nhv.setUint16(28,0,true); nh.set(fnB,30);
  const parts=[]; let nOff=0; const offMap={};
  entries.forEach(e=>{
    offMap[e.name]=nOff;
    if(e.name===filename){parts.push(nh);parts.push(compNew);nOff+=nh.length+compNew.length;}
    else{parts.push(e.hd);parts.push(e.data);nOff+=e.hd.length+e.data.length;}
  });
  const cdParts=[]; let cdSz=0;
  entries.forEach(e=>{
    const fnB2=enc.encode(e.name); const cd=new Uint8Array(46+fnB2.length);
    const cdv=new DataView(cd.buffer);
    cdv.setUint32(0,0x02014b50,true); cdv.setUint16(4,20,true); cdv.setUint16(6,20,true);
    cdv.setUint16(8,0,true);
    if(e.name===filename){
      cdv.setUint16(10,8,true); cdv.setUint32(14,crc,true);
      cdv.setUint32(18,compNew.length,true); cdv.setUint32(22,newBytes.length,true);
    }else{
      const ohv=new DataView(e.hd.buffer,e.hd.byteOffset,e.hd.byteLength);
      cdv.setUint16(10,e.comp,true); cdv.setUint32(14,ohv.getUint32(14,true),true);
      cdv.setUint32(18,e.cSize,true); cdv.setUint32(22,e.uSize,true);
    }
    cdv.setUint16(26,fnB2.length,true); cdv.setUint32(42,offMap[e.name],true);
    cd.set(fnB2,46); cdParts.push(cd); cdSz+=cd.length;
  });
  const eocd=new Uint8Array(22); const ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cdSz,true); ev.setUint32(16,nOff,true);
  const all=[...parts,...cdParts,eocd];
  const tot=all.reduce((s,p)=>s+p.length,0); const res=new Uint8Array(tot);
  let pos=0; all.forEach(p=>{res.set(p,pos);pos+=p.length;});
  return res;
}

async function downloadCardExcel(headerId) {
  const h=db.cardHeaders.find(h=>h.id===headerId); if(!h)return;
  const e=eid(h.empId); if(!e)return;
  // 내역 로드
  if(!(db.cardRows||[]).find(r=>String(r.headerId)===String(headerId))){
    const {data}=await _supa.from('card_expense_rows').select('*').eq('header_id',headerId).order('seq');
    (data||[]).forEach(r=>{ db.cardRows=db.cardRows||[]; db.cardRows.push({_uid:Math.random().toString(36).slice(2),id:r.id,headerId:r.header_id,category:r.category,seq:r.seq,useDate:r.use_date,detail:r.detail,cardCompany:r.card_company,cardNumber:r.card_number,place:r.place,amount:r.amount,receiptType:r.receipt_type,branch:r.branch}); });
  }
  const ccRows=getCardRows(headerId,'개인카드'), ctRows=getCardRows(headerId,'교통비');
  const ccTotal=ccRows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const ctTotal=ctRows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const yr=h.year, mo=String(h.month).padStart(2,'0');
  const today=new Date(); const todayStr2=`${yr}-${mo}-${String(today.getDate()).padStart(2,'0')}`;

  // ExcelJS 로드 (스타일/테두리 완전 지원)
  if(!window.ExcelJS){
    await new Promise(res=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'; sc.onload=res; document.head.appendChild(sc); });
  }
  const EX=window.ExcelJS;
  const wb=new EX.Workbook();
  const sheetName=`${String(yr).slice(2)}${mo}귀속분_${e.name}`;

  // ── 스타일 상수 ──
  const FONT_BASE={name:'맑은 고딕',size:10};
  const FONT_TITLE={name:'맑은 고딕',size:12,bold:true};
  const ALIGN_C={horizontal:'center',vertical:'middle'};
  const ALIGN_L={horizontal:'left',vertical:'middle'};
  const BD_THIN={style:'thin'};
  const BD_MED={style:'medium'};

  // 테두리 헬퍼: l/r/t/b 각각 'thin'|'medium'|null (undefined 키 제거 — ExcelJS 필수)
  function _bd(l,r,t,b){
    const o={};
    if(l) o.left={style:l};
    if(r) o.right={style:r};
    if(t) o.top={style:t};
    if(b) o.bottom={style:b};
    return o;
  }

  // 셀 스타일 적용 헬퍼
  function _st(cell, {font,align,border,numFmt}={}){
    if(font)   cell.font      = font;
    if(align)  cell.alignment = align;
    if(border && Object.keys(border).length) cell.border = border;
    if(numFmt) cell.numFmt    = numFmt;
  }

  // 헤더행 한 줄 스타일 적용 (A~I)
  function _stHdrRow(ws, rowNum){
    const row=ws.getRow(rowNum);
    [1,2,3,4,5,6,7,8,9].forEach((c,ci)=>{
      const cell=row.getCell(c);
      _st(cell,{font:FONT_BASE, align:ALIGN_C,
        border:_bd(ci===0?'medium':'thin', ci===8?'medium':'thin','medium','medium')});
    });
  }

  // 데이터행 한 줄 스타일 적용 (A~I)
  function _stDataRow(ws, rowNum){
    const row=ws.getRow(rowNum);
    [1,2,3,4,5,6,7,8,9].forEach((c,ci)=>{
      const cell=row.getCell(c);
      _st(cell,{font:FONT_BASE, align:ALIGN_C,
        border:_bd(ci===0?'medium':'thin', ci===8?'medium':'thin',null,'thin')});
    });
  }

  // 합계/총금액행 한 줄 스타일 (A~I)
  function _stSumRow(ws, rowNum){
    const row=ws.getRow(rowNum);
    [1,2,3,4,5,6,7,8,9].forEach((c,ci)=>{
      const cell=row.getCell(c);
      _st(cell,{font:{...FONT_BASE,bold:true}, align:ALIGN_C,
        border:_bd(ci===0?'medium':'thin', ci===8?'medium':'thin','medium','medium')});
      if(c===7) cell.numFmt='#,##0';
    });
  }

  // ── 시트1: 지출결의서 ──
  const ws=wb.addWorksheet(sheetName);
  ws.views=[{showGridLines:false}]; // 그리드선 숨김

  // 컬럼 너비 (A~I)
  [6.8,12.8,28.8,10.8,22.8,18.8,12.8,18.8,14.3].forEach((w,i)=>{ ws.getColumn(i+1).width=w; });

  const CC_DATA_ROWS=5, CT_DATA_ROWS=5;
  const ccR=[...ccRows], ctR=[...ctRows];

  // ── 행 배치 계획 ──
  // R1~R3: 헤더 정보
  // R4: 빈행
  // R5: 귀속년월
  // R6: 빈행
  // R7: 개인카드 컬럼 헤더
  // R8 ~ R8+CC_DATA_ROWS-1: 개인카드 데이터 (5행)
  // R(8+CC_DATA_ROWS): 개인카드 합계
  // R(9+CC_DATA_ROWS): 빈행
  // R(10+CC_DATA_ROWS): 교통비 레이블
  // R(11+CC_DATA_ROWS): 교통비 컬럼 헤더
  // R(12+CC_DATA_ROWS) ~ R(12+CC+CT-1): 교통비 데이터 (5행)
  // R(12+CC+CT): 교통비 합계
  // R(13+CC+CT): 빈행
  // R(14+CC+CT): 총 금액
  // R(15+CC+CT): 빈행
  // R(16+CC+CT): *입금 정보*
  // R(17+CC+CT): 은행명/계좌번호/예금주명 레이블
  // R(18+CC+CT): 실제 값

  const CC_HDR=7, CC_DATA_S=8, CC_SUM=CC_DATA_S+CC_DATA_ROWS;
  const CT_LBL=CC_SUM+2, CT_HDR=CC_SUM+3, CT_DATA_S=CC_SUM+4, CT_SUM=CT_DATA_S+CT_DATA_ROWS;
  const TOTAL_R=CT_SUM+2, BANK_LBL=CT_SUM+4, BANK_HDR=CT_SUM+5, BANK_VAL=CT_SUM+6;

  // R1: 제목 + 소속기관
  { const r=ws.getRow(1); r.height=17.25;
    r.getCell(5).value='개인카드 지출결의서'; _st(r.getCell(5),{font:FONT_TITLE,align:ALIGN_L});
    r.getCell(8).value='소속기관'; _st(r.getCell(8),{font:FONT_BASE,align:ALIGN_C,border:_bd('thin','thin','thin','thin')});
    r.getCell(9).value='㈜제이엠반도체'; _st(r.getCell(9),{font:FONT_BASE,align:ALIGN_C,border:_bd('thin','thin','thin','thin')}); }
  // R2: 작성자
  { const r=ws.getRow(2); r.height=17.25;
    r.getCell(8).value='작성자'; _st(r.getCell(8),{font:FONT_BASE,align:ALIGN_C,border:_bd('thin','thin','thin','thin')});
    r.getCell(9).value=e.name; _st(r.getCell(9),{font:FONT_BASE,align:ALIGN_C,border:_bd('thin','thin','thin','thin')}); }
  // R3: 작성일자
  { const r=ws.getRow(3); r.height=17.25;
    r.getCell(8).value='작성일자'; _st(r.getCell(8),{font:FONT_BASE,align:ALIGN_C,border:_bd('thin','thin','thin','thin')});
    r.getCell(9).value=todayStr2; _st(r.getCell(9),{font:FONT_BASE,align:ALIGN_C,border:_bd('thin','thin','thin','thin')}); }
  // R4: 빈행
  ws.getRow(4).height=17.25;
  // R5: 귀속년월
  { const r=ws.getRow(5); r.height=17.25;
    r.getCell(1).value=`${yr}년 ${h.month}월귀속`; _st(r.getCell(1),{font:FONT_BASE,align:ALIGN_L}); }
  // R6: 빈행
  ws.getRow(6).height=17.25;

  // R7: 개인카드 헤더
  { const r=ws.getRow(CC_HDR); r.height=18;
    const hdrs=['NO','사용일자','사용내역 (자세히 기입필요)','카드사','카드번호','사용처','사용금액','지출증빙(현금영수증/영수증)','개인/본사/양감'];
    hdrs.forEach((v,i)=>{ r.getCell(i+1).value=v; }); _stHdrRow(ws,CC_HDR); }

  // R8~: 개인카드 데이터
  for(let i=0;i<CC_DATA_ROWS;i++){
    const rn=CC_DATA_S+i; const row=ws.getRow(rn); row.height=17.25;
    const d=ccR[i];
    if(d){
      row.getCell(1).value=i+1; row.getCell(2).value=d.useDate||'';
      row.getCell(3).value=d.detail||''; row.getCell(4).value=d.cardCompany||'';
      row.getCell(5).value=d.cardNumber||''; row.getCell(6).value=d.place||'';
      row.getCell(7).value=Number(d.amount)||0; row.getCell(8).value=d.receiptType||'';
      row.getCell(9).value=d.branch||'';
    }
    _stDataRow(ws,rn);
    row.getCell(7).numFmt='#,##0';
  }

  // 개인카드 합계행
  { const r=ws.getRow(CC_SUM); r.height=18;
    r.getCell(1).value='합계'; r.getCell(7).value=ccTotal; _stSumRow(ws,CC_SUM); }

  // 빈행
  ws.getRow(CC_SUM+1).height=17.25;

  // 교통비 레이블
  { const r=ws.getRow(CT_LBL); r.height=17.25;
    r.getCell(1).value='교통비'; _st(r.getCell(1),{font:FONT_BASE,align:ALIGN_L});
    r.getCell(2).value='(차량번호:           )'; _st(r.getCell(2),{font:FONT_BASE,align:ALIGN_L}); }

  // 교통비 헤더
  { const r=ws.getRow(CT_HDR); r.height=18;
    const hdrs=['NO','사용일자','사용내역','카드사','카드번호','사용처','사용금액','지출증빙(현금영수증/영수증)',''];
    hdrs.forEach((v,i)=>{ r.getCell(i+1).value=v; }); _stHdrRow(ws,CT_HDR); }

  // 교통비 데이터
  for(let i=0;i<CT_DATA_ROWS;i++){
    const rn=CT_DATA_S+i; const row=ws.getRow(rn); row.height=17.25;
    const d=ctR[i];
    if(d){
      row.getCell(1).value=i+1; row.getCell(2).value=d.useDate||'';
      row.getCell(3).value=d.detail||''; row.getCell(4).value=d.cardCompany||'';
      row.getCell(5).value=d.cardNumber||''; row.getCell(6).value=d.place||'';
      row.getCell(7).value=Number(d.amount)||0; row.getCell(8).value=d.receiptType||'';
      row.getCell(9).value='';
    }
    _stDataRow(ws,rn);
    row.getCell(7).numFmt='#,##0';
  }

  // 교통비 합계
  { const r=ws.getRow(CT_SUM); r.height=18;
    r.getCell(1).value='합계'; r.getCell(7).value=ctTotal; _stSumRow(ws,CT_SUM); }

  // 빈행
  ws.getRow(CT_SUM+1).height=17.25;

  // 총 금액
  { const r=ws.getRow(TOTAL_R); r.height=18;
    r.getCell(1).value='총 금액'; r.getCell(7).value=ccTotal+ctTotal; _stSumRow(ws,TOTAL_R); }

  // 빈행
  ws.getRow(TOTAL_R+1).height=17.25;

  // *입금 정보*
  { const r=ws.getRow(BANK_LBL); r.height=17.25;
    r.getCell(1).value='*입금 정보*'; _st(r.getCell(1),{font:FONT_BASE,align:ALIGN_L}); }

  // 입금정보 레이블행
  { const r=ws.getRow(BANK_HDR); r.height=17.25;
    r.getCell(1).value='은행명'; r.getCell(3).value='계좌번호'; r.getCell(4).value='예금주명';
    [1,3,4].forEach(c=>_st(r.getCell(c),{font:FONT_BASE,align:ALIGN_L})); }

  // 입금정보 값행
  { const r=ws.getRow(BANK_VAL); r.height=17.25;
    r.getCell(1).value=h.bankName||''; r.getCell(3).value=h.accountNumber||''; r.getCell(4).value=h.accountHolder||'';
    [1,3,4].forEach(c=>_st(r.getCell(c),{font:FONT_BASE,align:ALIGN_L})); }

  // ── 시트2: 증빙 ──
  // 실시간 첨부 로드
  if(!getCardAttachments(headerId).length && _supa){
    try{
      const {data:ad}=await _supa.from('card_expense_attachments').select('*').eq('header_id',headerId);
      (ad||[]).forEach(a=>{ if(!db.cardAttachments.find(x=>x.id===a.id)) db.cardAttachments.push({id:a.id,headerId:a.header_id,rowSeq:a.row_seq,fileName:a.file_name,fileUrl:a.file_url}); });
    }catch(e2){}
  }
  const allAttach=getCardAttachments(headerId);
  const ws2=wb.addWorksheet('증빙');
  ws2.getColumn(1).width=6; ws2.getColumn(2).width=50;
  ws2.getColumn(3).width=6; ws2.getColumn(4).width=50;
  ws2.getColumn(5).width=6; ws2.getColumn(6).width=50;
  // 제목
  { const r=ws2.getRow(1); r.getCell(1).value='지 출 증 빙 자 료';
    _st(r.getCell(1),{font:{name:'맑은 고딕',size:12,bold:true},align:ALIGN_L}); }
  ws2.getRow(2).height=8;
  // 헤더
  { const r=ws2.getRow(3); ['연번','증빙자료','연번','증빙자료','연번','증빙자료'].forEach((v,i)=>{
      r.getCell(i+1).value=v; _st(r.getCell(i+1),{font:FONT_BASE,align:ALIGN_C,border:_bd('thin','thin','thin','thin')}); }); }
  // 데이터 (3열 배치)
  const proofList=allAttach.length?allAttach:[null];
  for(let i=0;i<proofList.length;i+=3){
    const r=ws2.addRow([]);
    for(let j=0;j<3;j++){
      const a=proofList[i+j];
      r.getCell(j*2+1).value=a?(i+j+1):'';
      r.getCell(j*2+2).value=a?(a.fileUrl||a.fileName||'(첨부 없음)'):'';
      _st(r.getCell(j*2+1),{font:FONT_BASE,align:ALIGN_C,border:_bd('thin','thin','thin','thin')});
      _st(r.getCell(j*2+2),{font:FONT_BASE,align:ALIGN_L,border:_bd('thin','thin','thin','thin')});
    }
  }

  // ── 파일 저장 ──
  const fileName=`개인카드사용대장_${e.name}_${yr}${mo}.xlsx`;
  const arrayBuf=await wb.xlsx.writeBuffer();
  const finalBin=new Uint8Array(arrayBuf);
  const blob=new Blob([finalBin],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob); const a2=document.createElement('a'); a2.href=url; a2.download=fileName; a2.click(); URL.revokeObjectURL(url);
  showToast('📥 xlsx 다운로드 완료');
  return {wbBin:finalBin, fileName};
}

// ── 제출 시 Resend 메일 발송 ──
// 수신 메일 파싱 헬퍼
function _getCardRecvMails(){
  const raw=(db.appSettings&&db.appSettings['card_submit_email'])||'';
  if(!raw) return [];
  if(Array.isArray(raw)) return raw.filter(Boolean);
  try{ const p=JSON.parse(raw); return Array.isArray(p)?p.filter(Boolean):[raw]; }
  catch(e){ return String(raw).split(',').map(e=>e.trim()).filter(Boolean); }
}

async function sendCardSubmitMail(headerId, wbBin, fileName, empName) {
  try {
    const recvMails = _getCardRecvMails();
    if(!recvMails.length){ showToast('⚠️ 수신 메일 주소가 설정되지 않았습니다'); return; }
    // 엑셀을 Storage에 업로드 후 링크를 메일 본문에 포함
    let fileUrl='';
    if(_supa && wbBin){
      const blob=new Blob([wbBin],{type:'application/octet-stream'});
      const path=`card_exports/${fileName}`;
      const {error:upErr}=await _supa.storage.from('attachments').upload(path,blob,{upsert:true});
      if(!upErr){
        const {data:{publicUrl}}=_supa.storage.from('attachments').getPublicUrl(path);
        fileUrl=publicUrl||'';
      }
    }
    const {data:{session}}=await _supa.auth.getSession();
    const payload={
      to: recvMails,
      subject:`[JM반도체] ${empName} 개인카드사용내역 제출`,
      html:`<div style="font-family:sans-serif;max-width:480px;margin:0 auto;padding:24px">
        <div style="background:#1e40af;padding:16px 20px;border-radius:8px 8px 0 0">
          <span style="color:#fff;font-size:18px;font-weight:700">JM반도체 개인카드 내역 알림</span>
        </div>
        <div style="border:1px solid #e2e8f0;border-top:none;border-radius:0 0 8px 8px;padding:20px">
          <p><b>${empName}</b>님이 개인카드사용내역을 제출하였습니다.</p>
          ${fileUrl?`<p><a href="${fileUrl}" style="background:#1e40af;color:#fff;padding:10px 24px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:8px">📥 엑셀 다운로드</a></p>`:'<p>근태관리 시스템에서 확인하세요.</p>'}
        </div>
      </div>`,
      text:`${empName}님이 개인카드사용내역을 제출하였습니다.${fileUrl?'\n다운로드: '+fileUrl:''}`
    };
    const res=await fetch(`${SUPA_URL}/functions/v1/notify-admin`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token||SUPA_KEY}`},
      body:JSON.stringify(payload)
    });
    if(!res.ok){
      const errText=await res.text();
      console.error('메일 발송 응답 오류:', res.status, errText);
      showToast('⚠️ 메일 발송 실패 ('+res.status+')');
      return;
    }
    console.log('카드내역 메일 발송 완료:', recvMails);
  } catch(err){ console.error('카드 메일 발송 실패:', err); showToast('⚠️ 메일 발송 실패: '+err.message); }
}


function isSummerVisible(){
  const v = db.appSettings ? db.appSettings['summer_section_visible'] : false;
  return v===true || v==='true' || v===1;
}
async function setSummerVisible(on){
  db.appSettings = db.appSettings || {};
  db.appSettings['summer_section_visible'] = on;
  if(_supa){
    const { error } = await _supa.from('app_settings')
      .upsert({key:'summer_section_visible', value:on, updated_at:new Date().toISOString()}, {onConflict:'key'});
    if(error){ console.error('setSummerVisible error:', error); showToast('⚠️ 설정 저장 실패'); return false; }
  }
  return true;
}
async function toggleSummerVisible(){
  const next = !isSummerVisible();
  const ok = await setSummerVisible(next);
  if(ok) showToast(next ? '✅ 직원에게 공개됨' : '🔒 직원에게 숨김 (관리자만 표시)');
  renderSummer();
  const el=document.getElementById('nav-summer'); if(el) el.style.display=(isAdmin||isSummerVisible())?'':'none';
}
function summerDayCount(start, end){
  if(!start) return 0;
  if(!end || end<start) return 1;
  const a=new Date(start), b=new Date(end);
  return Math.round((b-a)/86400000)+1;
}

async function saveSummerPlan(id){
  const empSel=document.getElementById('f-emp');
  let empId = empSel ? empSel.value : (currentEmp?currentEmp.id:null);
  if(!isAdmin && currentEmp) empId = currentEmp.id; // 직원은 본인 강제
  const s = getDateVal('f-start');
  const e = getDateVal('f-end');
  const hours = parseFloat(document.getElementById('f-hours')?.value);
  const reason = document.getElementById('f-reason')?.value||'';
  if(!empId){ showToast('⚠️ 직원을 선택하세요'); return; }
  if(!s){ showToast('⚠️ 시작일을 입력하세요'); return; }
  const days = (isNaN(hours)||hours<=0) ? summerDayCount(s,e) : Math.round(hours/8*10)/10;
  const row={ emp_id:empId, year:currentYear, start_date:s, end_date:e||s, days, memo:reason };
  if(id){
    const ok=await sbUpdate('summer_plans', id, row);
    if(!ok){ showToast('⚠️ 수정 실패'); return; }
    const idx=(db.summerPlans||[]).findIndex(p=>String(p.id)===String(id));
    if(idx>=0) db.summerPlans[idx]={...db.summerPlans[idx], empId, startDate:s, endDate:e||s, days, memo:reason};
    showToast('✅ 수정됨');
  } else {
    const ins=await sbInsert('summer_plans', row);
    if(!ins){ showToast('⚠️ 등록 실패'); return; }
    db.summerPlans=db.summerPlans||[];
    db.summerPlans.push({id:ins.id, empId, year:currentYear, startDate:s, endDate:e||s, days, memo:reason});

function excelSerialToDate(v){
  // 엑셀 시리얼 넘버 → YYYY-MM-DD
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return d.toISOString().slice(0,10);
  }
  // 문자열 2026/07/07 또는 2026-07-07
  const s = String(v).trim().replace(/\//g,'-');
  const m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  return '';
}
function excelFracToHM(v){
  // 엑셀 시간 소수(0~1) → HH:MM, 없으면 미확인
  if (v===''||v===null||v===undefined) return '미확인';
  if (typeof v === 'number') {
    const totalMin = Math.round(v*24*60);
    const hh=String(Math.floor(totalMin/60)).padStart(2,'0');
    const mm=String(totalMin%60).padStart(2,'0');
    return hh+':'+mm;
  }
  const s=String(v).trim();
  return s || '미확인';
}
function excelFracToHours(v){
  if (typeof v === 'number') return Math.round(v*24*100)/100;
  const n=parseFloat(v); return isNaN(n)?0:n;
}

async function onAttendanceFileSelect(input){
  const file = input.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') {
    showToast('⚠️ Excel 라이브러리 로딩 중...');
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => onAttendanceFileSelect(input);
    document.head.appendChild(s);
    return;
  }
  showToast('📤 파일 분석 중...');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
    // 헤더 스킵 (1행)
    const dataRows = rows.slice(1);

    // 직원명 매칭용 맵 (isExternal 제외)
    const empByName = {};
    db.employees.filter(e=>!e.isExternal&&!e.isInactive).forEach(e=>{ empByName[e.name] = e.id; });

    const records = [];
    let skipped = 0;
    dataRows.forEach(r=>{
      const name = (r[5]||'').toString().trim(); // F열
      const empId = empByName[name];
      if (!empId) { skipped++; return; }
      const dateStr = excelSerialToDate(r[6]); // G열
      if (!dateStr) return;
      const dayType = (r[7]||'').toString().trim() || '평일'; // H열
      const clockIn = excelFracToHM(r[8]); // I열
      const clockOut = excelFracToHM(r[9]); // J열
      const baseHours = excelFracToHours(r[10]); // K열
      const otHours = excelFracToHours(r[11]); // L열
      records.push({empId, date:dateStr, dayType, clockIn, clockOut, baseHours, otHours});
    });

    if (!records.length) { showToast('⚠️ 매칭되는 직원 데이터가 없습니다'); return; }

    // Supabase upsert (emp_id+date 유니크 가정, 없으면 insert)
    let saved=0, failed=0;
    for (const rec of records) {
      const dbRow = {emp_id:rec.empId, date:rec.date, day_type:rec.dayType, clock_in:rec.clockIn, clock_out:rec.clockOut, base_hours:rec.baseHours, ot_hours:rec.otHours};
      try {
        const {error} = await _supa.from('attendance_records').upsert(dbRow, {onConflict:'emp_id,date'});
        if (error) { failed++; } else { saved++; }
      } catch(e){ failed++; }
    }

    // 재로드
    const att = await _supa.from('attendance_records').select('*').order('date',{ascending:false});
    db.attendance = (att.data||[]).map(r=>({id:r.id, empId:r.emp_id, date:r.date, dayType:r.day_type, clockIn:r.clock_in, clockOut:r.clock_out, baseHours:r.base_hours, otHours:r.ot_hours}));

    showToast('✅ 업로드 완료: '+saved+'건 저장'+(skipped>0?' / 미매칭 '+skipped+'건 제외':''));
    input.value='';
    renderOverview();
  } catch(e) {
    console.error('출퇴근 업로드 오류:', e);
    showToast('⚠️ 파일 분석 실패: '+e.message);
  }
}

            <button onclick="setOverviewSort('leavedesc')" id="osort-leavedesc" class="btn btn-sm" style="font-size:12px;${_overviewSort==='leavedesc'?'background:var(--accent);color:#fff;border-color:var(--accent)':''}">잔여연차▼</button>
            <button onclick="setOverviewSort('compdesc')" id="osort-compdesc" class="btn btn-sm" style="font-size:12px;${_overviewSort==='compdesc'?'background:var(--accent);color:#fff;border-color:var(--accent)':''}">잔여대휴▼</button>
          </div>
        </div>
        <input id="overview-search" placeholder="🔍 직원 검색..." oninput="filterOverviewTable(this.value)"
          style="padding:6px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:14px;width:180px">
      </div>
      <div class="table-wrap"><table id="overview-table">
        <thead><tr><th>직원</th><th>부서</th><th>연차 사용</th><th>잔여 연차</th><th>대체휴무 잔여</th><th>출장</th><th>교통비</th>
          <th>출퇴근 내역<br><button class="btn btn-sm" style="font-size:11px;padding:2px 8px;margin-top:3px" onclick="openAttendanceUpload()">📤 업로드</button></th>
          <th>관련 서류</th></tr></thead>
        <tbody>${rows||emptyRow(8)}</tbody>
      </table></div>
      <input id="att-file-input" type="file" accept=".xls,.xlsx" style="display:none" onchange="onAttendanceFileSelect(this)">
    </div>
  `);
}

// 검색창이 있는 페이지 목록
const SEARCH_PAGES = ['roster','requests','leave','ot','trip','transport','bday','health'];

function showTopbarSearch(show) {
  const el = document.getElementById('topbar-emp-search');
  if (!el) return;
  if (show && isAdmin) {
    el.style.display = '';
    el.value = '';
  } else {
    el.style.display = 'none';
    el.value = '';
  }
}

function topbarEmpSearch(q) {
  // 현재 페이지의 메인 테이블에서 검색
  const tables = document.querySelectorAll('.table-wrap table tbody');
  tables.forEach(tbody => {
    tbody.querySelectorAll('tr').forEach(tr => {
      tr.style.display = q ? (tr.textContent.includes(q) ? '' : 'none') : '';
    });
  });
}

function openDayDetail(ds) {
  const evList = [...((window._calEv && window._calEv[ds]) || [])].sort((a,b)=>a.priority!==b.priority?a.priority-b.priority:a.name.localeCompare(b.name,'ko'));
  if (!evList.length) return;

  const date = fmt(ds);
  const groups = {
    leave: { label: '🏖️ 연차', items: [], cls: 'var(--leave)' },
    comp:  { label: '🔄 대체휴무', items: [], cls: 'var(--comp)' },
    trip:  { label: '✈️ 출장/외근', items: [], cls: 'var(--trip)' },
    ot:    { label: '⚡ 특근', items: [], cls: 'var(--ot)' },
    bday:  { label: '🎂 생일/기념일', items: [], cls: 'var(--bday)' },
    health:{ label: '🏥 건강검진', items: [], cls: 'var(--health)' },
    other: { label: '📌 기타', items: [], cls: 'var(--text2)' },
  };

  evList.forEach(e => {
    const key = e.cls === 'ev-leave' ? 'leave'
      : e.cls === 'ev-summer' ? 'leave'
      : e.cls === 'ev-comp' ? 'comp'
      : e.cls === 'ev-trip' ? 'trip'
      : e.cls === 'ev-ot' ? 'ot'
      : e.cls === 'ev-bday' ? 'bday'
      : e.cls === 'ev-health' ? 'health' : 'other';
    // 연차/대휴는 대직자 표시
    let itemLabel = e.label;
    if((key==='leave'||key==='comp')&&e.req&&e.req.substitute){
      itemLabel += `<span style="font-size:12px;color:var(--text3);margin-left:6px">(대직자: ${e.req.substitute})</span>`;
    }
    // 출장/교육은 시간 정보 추가
    if((key==='trip'||key==='ot')&&e.req&&(e.req.type==='trip'||e.req.type==='education')){
      const st=e.req.startTime||'';
      const et=e.req.endTime||'';
      const isFirstDay=e.req.startDate===ds;
      const isLastDay=(e.req.endDate||e.req.startDate)===ds;
      let timeStr='';
      if(st&&isFirstDay&&isLastDay) timeStr=` (${st}~${et})`;
      else if(st&&isFirstDay) timeStr=` (${st}~ )`;
      else if(et&&isLastDay) timeStr=` (~${et})`;
      if(timeStr) itemLabel+=`<span style="font-size:13px;color:var(--text3);margin-left:4px">${timeStr}</span>`;
    }
    groups[key].items.push(itemLabel);
  });

  const groupHtml = Object.values(groups)
    .filter(g => g.items.length > 0)
    .map(g => `
      <div style="margin-bottom:12px">
        <div style="font-size:14px;font-weight:700;color:${g.cls};margin-bottom:6px">${g.label}</div>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${g.items.map(item => `<div style="font-size:16px;padding:4px 10px;background:var(--bg);border-radius:6px">${item}</div>`).join('')}
        </div>
      </div>`).join('');

  openModal(`
    <div class="modal-title">📅 ${date} 일정</div>
    <div style="max-height:400px;overflow-y:auto">${groupHtml}</div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal()">닫기</button>
    </div>
  `);
}

function filterTable(tableId, q) {
  const tbody = document.querySelector('#'+tableId+' tbody');
  if (!tbody) return;
  tbody.querySelectorAll('tr').forEach(tr => {
    tr.style.display = q ? (tr.textContent.includes(q) ? '' : 'none') : '';
  });
}

function openOverviewDetail(type) {
  const yr = currentYear;
  const emps = getSortedByPosition().filter(e=>!isHiddenFromPersonal(e));

  if (type === 'leave') {
    // 연차사용 내림차순 + 연차소멸 내역
    const leaveRows = emps.map(e=>{
      const used = getLeaveUsed(e.id,yr);
      const remain = getLeaveRemain(e.id,yr);
      return {e, used, remain};
    }).filter(x=>x.used>0).sort((a,b)=>b.remain-a.remain)
      .map(({e,used,remain})=>`<tr>
        <td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td>
        <td>${Math.round(used/8*10)/10}일</td>
        <td style="color:var(--leave);font-weight:600">${Math.round(remain/8*10)/10}일</td>
      </tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--text3)">내역 없음</td></tr>';

    const extinctRows = emps.map(e=>{
      const a = getAlloc(e.id,yr);
      return {e, ext: +a.extinct||0};
    }).filter(x=>x.ext>0).sort((a,b)=>b.ext-a.ext)
      .map(({e,ext})=>`<tr>
        <td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td>
        <td style="color:var(--danger);font-weight:600">${Math.round(ext/8*10)/10}일</td>
        <td style="color:var(--danger)">${ext}h</td>
        <td style="color:var(--text3);font-size:12px">${yr}-03-01</td>
      </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text3)">소멸 내역 없음</td></tr>';

    openModal(`
      <div class="modal-title">📋 ${yr}년 연차 사용 / 소멸 내역</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-height:500px">
        <div>
          <div style="font-size:14px;font-weight:700;color:var(--leave);margin-bottom:8px">연차 사용 (잔여연차 내림차순)</div>
          <div style="overflow-y:auto;max-height:440px">
            <table><thead><tr><th>직원</th><th>사용(일)</th><th>잔여</th></tr></thead>
            <tbody>${leaveRows}</tbody></table>
          </div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--text3);margin-bottom:6px">※ 근로기준법 제61조(연차유급휴가의 사용 촉진)에 따라 소멸된 연차 내역</div>
          <div style="font-size:14px;font-weight:700;color:var(--danger);margin-bottom:8px">연차 소멸</div>
          <div style="overflow-y:auto;max-height:400px">
            <table><thead><tr><th>직원</th><th>소멸(일)</th><th>소멸(h)</th><th>기준일</th></tr></thead>
            <tbody>${extinctRows}</tbody></table>
          </div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">닫기</button></div>
    `, true);

  } else if (type === 'ot') {
    const rows = emps.map(e=>{
      const ots = db.requests.filter(r=>r.type==='ot'&&String(r.empId)===String(e.id)&&String(r.year)===String(yr)&&r.status==='approved');
      const total = ots.reduce((s,r)=>s+(+r.hours||0),0);
      return {e, total, ots};
    }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total)
      .map(({e,total,ots})=>`<tr>
        <td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td>
        <td>${e.dept}</td>
        <td>${total}h</td>
        <td style="font-size:12px;color:var(--text3)">${ots.map(r=>r.otType||'특근').join(', ')}</td>
      </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text3)">내역 없음</td></tr>';

    openModal(`
      <div class="modal-title">⚡ ${yr}년 발생특근 내역 (내림차순)</div>
      <div style="max-height:500px;overflow-y:auto">
        <table><thead><tr><th>직원</th><th>부서</th><th>특근(h)</th><th>구분</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">닫기</button></div>
    `, true);

  } else if (type === 'comp') {
    const compData = emps.map(e=>{
      const earned = getCompEarned(e.id,yr);
      const used = getCompUsed(e.id,yr);
      const rem = getCompRemain(e.id,yr);
      return {e, earned, used, rem};
    }).filter(x=>x.earned>0||x.used>0);

    const earnedRows = [...compData].sort((a,b)=>b.earned-a.earned)
      .map(({e,earned})=>`<tr><td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td><td>${earned}h</td></tr>`).join('');
    const usedRows = [...compData].sort((a,b)=>b.used-a.used)
      .map(({e,used})=>`<tr><td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td><td>${used}h</td></tr>`).join('');
    const remRows = [...compData].sort((a,b)=>b.rem-a.rem)
      .map(({e,rem})=>`<tr><td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td><td style="${rem>0?'color:var(--comp);font-weight:600':'color:var(--text3)'}">${rem}h</td></tr>`).join('');

    openModal(`
      <div class="modal-title">🔄 ${yr}년 대체휴무 내역 (내림차순)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-height:500px">
        <div><div style="font-size:13px;font-weight:700;color:var(--comp);margin-bottom:6px">발생 대휴</div>
          <div style="overflow-y:auto;max-height:440px"><table><thead><tr><th>직원</th><th>발생(h)</th></tr></thead><tbody>${earnedRows||'<tr><td colspan="2" style="text-align:center;color:var(--text3)">없음</td></tr>'}</tbody></table></div></div>
        <div><div style="font-size:13px;font-weight:700;color:var(--leave);margin-bottom:6px">사용 대휴</div>
          <div style="overflow-y:auto;max-height:440px"><table><thead><tr><th>직원</th><th>사용(h)</th></tr></thead><tbody>${usedRows||'<tr><td colspan="2" style="text-align:center;color:var(--text3)">없음</td></tr>'}</tbody></table></div></div>
        <div><div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px">잔여 대휴</div>
          <div style="overflow-y:auto;max-height:440px"><table><thead><tr><th>직원</th><th>잔여(h)</th></tr></thead><tbody>${remRows||'<tr><td colspan="2" style="text-align:center;color:var(--text3)">없음</td></tr>'}</tbody></table></div></div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">닫기</button></div>
    `, true);

  } else if (type === 'trip') {
    const mkTripRows = (kind) => emps.map(e=>{
      const trips = db.requests.filter(r=>r.type==='trip'&&String(r.empId)===String(e.id)&&String(r.year)===String(yr)&&r.status==='approved'&&(kind==='edu'?false:r.tripKind===kind));
      const edus = kind==='edu' ? db.requests.filter(r=>r.type==='education'&&String(r.empId)===String(e.id)&&String(r.year)===String(yr)&&r.status==='approved') : [];
      const list = kind==='edu' ? edus : trips;
      return {e, cnt: list.length, list};
    }).filter(x=>x.cnt>0).sort((a,b)=>b.cnt-a.cnt)
      .map(({e,cnt})=>`<tr><td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td><td>${cnt}건</td></tr>`).join('') || '<tr><td colspan="2" style="text-align:center;color:var(--text3)">없음</td></tr>';

    openModal(`
      <div class="modal-title">✈️ ${yr}년 출장/교육 내역 (내림차순)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-height:500px">
        <div><div style="font-size:13px;font-weight:700;margin-bottom:6px">🌏 해외출장</div>
          <div style="overflow-y:auto;max-height:440px"><table><thead><tr><th>직원</th><th>건수</th></tr></thead><tbody>${mkTripRows('overseas')}</tbody></table></div></div>
        <div><div style="font-size:13px;font-weight:700;margin-bottom:6px">🇰🇷 국내출장</div>
          <div style="overflow-y:auto;max-height:440px"><table><thead><tr><th>직원</th><th>건수</th></tr></thead><tbody>${mkTripRows('domestic')}</tbody></table></div></div>
        <div><div style="font-size:13px;font-weight:700;margin-bottom:6px">📚 교육</div>
          <div style="overflow-y:auto;max-height:440px"><table><thead><tr><th>직원</th><th>건수</th></tr></thead><tbody>${mkTripRows('edu')}</tbody></table></div></div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">닫기</button></div>
    `, true);

  } else if (type === 'trans') {
    const rows = emps.map(e=>{
      const total = getTransTotal(e.id,yr);
      return {e, total};
    }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total)
      .map(({e,total})=>`<tr>
        <td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td>
        <td>${e.dept}</td>
        <td>₩${total.toLocaleString()}</td>
      </tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--text3)">내역 없음</td></tr>';

    openModal(`
      <div class="modal-title">🚗 ${yr}년 교통비 내역 (내림차순)</div>
      <div style="max-height:500px;overflow-y:auto">
        <table><thead><tr><th>직원</th><th>부서</th><th>교통비</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">닫기</button></div>
    `, true);
  } else if (type === 'summer') {
    const _todaySummer = todayStr();
    const summerReqs = db.requests.filter(r=>r.type==='leave'&&r.leaveType==='하계휴가'&&String(r.year)===String(yr));
    // 직원별 그룹핑
    const grouped = {};
    summerReqs.forEach(r=>{
      const key = String(r.empId);
      if(!grouped[key]) grouped[key] = { empId:r.empId, items:[], totalHours:0, hasPending:false, hasApproved:false, allPast:true };
      grouped[key].items.push(r);
      grouped[key].totalHours += (+r.hours||0);
      if(r.status==='pending') grouped[key].hasPending = true;
      if(r.status==='approved') grouped[key].hasApproved = true;
      if((r.endDate||r.startDate) >= _todaySummer) grouped[key].allPast = false;
    });

    // 마지막 날짜(최대 endDate/startDate) 기준 월로 그룹핑
    Object.values(grouped).forEach(g=>{
      const lastDate = g.items.map(r=>r.endDate||r.startDate).sort().slice(-1)[0]||'';
      g.monthKey = lastDate ? lastDate.slice(0,7) : '';
    });
    const byMonth = {};
    Object.values(grouped).forEach(g=>{
      if(!byMonth[g.monthKey]) byMonth[g.monthKey] = [];
      byMonth[g.monthKey].push(g);
    });
    const monthKeys = Object.keys(byMonth).filter(Boolean).sort();

    const rowsHtml = (list) => list
      .sort((a,b)=>{
        const aMin = a.items.map(r=>r.startDate).sort()[0]||'';
        const bMin = b.items.map(r=>r.startDate).sort()[0]||'';
        return aMin.localeCompare(bMin);
      })
      .map(g=>{
        const e = eid(g.empId);
        if(!e) return '';
        const remain = getLeaveRemain(e.id, yr);
        const isNeg = !e.isExternal && remain < 0;
        const isPast = g.allPast;
        const rowStyle = isPast ? 'background:#f3f4f6;color:var(--text3)' : (isNeg?'background:#fef2f2':'');
        const periods = g.items.slice().sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''))
          .map(r=>fmt(r.startDate)+(r.endDate&&r.endDate!==r.startDate?' ~ '+fmt(r.endDate):'')).join(', ');
        const statusHtml = isPast ? '<span style="color:var(--text3)">종료</span>'
          : g.hasPending ? statusBadge('pending')
          : statusBadge('approved');
        // 휴가기간 텍스트가 길수록 폰트 축소 (칸 안에 맞춤)
        const periodLen = periods.length;
        const periodFontSize = periodLen > 55 ? 10 : periodLen > 40 ? 11 : periodLen > 28 ? 12 : 13;
        return `<tr style="${rowStyle}">
          <td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td>
          <td>${e.dept}</td>
          <td style="font-size:${periodFontSize}px;letter-spacing:${periodLen>40?'-0.4px':'normal'};white-space:normal;word-break:keep-all;line-height:1.4">${periods}</td>
          <td>${Math.round(g.totalHours/8*10)/10}일</td>
          <td style="${!isPast&&!e.isExternal&&isNeg?'color:var(--danger);font-weight:600':''}">${e.isExternal?'⭐':(Math.round(remain/8*10)/10+'일'+(!isPast&&isNeg?' ⚠️':''))}</td>
          <td>${statusHtml}</td>
        </tr>`;
      }).join('');

    const colGroup = `<colgroup>
      <col style="width:16%"><col style="width:12%"><col style="width:38%">
      <col style="width:10%"><col style="width:14%"><col style="width:10%">
    </colgroup>`;

    const monthSections = monthKeys.map(mk=>{
      const [my, mm] = mk.split('-');
      return `<div style="margin-bottom:16px">
        <div style="font-size:14px;font-weight:700;color:#c2410c;margin-bottom:6px">${my}년 ${parseInt(mm)}월</div>
        <table style="width:100%;table-layout:fixed">${colGroup}<thead><tr><th>직원</th><th>부서</th><th>휴가기간</th><th>일수</th><th>잔여연차</th><th>상태</th></tr></thead>
        <tbody>${rowsHtml(byMonth[mk])}</tbody></table>
      </div>`;
    }).join('') || '<div style="text-align:center;color:var(--text3);padding:20px 0">하계휴가 신청 없음</div>';

    // 미신청자 (정직원+계약직, 상임이사 제외)
    const appliedIds = new Set(Object.keys(grouped));
    const notApplied = db.employees
      .filter(e=>!e.isExternal && !appliedIds.has(String(e.id)))
      .slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
    const notAppliedHtml = notApplied.length
      ? notApplied.map(e=>`<div style="padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)">${e.name}</div>`).join('')
      : '<div style="color:var(--text3);font-size:13px;padding:8px 0">없음 (전원 신청 완료)</div>';

    openModal(`
      <div class="modal-title">🏖️ ${yr}년 하계휴가 신청 현황</div>
      <div style="display:flex;gap:16px">
        <div style="flex:0 0 80%;max-height:500px;overflow-y:auto">
          ${monthSections}
        </div>

// ─ 2. 직원 명부 ────────────────────────────
function getSortedEmployees() {
  let list = [...db.employees];
  if (rosterSortKey === 'custom') {
    if (rosterOrder.length) {
      list.sort((a,b) => {
        const ai = rosterOrder.indexOf(String(a.id));
        const bi = rosterOrder.indexOf(String(b.id));
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });
    }
  } else if (rosterSortKey === 'position') {
    list.sort((a,b) => {
      const ai = POS_ORDER.findIndex(p => (a.position||'').includes(p));
      const bi = POS_ORDER.findIndex(p => (b.position||'').includes(p));
      return (ai===-1?99:ai) - (bi===-1?99:bi);
    });
  } else if (rosterSortKey === 'name') {
    list.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  } else if (rosterSortKey === 'dept') {
    list.sort((a,b) => (a.dept||'').localeCompare(b.dept||'', 'ko'));
  } else if (rosterSortKey === 'joinDate') {
    list.sort((a,b) => (a.joinDate||'').localeCompare(b.joinDate||''));
  }
  return list;
}

// 직책순-이름순 고정 정렬 (개인기록 시트용)
function getSortedByPosition() {
  return [...db.employees].filter(e=>!e.isInactive).sort((a,b) => {
    const ai = POS_ORDER.findIndex(p => (a.position||'').includes(p));
    const bi = POS_ORDER.findIndex(p => (b.position||'').includes(p));
    const posDiff = (ai===-1?99:ai) - (bi===-1?99:bi);
    if (posDiff !== 0) return posDiff;
    return (a.name||'').localeCompare(b.name||'', 'ko');
  });
}

    if(a.isInactive&&!b.isInactive)return 1;

    const ai=POS_ORDER.findIndex(p=>(a.position||'').includes(p));
    const bi=POS_ORDER.findIndex(p=>(b.position||'').includes(p));

// ── 비활성 처리 ──
async function deactivateEmp(empId) {
  const e = eid(empId); if(!e) return;
  if(!confirm(`${e.name}님을 비활성 처리하시겠습니까?\n\n- 연차/특근/대휴/출장 등 모든 현황에서 제외됩니다.\n- 데이터는 5년간 보관됩니다.\n- 재입사 시 '재입사' 버튼으로 복구 가능합니다.`)) return;
  const ok = await sbUpdate('employees', empId, {is_inactive: true});
  if(!ok){ showToast('⚠️ 처리 실패'); return; }
  e.isInactive = true;
  closeModal();
  showToast(`🚫 ${e.name}님이 비활성 처리되었습니다.`);
  go('roster');
}

// ── 재입사 처리 ──
async function reactivateEmp(empId) {
  const e = eid(empId); if(!e) return;
  // 새 입사일 입력 받기
  const newJoinDate = prompt(`${e.name}님의 재입사일을 입력하세요 (YYYY-MM-DD):`);
  if(!newJoinDate || !/^\d{4}-\d{2}-\d{2}$/.test(newJoinDate)) {
    showToast('⚠️ 날짜 형식이 올바르지 않습니다 (YYYY-MM-DD)'); return;
  }
  const newYear = parseInt(newJoinDate.slice(0,4));
  const oldYear = parseInt((e.joinDate||'').slice(0,4));
  const isSameYear = newYear === oldYear;
  let resetMsg = isSameYear
    ? `동일 연도(${newYear}년) 재입사: 기존 연차설정이 유지됩니다.`
    : `다른 연도(${newYear}년) 재입사: 연차·특근·대휴 내역이 초년차 기준으로 초기화됩니다.`;
  if(!confirm(`${e.name}님 재입사 처리\n입사일: ${newJoinDate}\n\n${resetMsg}\n\n계속하시겠습니까?`)) return;

  // 활성화 + 입사일 업데이트
  const ok = await sbUpdate('employees', empId, {is_inactive: false, join_date: newJoinDate});
  if(!ok){ showToast('⚠️ 처리 실패'); return; }
  e.isInactive = false;
  e.joinDate = newJoinDate;

  // 다른 연도 재입사: 해당 연도 연차 할당 초기화 (초년차 계산)
  if(!isSameYear && _supa) {
    // 기존 연차 할당 삭제 후 재계산
    await _supa.from('leave_allocs').delete().eq('emp_id', empId).eq('year', newYear);
    // 초년차 연차 산정 (입사월 기준 비례)
    const joinMonth = parseInt(newJoinDate.slice(5,7));
    const remainMonths = 13 - joinMonth; // 입사월~12월
    const initDays = Math.floor(remainMonths); // 월 1일씩 부여
    const initHours = initDays * 8;
    if(initHours > 0) {
      await _supa.from('leave_allocs').insert({emp_id:empId, year:newYear, total:initHours, carryover:0, extinct:0});
    }
    // 로컬 할당 업데이트
    db.leaveAllocs = db.leaveAllocs.filter(a=>!(String(a.empId)===String(empId)&&a.year===newYear));
    if(initHours > 0) db.leaveAllocs.push({empId, year:newYear, total:initHours, carryover:0, extinct:0});
    showToast(`✅ ${e.name}님 재입사 완료 (${newYear}년 연차 ${initDays}일 초기화)`);
  } else {
    showToast(`✅ ${e.name}님 재입사 완료`);
  }
  closeModal();
  go('roster');
}

async function addAnnivEvent(empId) {
  const e = eid(empId); if (!e) return;
  const name  = document.getElementById('ei-anniv-name')?.value?.trim();
  const month = parseInt(document.getElementById('ei-anniv-month')?.value);
  const day   = parseInt(document.getElementById('ei-anniv-day')?.value);
  const lunar = document.getElementById('ei-anniv-lunar')?.checked;
  if (!name) { showToast('기념일 이름을 입력하세요'); return; }
  if (!month || !day) { showToast('날짜를 입력하세요'); return; }
  const row = { emp_id: empId, type: 'anniversary', name: `${e.name} ${name}`, month, day, cal_type: lunar ? 'lunar' : 'solar', note: '' };
  const saved = await sbInsert('events', row);
  if (saved) {
    const newEv = { id: saved.id, empId, type: 'anniversary', name: row.name, month, day, calType: row.cal_type, note: '' };
    db.events.push(newEv);
    // 목록 새로고침
    const anniversaries = db.events.filter(ev => String(ev.empId) === String(empId) && ev.type === 'anniversary');
    const listEl = document.getElementById(`anniv-list-${empId}`);
    if (listEl) listEl.innerHTML = anniversaries.map(ev => `
      <div data-anniv-id="${ev.id}" style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="flex:1;font-size:14px">${ev.name}</span>
        <span style="font-size:13px;color:var(--text3)">${ev.month}월 ${ev.day}일 (${ev.calType==='lunar'?'음력':'양력'})</span>
        <button class="btn btn-sm btn-danger" style="padding:2px 8px" onclick="deleteAnniv(${ev.id})">삭제</button>
      </div>`).join('');
    document.getElementById('ei-anniv-name').value = '';
    document.getElementById('ei-anniv-month').value = '';
    document.getElementById('ei-anniv-day').value = '';
    showToast('✅ 기념일 추가됨');
  } else { showToast('⚠️ 추가 실패'); }
}

async function deleteAnniv(evId) {
  if (!confirm('기념일을 삭제하시겠습니까?')) return;
  const ok = await sbDelete('events', evId);
  if (!ok) { showToast('⚠️ 삭제 실패 - 다시 시도해주세요'); return; }
  // 로컬 즉시 반영
  db.events = db.events.filter(ev => String(ev.id) !== String(evId));
  saveAll();
  showToast('🗑️ 기념일 삭제됨');
  const el = document.querySelector(`[data-anniv-id="${evId}"]`);
  if (el) el.remove();
  // 달력/알람 즉시 갱신
  updateBdayAlarmBar();
}

async function saveEmpInfo(empId) {
  const e = eid(empId); if (!e) return;
  const name  = document.getElementById('ei-name')?.value?.trim() || e.name;
  const dept  = document.getElementById('ei-dept')?.value?.trim() || '';
  const pos   = document.getElementById('ei-pos')?.value?.trim() || '';
  const phone = document.getElementById('ei-phone')?.value?.trim() || '';
  const email = document.getElementById('ei-email')?.value?.trim() || '';
  const joinDate = getDateVal('ei-join') || e.joinDate || '';
  const birthdate = getDateVal('ei-birth') || '';
  const calSel = document.querySelector('input[name="ei-cal"]:checked');
  const birthdateLunar = calSel ? calSel.value === 'lunar' : false;
  const annexSel = document.querySelector('input[name="ei-anniv"]:checked');
  const anniversaryType = annexSel ? annexSel.value : 'birthday';
  const empType = document.querySelector('input[name="ei-emptype"]:checked')?.value || '정직원';
  const isExternal = empType === '상임이사';
  const muteNotify = document.getElementById('ei-mute')?.checked || false;

  await sbUpdate('employees', empId, {
    name, dept, position: pos, phone, email,
    join_date: joinDate || null,
    birthdate: birthdate || null,
    birthdate_lunar: birthdateLunar,
    anniversary_type: anniversaryType,
    is_external: isExternal,
    employment_type: empType,
    mute_notify: muteNotify
  });
  Object.assign(e, { name, dept, position: pos, phone, email, joinDate, birthdate, birthdateLunar, anniversaryType, isExternal, employmentType: empType, muteNotify });
  // 생일 이벤트 자동 동기화
  await syncBirthdayEvent(e); // 생일 없으면 기존 이벤트 삭제
  saveAll(); showToast('✅ 저장되었습니다'); closeModal(); renderRoster();
}

async function deleteEmp(id){
  if(!confirm('삭제?'))return;
  // 해당 직원 events 먼저 삭제 (고아 데이터 방지)
  const empEvents = db.events.filter(ev => String(ev.empId) === String(id));
  for (const ev of empEvents) { await sbDelete('events', ev.id); }
  db.events = db.events.filter(ev => String(ev.empId) !== String(id));
  await sbDelete('employees', id);
  db.employees = db.employees.filter(e => String(e.id) !== String(id));
  saveAll(); showToast('🗑️ 삭제됨'); renderRoster();
}

      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">

        <tbody>${rows||emptyRow(8)}</tbody>
      </table></div>
    </div>
    ${isAdmin?`<div class="card" style="margin-top:8px">
      <div class="card-title">🏥 건강검진 신청 현황 (${db.health.filter(h=>String(h.year)===String(yr)).length}건)</div>
      <div class="table-wrap"><table>
        <thead><tr><th>직원</th><th>부서</th><th>예약일</th><th>가족</th><th>신청일</th><th>상태</th><th>처리</th></tr></thead>
        <tbody>${healthRows}</tbody>
      </table></div>
    </div>`:''}
    ${isAdmin?renderVehApprovalCard():''}
  `);
}
function setRF(f){reqFilter=f;renderRequests();}
function setRTF(f){reqTypeFilter=f;renderRequests();}
async function approveReq(id){
  _keepScroll=true;
  const r=db.requests.find(x=>String(x.id)===String(id));
  if(r){
    r.status='approved';
    const updateData={status:'approved'};
    // substitute가 있으면 함께 저장 (덮어쓰지 않도록 기존값 유지)
    if(r.substitute) updateData.substitute=r.substitute;
    // 교통비 전환 신청이면 useTransport도 함께 승인
    if(r.transReqPending){
      r.useTransport=true;
      r.transReqPending=false;
      updateData.use_transport=true;
      updateData.trans_req_pending=false;
    }
    await sbUpdate('requests', id, updateData);
    saveAll();
    showToast(r.useTransport?'✅ 승인됨 — 교통비 전환 완료 (교통비 관리에 반영)':'✅ 승인됨');
  }
  renderRequests();
}
async function rejectReq(id){
  _keepScroll=true;
  const r=db.requests.find(x=>String(x.id)===String(id));
  if(r){
    const updateData={status:'rejected'};
    // 교통비 전환 신청 취소면 transReqPending 초기화 (status는 기존 approved 유지)
    if(r.transReqPending){
      r.transReqPending=false;
      updateData.trans_req_pending=false;
      delete updateData.status; // status는 approved 그대로 유지
      r.status=r.status; // 변경 없음
      await sbUpdate('requests', id, {trans_req_pending:false});
      saveAll(); showToast('↩️ 교통비 전환 신청 취소됨');
    } else {
      r.status='rejected';
      await sbUpdate('requests', id, {status:'rejected'});
      saveAll(); showToast('❌ 반려됨');
    }
  }
  renderRequests();
}
async function delReq(id,rerender){
  const r=db.requests.find(x=>String(x.id)===String(id));
  if(!r)return;
  const isPending=r.status==='pending';
  const msg=isPending?'승인 대기 중인 신청을 취소하시겠습니까?':'삭제하시겠습니까?';
  if(!confirm(msg))return;
  let ok=false;
  if(_supa){
    if(!isAdmin&&isPending){
      // 직원: pending 건은 cancelled로 상태 업데이트 (RLS DELETE 권한 없어도 UPDATE로 처리)
      const {error}=await _supa.from('requests').update({status:'cancelled'}).eq('id',id);
      if(error){console.error('cancel error:',error);showToast('⚠️ 취소 실패: '+error.message);return;}
      ok=true;
    } else {
      // 관리자: 완전 삭제
      const {error}=await _supa.from('requests').delete().eq('id',id);
      if(error){console.error('delete error:',error);showToast('⚠️ 삭제 실패: '+error.message);return;}
      ok=true;
    }
  } else {ok=true;}
  if(ok){
    if(!isAdmin&&isPending){
      // 로컬에서 cancelled로 변경 후 목록에서 제거
      db.requests=db.requests.filter(x=>String(x.id)!==String(id));
    } else {
      db.requests=db.requests.filter(x=>String(x.id)!==String(id));
    }
    saveAll();
    showToast(isPending&&!isAdmin?'✅ 신청이 취소되었습니다':'🗑️ 삭제됨');
  }
  if(rerender==='ot')renderOT();
  else if(rerender==='trip')renderTrip();
  else if(rerender==='leave')renderLeave();
  else renderRequests();
}

// ─ 4. 연차 ─────────────────────────────────
function renderLeave(){
  const yr=currentYear;

  // 3~5번: canView 적용 + 본인 내역 전체 표시
  const leaveRows=db.requests.filter(r=>r.type==='leave'&&String(r.year)===String(yr)&&canView(r)).slice().sort((a,b)=>b.id-a.id).map(r=>{
    const e=eid(r.empId);
    return`<tr class="${r.status==='pending'?'row-pending':r.status==='rejected'?'row-rejected':''}">
      <td><div class="name-cell">${av(r.empId)}<span>${e?e.name:'?'}</span></div></td>
      <td>${e?e.dept:''}</td><td>${r.leaveType}</td>
      <td>${fmt(r.startDate)}</td><td>${fmt(r.endDate||r.startDate)}</td>
      <td>${['병가','특별휴가'].includes(r.leaveType)?'<span style="color:var(--text3);font-size:13px">차감없음</span>':`${r.hours}h (${Math.round((+r.hours)/8*10)/10}일)`}</td>
      <td style="font-size:13px;color:var(--text2)">${r.reason}</td>
      <td>${r.attachmentUrl
        ?`<a href="${r.attachmentUrl}" target="_blank" style="font-size:14px;color:var(--accent)" title="첨부파일 보기">📎 확인</a>`
        :(['병가','특별휴가'].includes(r.leaveType)?'<span style="color:var(--danger);font-size:13px">⚠️ 미첨부</span>':'—')}</td>
      <td>${statusBadge(r.status)}</td>
      <td style="white-space:nowrap">
        ${canEdit(r)?`<button class="btn btn-sm" onclick="openEditLeave(${r.id})">✏️ 수정</button>`:''}
        ${canEdit(r)&&(isAdmin||r.status==='pending')?`<button class="btn btn-sm btn-danger" style="margin-left:4px" onclick="delReq(${r.id},'leave')">삭제</button>`:''}
        ${['병가','특별휴가'].includes(r.leaveType)&&currentEmp&&String(r.empId)===String(currentEmp.id)&&r.status==='approved'&&!r.attachmentUrl
          ?`<button class="btn btn-sm" style="margin-left:4px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d" onclick="openLeaveAttachUpload(${r.id})">📎 서류 첨부</button>`:''}
      </td>
    </tr>`;
  }).join('');

  // 6~11번: 개인별 현황 테이블 (법정연차 자동계산 + 사용률 3/1기준 + 관리자 경고)
  const alertThreshold = getLeaveAlertThreshold();
  const leaveEmps = isAdmin
    ? getSortedByPosition().filter(e=>!isHiddenFromPersonal(e))
    : getSortedByPosition().filter(e=>!isHiddenFromPersonal(e) && currentEmp && String(e.id)===String(currentEmp.id));
  const sumRows=leaveEmps.map(e=>{
    const isYanggam = isYanggamContract(e.id);
    const yanggamJoin = isYanggam ? getYanggamJoinDate(e.id) : e.joinDate;
    const a=getAlloc(e.id,yr);
    const legalDays = calcLegalLeave(yanggamJoin); // 법정 연차 (양감계약직은 전용 입사일 기준)
    const total = isYanggam ? legalDays*8 : (+a.total||0)+(+a.carryover||0);
    const extinct = isYanggam ? 0 : (+a.extinct||0);
    const used=getLeaveUsed(e.id,yr);
    const rem = isYanggam ? getLeaveRemain(e.id,yr) : total-extinct-used;
    const pct=getLeavePctInPeriod(e.id,yr); // 3/1 기준 사용률
    const remDays=Math.round(rem/8*10)/10;
    // 11번: 잔여 경고 (관리자에게만, 잔여% 기준) - 양감계약직은 제외
    const remPct = total > 0 ? Math.round(rem/total*100) : 0;
    const remAlert = isAdmin && !isYanggam && (() => {
      const threshold = getLeaveAlertThreshold();
      if (threshold === null) return false;
      return remPct >= threshold;
    })();
    const NA=`<span style="font-size:13px;color:#bbb">임원</span>`;
    const yanggamBadge=isYanggam?`<span class="badge" style="background:#fef3c7;color:#92400e;border:1px solid #fcd34d;font-size:11px;margin-left:5px">양감 계약직</span>`:'';
    return`<tr ${e.isExternal?'style="background:#fafafa"':''}>
      <td><div class="name-cell">${av(e.id)}
        <span style="color:var(--accent);cursor:pointer;text-decoration:underline" onclick="${e.isExternal?'':isAdmin?`openLeaveAdmin(${e.id})`:`openAddLeave(${e.id})`}">${e.name}</span>
        ${e.isExternal?`<span class="badge" style="background:#f1f0ec;color:#888;border:1px solid #ddd;font-size:11px;margin-left:5px">⭐</span>`:''}
        ${yanggamBadge}
      </div></td>
      <td>${e.dept}</td>
      <td>${e.isExternal?NA:`${(+a.carryover||0)/8}일`}</td>
      <td>${e.isExternal?NA:`<span title="법정연차: ${legalDays}일">${(+a.total||0)/8}일 <span style="font-size:11px;color:var(--text3)">(법정${legalDays}일)</span></span>`}</td>
      <td>${e.isExternal?NA:`${total/8}일${extinct>0?` <span style="font-size:11px;color:var(--danger)">(-${extinct/8}소멸)</span>`:''}`}</td>
      <td>${e.isExternal?NA:badge(Math.round(used/8*10)/10+'일 ('+used+'h)','leave')}</td>
      <td>${e.isExternal?NA:`<span style="${remAlert?'color:var(--danger);font-weight:700':''}">${remDays}일${remAlert?' ⚠️':''}</span>`}</td>
      <td>${e.isExternal?NA:`<span style="${remAlert?'color:var(--danger);font-weight:700':''}">${pct}%${remAlert?' ⚠️':''}</span>
        <div class="prog-bar-wrap" style="width:60px"><div class="prog-bar" style="width:${pct}%;background:${remAlert?'var(--danger)':'var(--leave)'}"></div></div>`}</td>
    </tr>`;
  }).join('');

  // 5번: 연차 사용률 그래프 데이터
  const deptMap = {};
  getSortedByPosition().filter(e=>!isHiddenFromPersonal(e)).forEach(e=>{
    const a=getAlloc(e.id,yr);
    const total=(+a.total||0)+(+a.carryover||0)-(+a.extinct||0);
    const used=getLeaveUsed(e.id,yr);
    const pct=total>0?Math.round(used/total*100):0;
    if(!deptMap[e.dept]) deptMap[e.dept]={total:0,used:0,count:0};
    deptMap[e.dept].total+=total;
    deptMap[e.dept].used+=used;
    deptMap[e.dept].count++;
  });
  const deptBars=Object.entries(deptMap).map(([dept,d])=>{
    const p=d.total>0?Math.round(d.used/d.total*100):0;
    return`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
        <span style="font-weight:500">${dept}</span>
        <span style="color:var(--text2)">${Math.round(d.used/8*10)/10}일 / ${Math.round(d.total/8*10)/10}일 (${p}%)</span>
      </div>
      <div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden">
        <div style="width:${p}%;background:var(--leave);height:100%;border-radius:4px;transition:width .3s"></div>
      </div>
    </div>`;
  }).join('');

  setContent(`
    <div class="card" style="margin-bottom:10px">
      <div class="card-title">📊 부서별 연차 사용률 (${yr}년)</div>
      ${deptBars||'<div style="color:var(--text3);font-size:14px">데이터 없음</div>'}
    </div>
    ${isAdmin&&alertThreshold?`<div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:var(--radius);padding:8px 14px;margin-bottom:12px;font-size:13px;color:var(--danger)">⚠️ 이번 달 기준: 잔여 연차 ${alertThreshold}% 이상인 직원이 빨간색으로 표시됩니다.</div>`:''}
    <div class="card">
      <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <span>개인별 연차 현황 (${yr}년 · 사용률 기준: ${yr}/3/1 ~ ${yr+1}/2/28)</span>
        ${isAdmin?`<button class="btn btn-sm btn-primary" onclick="openAddLeave()">📝 대리 신청</button>`:''}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>직원</th><th>부서</th><th>이월</th><th>부여</th><th>총계</th><th>사용</th><th>잔여</th><th>사용률</th></tr></thead>
        <tbody>${sumRows}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-title">연차 신청 내역 (${yr}년)
        <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
          ${adminSearchInput("leave-search","leave-table")}
          <button class="btn btn-primary btn-sm" onclick="openAddLeave()">+ 신청</button>
        </div>
      </div>
      <div class="table-wrap"><table id="leave-table">
        <thead><tr><th>직원</th><th>부서</th><th>구분</th><th>시작일</th><th>종료일</th><th>시간</th><th>사유</th><th>첨부/서류</th><th>상태</th><th></th></tr></thead>
        <tbody>${leaveRows||emptyRow(10)}</tbody>
      </table></div>
    </div>
  `);
}

// 6번: 관리자가 직원 이름 클릭 시 연차 신청 + 부여 연차 설정
function openLeaveAdmin(empId) {
  const e = eid(empId); if (!e) return;
  const yr = currentYear;
  const a = getAlloc(empId, yr);
  const legalDays = calcLegalLeave(e.joinDate);
  openModal(`
    <div class="modal-title">${e.name} 연차 관리</div>
    <div style="background:var(--bg);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><span style="color:var(--text3)">입사일</span> <strong>${fmt(e.joinDate)||'미등록'}</strong></div>
        <div><span style="color:var(--text3)">법정 연차</span> <strong>${legalDays}일</strong></div>
        <div><span style="color:var(--text3)">사용</span> <strong>${Math.round(getLeaveUsed(empId,yr)/8*10)/10}일</strong></div>
        <div><span style="color:var(--text3)">잔여</span> <strong>${Math.round(getLeaveRemain(empId,yr)/8*10)/10}일</strong></div>
      </div>
    </div>
    <div class="form-grid" style="margin-bottom:8px">
      <div class="field">
        <label>${yr}년 부여 연차 (일) <span style="font-size:12px;color:var(--text3)">법정: ${legalDays}일</span></label>
        <input id="la-total" type="number" value="${(+a.total||0)/8}" min="0" max="25">
      </div>
      <div class="field">
        <label>이월 연차 (일)</label>
        <input id="la-carry" type="number" value="${(+a.carryover||0)/8}" min="0">
      </div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label style="color:var(--danger)">이월된 연차 소멸 (일) <span style="font-size:12px;color:var(--text3)">※ 잔여연차에서 차감</span></label>
      <input id="la-extinct" type="number" value="${(+a.extinct||0)/8}" min="0" step="0.5"
        style="border-color:var(--danger)">
    </div>
    <div style="background:var(--bg);border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--text2);margin-bottom:12px">
      소멸 후 잔여: <strong id="la-preview">계산 중...</strong>
      ${(+a.extinct||0)>0 ? `<div style="color:var(--danger);margin-top:4px">⚠️ 소멸 처리된 연차: <strong>${(+a.extinct||0)/8}일 (${+a.extinct||0}h)</strong></div>` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveLeaveAdmin(${empId})">저장</button>
    </div>
    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px">
      <button class="btn btn-primary btn-sm" onclick="closeModal();openAddLeave(${empId})">+ 연차 신청 (대리)</button>
    </div>
  `);
  // 소멸 후 잔여 실시간 계산
  const _laUsedH = getLeaveUsed(empId, yr);
  setTimeout(() => {
    const updatePreview = () => {
      const t = (parseFloat(document.getElementById('la-total')?.value)||0) * 8;
      const c = (parseFloat(document.getElementById('la-carry')?.value)||0) * 8;
      const x = (parseFloat(document.getElementById('la-extinct')?.value)||0) * 8;
      const remH = t + c - x - _laUsedH;
      const remD = Math.round(remH/8*10)/10;
      const pr = document.getElementById('la-preview');
      if (pr) pr.textContent = remD.toFixed(1) + '일 (' + Math.round(remH) + 'h)';
    };
    updatePreview();
    ['la-total','la-carry','la-extinct'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', updatePreview);
    });
  }, 150);
}

async function saveLeaveAdmin(empId) {
  const yr = currentYear;
  const total = (parseFloat(document.getElementById('la-total')?.value)||0) * 8;
  const carryover = (parseFloat(document.getElementById('la-carry')?.value)||0) * 8;
  const extinct = (parseFloat(document.getElementById('la-extinct')?.value)||0) * 8;
  const a = getAlloc(empId, yr);
  a.total = total; a.carryover = carryover; a.extinct = extinct;
  if (a.id) {
    await sbUpdate('leave_alloc', a.id, { total, carryover, extinct });
  } else {
    const saved = await sbInsert('leave_alloc', { emp_id: empId, year: yr, total, carryover, extinct });
    if (saved) a.id = saved.id;
  }
  saveAll(); showToast('✅ 연차 저장됨'); closeModal(); renderLeave();
}

// ─ 5. 특근/대체휴무 ────────────────────────
function renderOT(){
  const yr=currentYear;
  const otRows=db.requests.filter(r=>r.type==='ot'&&String(r.year)===String(yr)&&canView(r)).slice().sort((a,b)=>b.id-a.id).map(r=>{
    const ch=calcComp(r.hours,r.otType);

function toggleTrans(id){const r=db.requests.find(x=>String(x.id)===String(id));if(r){r.useTransport=!r.useTransport;saveAll();showToast(r.useTransport?'🚗 교통비 전환':'🔄 대휴 전환');renderOT();}}

// 교통비 전환 신청 (직원 → 관리자 승인 필요)
function requestTransConvert(otId){
  const r=db.requests.find(x=>String(x.id)===String(otId));
  if(!r||r.status!=='approved'){showToast('⚠️ 승인된 특근만 전환 신청 가능');return;}
  const amt=(+r.hours)*TRANSPORT_RATE;
  if(!confirm(`🚗 교통비 전환 신청\n\n날짜: ${fmt(r.date)} / ${r.hours}h\n금액: ₩${amt.toLocaleString()}\n\n관리자 승인 후 교통비로 전환됩니다.\n대체휴무는 소멸됩니다.\n\n신청하시겠습니까?`))return;
  // 관리자면 즉시 전환, 직원이면 승인대기 처리 → 승인 탭에 표시
  if(isAdmin){
    r.useTransport=true;
    sbUpdate('requests',r.id,{use_transport:true});
    saveAll();showToast('✅ 교통비 전환 완료');renderOT();
  } else {
    // 전환 신청을 별도 pending 플래그로 표시
    r.transReqPending=true;
    sbUpdate('requests',r.id,{trans_req_pending:true});
    saveAll();showToast('✅ 교통비 전환 신청 완료 — 관리자 승인 대기');renderOT();
    notifyAdmin({type:'ot',empId:r.empId,reason:'교통비 전환 신청: '+fmt(r.date)+' '+r.hours+'h → ₩'+amt.toLocaleString()});
  }
}

// ─ 8. 생일/기념일 ──────────────────────────
function renderBday(){
  const yr=currentYear;
  const todayD=parseLocalDate(todayStr());
  const rows=db.events.slice().sort((a,b)=>{const da=getEventDate(a,yr)||'9999';const db2=getEventDate(b,yr)||'9999';return da.localeCompare(db2);}).map(ev=>{
    const e=eid(ev.empId);
    const ds=getEventDate(ev,yr);
    const diff=ds?Math.round((parseLocalDate(ds)-todayD)/864e5):null;
    const upcoming=diff!==null&&diff>=0&&diff<=30;
    const isPast=diff!==null&&diff<0;
    // 지난 날짜 → 옅은 회색 배경
    const rowBg=isPast?'style="background:#f3f3f3;color:#999"':'';
    return`<tr ${rowBg}>
      <td>${e?`<div class="name-cell">${av(ev.empId)}<span${isPast?' style="color:#999"':''}>${e.name}</span></div>`:(ev.empId===0||ev.empId===null||ev.empId===undefined)?badge('전사','bday'):badge('?','neutral')}</td>
      <td${isPast?' style="color:#999"':''}>${ev.name}</td>
      <td>${ev.type==='birthday'?badge('생일','bday'):badge('기념일','neutral')}</td>
      <td>${ev.calType==='lunar'?badge('음력','warn'):badge('양력','neutral')}</td>
      <td${isPast?' style="color:#aaa"':''}>${ev.month}월 ${ev.day}일</td>
      <td${isPast?' style="color:#aaa"':''}>${ds?fmt(ds):'—'}${ev.calType==='lunar'?'<span style="font-size:11px;color:var(--text3)"> (음→양)</span>':''}</td>
      <td>${upcoming?`<span class="upcoming-chip">D-${diff}</span>`:diff===0?badge('오늘!','bday'):isPast?'<span style="font-size:12px;color:#bbb">경과</span>':''}</td>
      <td style="font-size:13px;color:${isPast?'#bbb':'var(--text2)'}">${ev.note||''}</td>
      ${isAdmin?`<td style="white-space:nowrap"><button class="btn btn-sm" onclick="openEditEvent(${ev.id})">수정</button> <button class="btn btn-sm btn-danger" onclick="delEvent(${ev.id})">삭제</button></td>`:'<td></td>'}
    </tr>`;
  }).join('');
  // db.events에서 기념일/생일 (올해 지났으면 내년으로)
  const evList30 = db.events.map(ev=>{
    let ds=getEventDate(ev,yr);
    if(!ds)return null;
    let diff=Math.round((parseLocalDate(ds)-todayD)/864e5);
    if(diff<0){ ds=getEventDate(ev,yr+1); if(!ds)return null; diff=Math.round((parseLocalDate(ds)-todayD)/864e5); }
    if(diff<0||diff>30)return null;
    return{...ev,ds,diff};
  }).filter(Boolean);
  // 직원 birthdate 직접 계산 (events 테이블에 없는 경우 보완)
  const evIds = new Set(evList30.map(ev=>String(ev.empId)));
  db.employees.filter(e=>e.birthdate&&!e.isExternal).forEach(e=>{
    if(evIds.has(String(e.id))) return; // 이미 events에 있으면 스킵
    const parts=e.birthdate.split('-');
    if(parts.length<3)return;
    const m=parseInt(parts[1]),d=parseInt(parts[2]);
    let ds=`${yr}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let diff=Math.round((parseLocalDate(ds)-todayD)/864e5);
    if(diff<0){ds=`${yr+1}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;diff=Math.round((parseLocalDate(ds)-todayD)/864e5);}
    if(diff<0||diff>30)return;
    evList30.push({id:'bd_'+e.id,empId:e.id,type:'birthday',name:e.name+' 생일',month:m,day:d,calType:e.birthdateLunar?'lunar':'solar',ds,diff});
  });
  const upcoming30=evList30.sort((a,b)=>a.diff-b.diff);
  setContent(`
    <div class="info-bar" style="background:var(--bday-bg);border:1px solid #7dd3fc;color:var(--bday)">🎂 음력 생일은 해당 연도 양력으로 자동 변환됩니다.</div>
    ${upcoming30.length?`<div class="card"><div class="card-title">30일 이내 예정</div><div style="display:flex;flex-wrap:wrap;gap:10px">${upcoming30.map(ev=>`<div style="padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-lg)"><div style="font-weight:500;font-size:14px;margin-bottom:3px">${ev.name}</div><div style="font-size:12px;color:var(--text2)">${fmt(ev.ds)}${ev.calType==='lunar'?' (음→양)':''}</div><div style="margin-top:5px"><span class="upcoming-chip">D-${ev.diff}</span></div></div>`).join('')}</div></div>`:''}
    <div class="card"><div class="card-title">${yr}년 기념일 목록${isAdmin?`<div style="display:flex;gap:6px;margin-left:auto"><button class="btn btn-sm" style="background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc" onclick="openAddEvent()">👤 개인 등록</button><button class="btn btn-primary btn-sm" onclick="openAddCompanyEvent()">🏢 전체 등록</button></div>`:''}</div>
      <div class="table-wrap"><table><thead><tr><th>직원</th><th>명칭</th><th>구분</th><th>달력</th><th>날짜</th><th>${yr}년 양력</th><th>D-day</th><th>비고</th><th></th></tr></thead><tbody>${rows||emptyRow(9)}</tbody></table></div>
    </div>
  `);
}

// ─ 9. 건강검진 ─────────────────────────────
function calcHealthCost(birthdate){
  // 생년월일로 만 40세 이상 여부 계산
  if(!birthdate) return 250000;
  const birth=parseLocalDate(birthdate);
  if(!birth) return 250000;
  const today=new Date();
  let age=today.getFullYear()-birth.getFullYear();
  const m=today.getMonth()-birth.getMonth();
  if(m<0||(m===0&&today.getDate()<birth.getDate())) age--;
  return age>=40?300000:250000;
}

function renderHealth(){
  const yr=currentYear;
  let empTotal=0,empDone=0,famTotal=0,famDone=0;

  // 타기관 검진자 목록 (별도 집계)
  const otherClinicEmps = [];
  db.employees.filter(e=>!e.isExternal&&!e.isInactive).forEach(e=>{
    const h=db.health.find(r=>String(r.empId)===String(e.id)&&String(r.year)===String(yr));
    // otherClinic: status 또는 members에서 확인 (두 경로 모두 지원)
    const _mainMember = h?.members?.find(m=>m.relation==='본인') || h?.members?.[0];
    const isOther = h?.status==='other_clinic' || _mainMember?.otherClinic === true;
    if(isOther) { otherClinicEmps.push({e,h}); return; } // 타기관은 별도 집계, 메인 통계 제외
    empTotal++;
    if(h?.status==='completed') empDone++;
    (h?.members||[]).filter(m=>m.relation!=='본인').forEach(m=>{famTotal++;if(m.confirmed)famDone++;});
  });
  const totalAll = empTotal + famTotal;
  const doneAll = empDone + famDone;
  const pctAll = totalAll>0?Math.round(doneAll/totalAll*100):0;
  const pctEmp = empTotal>0?Math.round(empDone/empTotal*100):0;
  const otherClinicCount = otherClinicEmps.length;

  const statusBadge2 = (h) => {
    if (!h) return badge('미신청','neutral');
    if (h.status==='completed') return badge('✓ 수검완료','ok');
    if (h.status==='approved') return badge('승인됨','ok');
    if (h.status==='modify_requested') return badge('수정신청','warn');
    return badge('승인대기','warn');
  };

  // 2번: 수검일 오름차순 정렬
  const showEmps = isAdmin
    ? db.employees.filter(e=>!e.isExternal&&!e.isInactive)
    : db.employees.filter(e=>currentEmp && String(e.id)===String(currentEmp.id));

  const sortedEmps = showEmps.slice().sort((a,b)=>{
    const ha = db.health.find(r=>String(r.empId)===String(a.id)&&String(r.year)===String(yr));
    const hb = db.health.find(r=>String(r.empId)===String(b.id)&&String(r.year)===String(yr));
    const da = ha?.reserveDate||'9999-99-99';
    const db2 = hb?.reserveDate||'9999-99-99';
    return da.localeCompare(db2); // 오름차순 (예약일 빠른 순)
  });

  const rows = sortedEmps.map(e=>{
    const h=db.health.find(r=>String(r.empId)===String(e.id)&&String(r.year)===String(yr));
    const isMine = currentEmp && String(e.id)===String(currentEmp.id);
    // 5번: 가족 관계 표시
    const famMembers = (h?.members||[]).filter(m=>m.relation!=='본인');
    const famBadges = famMembers.map(m=>`<span class="badge" style="font-size:11px;margin-right:2px">${m.relation}${isAdmin&&m.name?'('+m.name+')':''}</span>`).join('');
    return`<tr>
      <td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td>
      <td>${e.dept}</td>
      <td style="font-size:13px">${h?.reserveDate?fmt(h.reserveDate):'—'}</td>
      <td style="font-size:13px">${h?.checkupDate?fmt(h.checkupDate):'—'}</td>
      <td>${statusBadge2(h)}</td>
      <td style="font-size:12px">${famBadges||'—'}</td>
      <td style="white-space:nowrap">
        ${(isMine||isAdmin)?`<button class="btn btn-sm btn-primary" onclick="openHealthApply(${e.id})">${h?'수정':'예약신청'}</button>`:''}
        ${isAdmin&&h&&(h.status==='pending'||h.status==='modify_requested')?`<button class="btn btn-sm btn-ok" style="margin-left:4px" onclick="approveHealth(${e.id})">승인</button>`:''}
        ${(isMine||isAdmin)&&h&&h.status==='approved'?`<button class="btn btn-sm" style="margin-left:4px" onclick="openHealthComplete(${e.id})">수검완료</button>`:''}
        ${(isMine||isAdmin)&&h?`<button class="btn btn-sm btn-danger" style="margin-left:4px" onclick="deleteHealth(${e.id})">삭제</button>`:''}
      </td>
    </tr>`;
  }).join('');

  // 타기관 검진자 행
  const otherRows = otherClinicEmps.map(({e,h})=>{
    const isMine = currentEmp && String(e.id)===String(currentEmp.id);
    const famMembers = (h?.members||[]).filter(m=>m.relation!=='본인');
    const famBadges = famMembers.map(m=>`<span class="badge" style="font-size:11px;margin-right:2px">${m.relation}</span>`).join('');
    return`<tr style="background:#fef9ec">
      <td><div class="name-cell">${av(e.id)}<span>${e.name}</span></div></td>
      <td>${e.dept}</td>
      <td colspan="2" style="font-size:13px;color:var(--text2)">타기관 검진 (실비지원)</td>

      <td style="font-size:12px">${famBadges||'—'}</td>
      <td style="white-space:nowrap">
        ${(isMine||isAdmin)?`<button class="btn btn-sm btn-primary" onclick="openHealthApply(${e.id})">수정</button>`:''}
        ${(isMine||isAdmin)?`<button class="btn btn-sm btn-danger" style="margin-left:4px" onclick="deleteHealth(${e.id})">삭제</button>`:''}
      </td>
    </tr>`;
  }).join('');

  // 비용 집계 계산 (관리자만)
  let costGrandTotal = 0;
  let costDeptMap = {};
  if (isAdmin) {
    db.employees.filter(e=>!e.isExternal&&!e.isInactive).forEach(e=>{

      const h=db.health.find(r=>String(r.empId)===String(e.id)&&String(r.year)===String(yr));
      if(h&&h.members?.length){
        costDeptMap[e.dept].applied++;
        const main=h.members.find(m=>m.relation==='본인');
        const fam=h.members.filter(m=>m.relation!=='본인');
        costDeptMap[e.dept].empCost+=(+main?.cost||calcHealthCost(e.birthdate));
        fam.forEach(m=>costDeptMap[e.dept].famCost+=(+m.cost||calcHealthCost(m.birthdate)));
      }
    });
    costGrandTotal = Object.values(costDeptMap).reduce((s,d)=>s+d.empCost+d.famCost,0);

  window._healthCostDeptMap = costDeptMap;

      <div class="stat-card health" style="padding:10px 12px"><div class="stat-label" style="font-size:12px">전체 완료율</div><div class="stat-val">${pctAll}%</div><div class="stat-sub" style="font-size:11px">${doneAll}/${totalAll}명</div></div>
      ${isAdmin?`<div class="stat-card" style="padding:10px 12px;background:#fdf4ff;cursor:pointer;position:relative" onclick="openHealthCostDetail()" title="클릭하면 비용 집계 내역을 확인할 수 있습니다">

async function saveHealthApply(empId) {
  const otherClinic = document.getElementById('h-other-clinic')?.checked || false;
  let reserveDate = '';
  if (!otherClinic) {
    const resY = document.getElementById('h-res-year')?.value;
    const resM = String(document.getElementById('h-res-month')?.value||'').padStart(2,'0');
    const resD = String(document.getElementById('h-res-day')?.value||'').padStart(2,'0');
    reserveDate = (resY&&resM&&resD) ? `${resY}-${resM}-${resD}` : '';
    if (!reserveDate || resY.length!==4) { showToast('예약일을 올바르게 입력하세요 (년 4자리)'); return; }
  }
  const yr = currentYear;
  const h = db.health.find(r=>String(r.empId)===String(empId)&&String(r.year)===String(yr));
  // 타기관 검진이면 별도 status 사용 (미검진과 구분)
  const newStatus = otherClinic ? 'other_clinic'
    : (h?.status === 'approved' ? 'modify_requested' : 'pending');

  // 가족 정보 수집
  const famRows = document.querySelectorAll('#fam-list .fam-row');
  // otherClinic은 위에서 처리됨
  const members = [{relation:'본인', birthdate:'', confirmed:false, reserveDate, checkupDate:'', cost:0, otherClinic}];
  famRows.forEach(row => {
    const relEl = row.querySelector('input[id^="fam-rel"]');
    const nameEl = row.querySelector('input[id^="fam-name"]');
    const birthEl = row.querySelector('input[id^="fam-birth"]');
    const rel = relEl?.value?.trim();
    if (rel) {
      let birthdate = (birthEl?.value||'').trim();
      // 간단한 형식 검증 (YYYY-MM-DD)
      if (birthdate && !/^\d{4}-\d{2}-\d{2}$/.test(birthdate)) {
        showToast('⚠️ '+rel+' 생년월일 형식을 확인해 주세요 (예: 1970-01-01)');
        birthdate = '';
      }
      members.push({relation:rel, name:nameEl?.value?.trim()||'', birthdate, confirmed:false, reserveDate:'', checkupDate:'', cost:0});
    }
  });

  if (h?.id) {
    const membersJson = JSON.stringify(members);
    const ok = await sbUpdate('health_records', h.id, {
      reserve_date: reserveDate, status: newStatus, approved: false, members_json: membersJson
    });
    if (ok) {
      h.reserveDate = reserveDate;
      h.status = newStatus;
      h.approved = false;
      h.members = members; // 로컬에도 반영 (otherClinic 포함)
      try { h.members = JSON.parse(membersJson); } catch(e) {}
    }
  } else {
    const saved = await sbInsert('health_records', {
      emp_id: empId, year: yr, members_json: JSON.stringify(members),
      reserve_date: reserveDate, status: otherClinic?'other_clinic':'pending', approved: otherClinic
    });
    if (saved) {
      const membersJson2 = JSON.stringify(members);
      db.health.push(normalizeHealth({...saved, reserve_date: reserveDate, status:'pending', approved:false, members_json: membersJson2, status: otherClinic?'other_clinic':'pending', approved: otherClinic}));
    }
  }
  saveAll();
  await notifyHealthChange(empId, members, reserveDate);
  showToast('✅ 건강검진 신청됨 — 관리자 승인 대기');
  closeModal();
  renderHealth();
}
